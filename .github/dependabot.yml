# Dependency updates, weekly. Titles read "deps: bump …" (the pr-title rule). The site's
# npm and Docker base images live in web/; the Go modules and the backend images are not
# covered yet.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: deps }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: deps }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: deps }
    groups:
      actions:
        patterns: ['*']
