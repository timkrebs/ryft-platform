# Every push: vet, race tests, lint, manifest validation, the end-to-end smoke test
# and every Terraform root (offline); then build the images and push them to
# ghcr.io/timkrebs/ryft/<service>:<short-sha>. On main, `promote` then pins the EKS
# overlay to them in a PR that merges itself once its checks pass, and Argo CD
# deploys the merge (docs/OPERATIONS.md → Deploy, D96). No :latest: nothing deploys it.
name: ci

on:
  push:
    # The promote PRs' branches: their checks run once, as pull_request.
    branches-ignore: ["deploy/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway server for the opt-in migration and store tests (account
    # deletion races); they create and drop their own databases.
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 15
      # The broker production runs (deploy/rabbitmq/cluster), for internal/events/amqpbus:
      # publish/consume, confirms, the retry tiers, dead letters, reconnects and the
      # permission matrix, each test in a vhost of its own.
      rabbitmq:
        image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
        env: { RABBITMQ_DEFAULT_USER: admin, RABBITMQ_DEFAULT_PASS: admin }
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s
          --health-timeout 10s --health-retries 30
    env:
      RYFT_TEST_POSTGRES_URL: postgres://postgres:pw@localhost:5432/postgres
      RYFT_TEST_AMQP_URL: amqp://admin:admin@localhost:5672/
      RYFT_TEST_AMQP_MGMT: http://admin:admin@localhost:15672
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      - run: make k8s-validate
      # Every image the overlay pins exists on ghcr.io (a promote PR, or a hand-made
      # pin with a typo: 101bc7 for 1015bc7 stopped the migrate job on 2026-10-21).
      - run: ./scripts/check_registry.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make up CONTAINER=docker
      - run: make smoke
      # The per-service NATS users and permissions of deploy/k8s/base/nats/nats.conf.
      - name: NATS permissions
        working-directory: backend
        env:
          RYFT_TEST_NATS_URL: nats://localhost:4222
        run: go test -count=1 -run Permissions ./internal/events/natsbus/
      # Argo CD's PostSync smoke, the Go one in the migrate image.
      - run: make smoke-hook CONTAINER=docker
      # trace.sh and friends against a fake kubectl and the running api.
      - run: make test-scripts
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: make down CONTAINER=docker

  # Every Terraform root, offline: no HCP Terraform token, no cloud credentials. State
  # lives in HCP Terraform and plans/applies run on the operator's machine
  # (docs/OPERATIONS.md → Terraform state); CI only proves the code is sound.
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [infra/aws, infra/aws/dns, infra/aws/kubernetes, infra/vault]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.61.0
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.root)) }}
      - run: terraform fmt -check -recursive
      # -backend=false: never touch the HCP Terraform workspace from CI.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: tflint --init && tflint --format compact
      - run: terraform test

  images:
    if: github.event_name == 'push'
    needs: [test, lint, manifests, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ingest, scoring, api, notify, migrate]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/timkrebs/ryft/${{ matrix.service }}
          tags: |
            type=sha,format=short,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # After the images of a push to main: pin deploy/k8s/overlays/eks to them on a branch
  # deploy/<sha>, open "deploy: images <sha>" with the commits since the running pin, and
  # let it merge itself (squash) once its required checks pass; Argo CD syncs the merge.
  # Closing the PR blocks that deploy. Skipped when nothing under backend/ changed since
  # the running pin, which also keeps the merged pin commit from promoting itself.
  # The token is the GitHub App's (repository variable RYFT_DEPLOY_APP_CLIENT_ID, secret
  # RYFT_DEPLOY_APP_KEY): PRs made with GITHUB_TOKEN would not run the checks.
  promote:
    # Skipped until the App exists (docs/STATUS.md → GitOps: your steps).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RYFT_DEPLOY_APP_CLIENT_ID != ''
    needs: [images]
    runs-on: ubuntu-latest
    concurrency:
      group: promote
      cancel-in-progress: false
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RYFT_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.RYFT_DEPLOY_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Pin the images in a PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: ./scripts/promote.sh
