# One workflow for the whole repository's checks (D107). On a pull request a `changes` job picks
# the checks the diff needs (path filters, job-level `if:`); a push to main and a manual run
# execute every check. `ci-ok` needs them all and is the required check: a skipped check is
# never a failed one, but a failed or cancelled one (or a failed `changes`) turns it red.
# Checks only: nothing here builds an image to deploy, pushes to a registry or opens a pull
# request (the GHCR images and EKS's "deploy: images" PRs are gone, C1). deploy.yml deploys main:
# it waits for this workflow's ci-ok on the commit, then ships the services to Cloud Run and the
# site to Firebase Hosting (docs/OPERATIONS.md -> GCP -> Deploy, roll back, rotate).
name: ci

on:
  # Only main: a feature branch gets its checks from its pull request, once, under one name.
  push:
    branches: [main]
  pull_request:
  # Every check, on any branch (deploy.yml reads only the push runs on main).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR replaces its run. A run on main is never cancelled half way: deploy.yml
  # deploys a commit only once this run's ci-ok on it is green, and every commit on main keeps a
  # complete verdict (and the coverage upload the next pull request compares with). GitHub keeps
  # one run waiting per ref, the newest.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Public values, baked into the site's HTML (repository variables, not secrets).
  NEXT_PUBLIC_TESTFLIGHT_URL: ${{ vars.TESTFLIGHT_URL }}
  NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}

jobs:
  # Which checks does this change need? Filters only on pull requests: a push to main and a
  # manual run execute every check, so main's ci-ok (what deploy.yml waits for) judges the whole
  # tree. The workflow file itself is in every filter, so a change to CI runs everything. No
  # checkout: on a pull request the filter lists the changed files through the API.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      run_pkgmap: ${{ github.event_name != 'pull_request' || steps.filter.outputs.pkgmap == 'true' }}
      run_smoke: ${{ github.event_name != 'pull_request' || steps.filter.outputs.smoke == 'true' }}
      run_manifests: ${{ github.event_name != 'pull_request' || steps.filter.outputs.manifests == 'true' }}
      run_terraform: ${{ github.event_name != 'pull_request' || steps.filter.outputs.terraform == 'true' }}
      run_argocd_luatest: ${{ github.event_name != 'pull_request' || steps.filter.outputs.argocd_luatest == 'true' }}
      run_web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      run_monitoring: ${{ github.event_name != 'pull_request' || steps.filter.outputs.monitoring == 'true' }}
      run_golden: ${{ github.event_name != 'pull_request' || steps.filter.outputs.golden == 'true' }}
      run_topology: ${{ github.event_name != 'pull_request' || steps.filter.outputs.topology == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - 'backend/**'
              - '.golangci.yml'
              - 'docs/API.md'
              # internal/config tests parse the committed config.env of the services (ADMIN_WEB_ORIGINS):
              # a config-only change must run them.
              - 'deploy/k8s/base/*/config.env'
              - 'scripts/coverage.sh'
              # internal/events/pubsub's tests compare the topology with the generated files and with
              # Terraform's constants (pubsub.tf).
              - 'infra/gcp/pubsub.auto.tfvars.json'
              - 'infra/gcp/pubsub.tf'
              - 'deploy/pubsub-emulator/**'
              - '.github/workflows/ci.yml'
            # The package map in docs/ARCHITECTURE.md is generated from the code (scripts/pkgmap.sh --check, in the
            # `lint` job): an edit of the doc or the script alone selects `lint`, not the whole Go suite.
            pkgmap:
              - 'docs/ARCHITECTURE.md'
              - 'scripts/pkgmap.sh'
              - '.github/workflows/ci.yml'
            smoke:
              - 'backend/**'
              - 'scripts/**'
              # the Cloud Run script tests copy the templates (check_cloudrun, cloudrun_render, rotate_db_password)
              - 'deploy/run/**'
              - 'docker-compose.yml'
              - 'Makefile'
              # compose's emulator runs it
              - 'deploy/pubsub-emulator/**'
              # scripts/dlq.sh reads its keys and topics from it (scripts/tests/dlq_test.sh)
              - 'infra/gcp/pubsub.auto.tfvars.json'
              - 'web/config/brand-denylist.json'
              - 'web/scripts/check-brand.mjs'
              - 'web/scripts/lib/brand.mjs'
              - '.github/workflows/ci.yml'
            manifests:
              - 'deploy/**'
              - 'infra/vault/**'
              # rendered by scripts/tests/vault_extras_chart_test.sh (the Terraform tests mock Helm)
              - 'infra/aws/kubernetes/charts/vault-extras/**'
              - 'infra/aws/kubernetes/charts/cluster-issuers/**'
              - 'scripts/**'
              - 'Makefile'
              - '.github/**'
              - '.gitattributes'
              - '**/.gitattributes'
              - '.gitmodules'
              - 'docker-compose.yml'
              # make k8s-validate runs the topology's drift check (make topology-check)
              - 'backend/internal/events/*.go'
              - 'backend/internal/events/pubsub/**'
              - 'backend/cmd/pubsub-topology/**'
              - 'infra/gcp/pubsub.auto.tfvars.json'
              - 'backend/go.mod'
              - 'web/content/legal/**'
              - 'web/scripts/check-policy-version.mjs'
              - 'web/scripts/lib/policy.mjs'
            # Argo CD's health checks harness: its script source, itself, and the recipe.
            argocd_luatest:
              - 'infra/aws/kubernetes/argocd.tf'
              - 'infra/aws/kubernetes/argocd-luatest/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infra/**'
              - 'scripts/tests/argocd_release_guard_test.sh'
              # infra/aws/kubernetes' test compares its Vault address with these generated files
              - 'deploy/k8s/overlays/vault-namespaces/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'docs/SCORING.md'
              - '.github/workflows/ci.yml'
            # The alert rules and the synthetic checks; the checks' body markers are read from
            # the site's own sources (the policy text and the AASA).
            monitoring:
              - 'deploy/grafana/**'
              - 'scripts/synthetics.sh'
              - 'scripts/synthetics_re2.go'
              - 'scripts/tests/synthetics_test.sh'
              # the committed actions of the admission bindings (a step-change PR edits only the values)
              - 'infra/aws/kubernetes/admission-values.yaml'
              - 'infra/aws/kubernetes/charts/admission-policy/values.yaml'
              - 'scripts/admission_intended.sh'
              - 'scripts/tests/admission_intended_test.sh'
              - 'scripts/check_rule_groups.sh'
              - 'scripts/tests/check_rule_groups_test.sh'
              - 'web/content/legal/**'
              - 'web/public/.well-known/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            # The scoring golden files and their PR guard (D149).
            golden:
              - 'backend/internal/scoring/testdata/golden/**'
              - 'scripts/golden_guard.sh'
              - 'scripts/tests/golden_guard_test.sh'
              - '.github/workflows/ci.yml'
            # The Pub/Sub topology's generated files against topology.go (`topology` job): the Go
            # anywhere in the module (the keys come from internal/events), and the two outputs.
            topology:
              - 'backend/**'
              - 'infra/gcp/pubsub.auto.tfvars.json'
              - 'deploy/pubsub-emulator/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  test:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only to list and download main's coverage artifact (coverage-gate); no write.
      actions: read
    # A throwaway server for the opt-in migration and store tests (account
    # deletion races); they create and drop their own databases. By digest (the index; read off
    # the pooler job's pull on 2026-11-15), as in docker-compose.yml and the pooler job.
    services:
      postgres:
        image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env: { POSTGRES_PASSWORD: pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 15
    env:
      RYFT_TEST_POSTGRES_URL: postgres://postgres:pw@localhost:5432/postgres
      # The Pub/Sub emulator of the step below, for internal/events/pubsub's emulator test (publish,
      # push, nack, dead letter).
      RYFT_TEST_PUBSUB_EMULATOR_HOST: localhost:8085
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gcloud Pub/Sub emulator, as compose runs it (docker-compose.yml, service pubsub: the same
      # image). A step, not a service container: a service container cannot take a command. Host
      # networking, so a push reaches a test's server on 127.0.0.1. It holds nothing but what the
      # tests publish. Pinned by the index digest, the same as docker-compose.yml's.
      - name: Start the Pub/Sub emulator
        env:
          IMAGE: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators@sha256:3989a42372d3b984bade6db02213d456d94a0ba3765e8b744b95c4188b6fcc89
        run: |
          docker run -d --name pubsub --network host "$IMAGE" \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=ryft-local
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      # Any HTTP answer is the emulator serving (deploy/pubsub-emulator/init.sh waits the same way).
      - name: Wait for the Pub/Sub emulator
        run: |
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null "http://$RYFT_TEST_PUBSUB_EMULATOR_HOST/"; then exit 0; fi
            sleep 2
          done
          docker logs pubsub 2>&1 | tail -50
          echo "::error title=pubsub emulator::no answer on $RYFT_TEST_PUBSUB_EMULATOR_HOST after 2 minutes"
          exit 1
      # -race makes the cover mode atomic; one profile for all packages (scripts/coverage.sh).
      - run: |
          mkdir -p coverage
          go test -race -count=1 -coverprofile=coverage/coverage.out ./...
      - name: The emulator's log
        if: failure()
        run: docker logs pubsub 2>&1 | tail -200
      # The per-package table in the job summary, and total.txt (internal/) next to the profile.
      - run: ../scripts/coverage.sh report coverage/coverage.out coverage
      # Every run uploads; the newest one from main is the baseline of the next pull request.
      # This step must stay BEFORE the coverage-gate step: the gate downloads main's files into
      # backend/coverage, and those must never be uploaded again as this run's coverage.
      # An artifact outage must not turn ci-ok red on main (deploy.yml waits for it); a missing upload only
      # means no baseline.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: coverage
          path: backend/coverage
          retention-days: 90
      # internal/ may fall at most 1 point below main's last number; no absolute threshold. No
      # artifact from main yet (first run, or older than the retention) -> passes and says so.
      - name: coverage-gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          # The one knob: the points internal/ may fall below main's (D148). Raising it is a reviewed diff.
          MAX_DROP: "1.0"
        run: |
          ../scripts/coverage.sh baseline coverage
          ../scripts/coverage.sh gate coverage/total.txt coverage/main-total.txt

  # The store's integration tests with their queries through PgBouncer in transaction mode and pgx's
  # exec mode: what the services do on Cloud Run through Supavisor on 6543 (design §4, D221). Ubuntu's
  # pgbouncer package (no image to pin), its own instance on 127.0.0.1:6543 with a wildcard database
  # onto the job's Postgres; max_prepared_statements = 0, so it keeps no named statement for us (as
  # Supavisor does not), and no ignore_startup_parameters, so an unknown startup parameter fails. The
  # store's tests migrate and seed on the direct URL and hand the store a pool through the bouncer
  # (RYFT_TEST_POOLER_URL, internal/store/pooler_test.go); TestPooler (RYFT_POOLER_URL) is the read-only
  # check that runbook step 7 runs against Supavisor (make pooler-check). ubuntu-24.04: PgBouncer 1.22
  # (max_prepared_statements needs 1.21).
  pooler:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env: { POSTGRES_PASSWORD: pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 15
    env:
      RYFT_TEST_POSTGRES_URL: postgres://postgres:pw@localhost:5432/postgres
      RYFT_TEST_POOLER_URL: postgres://postgres:pw@127.0.0.1:6543/postgres?sslmode=disable&default_query_exec_mode=exec
      RYFT_POOLER_URL: postgres://postgres:pw@127.0.0.1:6543/postgres?sslmode=disable&default_query_exec_mode=exec
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PgBouncer in transaction mode on 127.0.0.1:6543
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends pgbouncer
          sudo systemctl stop pgbouncer || true   # the package's own instance (6432); ours runs as the runner user
          pgbouncer -V
          d=$RUNNER_TEMP/pgbouncer; mkdir -p "$d"
          printf '"postgres" "pw"\n' > "$d/userlist.txt"
          cat > "$d/pgbouncer.ini" <<EOF
          [databases]
          * = host=127.0.0.1 port=5432

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6543
          unix_socket_dir =
          auth_type = scram-sha-256
          auth_file = $d/userlist.txt
          pool_mode = transaction
          max_prepared_statements = 0
          max_client_conn = 200
          default_pool_size = 5
          logfile = $d/pgbouncer.log
          pidfile = $d/pgbouncer.pid
          EOF
          pgbouncer -d "$d/pgbouncer.ini"
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/6543) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          tail -50 "$d/pgbouncer.log" || true
          echo "::error title=pgbouncer::not listening on 127.0.0.1:6543 after 30 s"
          exit 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The server as runbook step 7 meets Supabase's (D228): extra_float_digits 0 from the configuration file.
      # ALTER SYSTEM writes postgresql.auto.conf, so pg_settings says `configuration file`, as there.
      - name: extra_float_digits 0 in the server's configuration file, as on Supabase
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c 'ALTER SYSTEM SET extra_float_digits = 0' -c 'SELECT pg_reload_conf()'
      # First the read-only check on its own, so that a skip cannot pass for a pass. As the owner (no role setting)
      # it reports the 0 and passes; the last grep proves the 0 was in force.
      - name: TestPooler through PgBouncer (exec mode, read-only, rolled back)
        run: |
          go test -count=1 -run '^TestPooler$' -v ./internal/store/ | tee "$RUNNER_TEMP/pooler.log"
          grep -q -- '--- PASS: TestPooler' "$RUNNER_TEMP/pooler.log"
          grep -q -- 'extra_float_digits 0 (configuration file)' "$RUNNER_TEMP/pooler.log"
      # The store's tests log in through the bouncer as the owner, which has no role setting; the services' roles
      # have theirs (migration 0035, proven by internal/db's TestServiceRolesReadExactFloats).
      - name: extra_float_digits back to the default
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c 'ALTER SYSTEM RESET extra_float_digits' -c 'SELECT pg_reload_conf()'
      - name: The store's tests, the store's queries through PgBouncer
        run: go test -count=1 ./internal/store/...
      # The bouncer logs each client connection with its database (log_connections, on by default): the
      # tests' own databases there mean the store's queries did go through it.
      - name: The store's tests went through PgBouncer
        run: |
          n=$(grep -c 'ryft_storetest_' "$RUNNER_TEMP/pgbouncer/pgbouncer.log" || true)
          echo "PgBouncer log lines naming a test database: $n"
          [ "${n:-0}" -gt 0 ] || { echo "::error title=pooler::no ryft_storetest_ database in PgBouncer's log"; exit 1; }
      - name: PgBouncer's log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/pgbouncer/pgbouncer.log" || true

  lint:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_go == 'true' || needs.changes.outputs.run_pkgmap == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The version is also GOLANGCI_LINT_VERSION in the Makefile (`make lint` runs this job locally).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend
      # The package map in docs/ARCHITECTURE.md is generated (go list); fails when it is stale. Here, not in `smoke`:
      # this job has Go and the modules after the line above, and a change of docs/ARCHITECTURE.md alone selects it.
      - run: ./scripts/pkgmap.sh --check
      # No session state in the services' Go and SQL (design §4, D221): no SET without LOCAL, LISTEN, temporary
      # table, session advisory lock, named prepared statement or WITH HOLD cursor, which a transaction-mode pooler
      # would leave on another client's server connection (`make lint` runs it too). bash, find and awk only; its
      # fixtures run in `smoke` (make test-scripts), which a change of the script alone selects.
      - name: No session state in the services' SQL (transaction pooler)
        run: bash scripts/check_session_state.sh

  # Known vulnerabilities in the services' Go, before the merge (D229). Until now only the deploy gate (deploy.yml's
  # Trivy on the built images, after the merge) looked: pgx 5.7.5's CVE-2026-33815 and CVE-2026-33816 got that far.
  # Two rules, both of which must pass:
  #   govulncheck (the Go vulnerability database): every finding the code can reach fails, whatever its severity,
  #     in the modules and in the standard library; one it cannot reach is listed and passes. It runs in
  #     backend/Dockerfile's build image, by the digest pinned there, so the standard library it judges is the one
  #     the images are built with (Dependabot moves that digest). Its version must build with that Go (v1.9.0 needs
  #     1.26): a new Go line in the Dockerfile may move it.
  #   Trivy, the deploy gate's own rule (the image and flags of deploy.yml) on the modules of backend/go.mod: a
  #     critical with a fix fails, reachable or not. govulncheck alone would not stop what that gate stops:
  #     it finds those two CVEs in a package we import but not in a function we call.
  vulns:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: govulncheck in the build image (backend/Dockerfile)
        env:
          GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
        run: |
          image=$(awk '$1 == "FROM" && $NF == "build" { for (i = 2; i < NF; i++) if ($i ~ /^golang:/) print $i }' backend/Dockerfile)
          case "$image" in
            golang:*@sha256:*) echo "build image: $image" ;;
            golang:*)
              # A new Go line (a hand PR): name the digest to pin, then fail. The pull's own "Digest:" is the index's.
              docker pull "$image" || true
              echo "::error title=govulncheck::backend/Dockerfile's build stage $image is not pinned by digest: pin the Digest above"
              exit 1 ;;
            *) echo "::error title=govulncheck::backend/Dockerfile has no golang build stage (found '$image')"; exit 1 ;;
          esac
          # -show verbose: the standard library's version it judged, and the findings the code does not reach.
          docker run --rm -v "$PWD/backend:/src:ro" -w /src "$image" go run "$GOVULNCHECK" -show verbose ./...
      # Also after a red govulncheck: both verdicts in one run.
      - name: Trivy on backend/go.mod (the deploy gate's rule, fail on critical)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD/backend:/src:ro" \
            aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            fs --scanners vuln --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress /src

  # The Pub/Sub topology's drift check: infra/gcp/pubsub.auto.tfvars.json (Terraform creates the topics and
  # subscriptions from it) and deploy/pubsub-emulator/init.sh (compose's) must be byte for byte what
  # backend/internal/events/pubsub/topology.go generates (`make topology-check`; `go run ./cmd/pubsub-topology`
  # in backend/ rewrites both). Its own job, so a stale file names itself; `ci-ok` needs it. `make k8s-validate`
  # (the `manifests` job) runs it too.
  topology:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_topology == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make topology-check

  # The bytes of every tracked file (scripts/check_bytes.sh), on every run: no path filter, no
  # `changes` dependency, so no diff can slip under a filter that forgot its directory (a
  # symlink, an image, a hidden line break in a file no filter names). About a second. `ci-ok`
  # needs it; the `manifests` job repeats it as its first step, so that nothing there parses a
  # tree whose bytes are not clean.
  bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Files have no hidden line breaks, controls, invisible characters, symlinks, BOM or banned names
        run: ./scripts/check_bytes.sh
      # D-numbers in docs/DECISIONS.md that no source or config file mentions and scripts/decision_refs.skip does not
      # excuse: one ::warning annotation, the list in the log. Here, not in `lint`: this job has no path filter, so a
      # PR that only edits docs/DECISIONS.md (or the skip list) runs it, and a renumbered D shows up on the PR that
      # did it instead of on someone else's Go PR. It needs only git and awk. Exit 0 on warnings, so it never fails
      # the job; it fails only when the script cannot work (which would also turn ci-ok red on main, and so stop
      # deploy.yml; the PR's own run catches it first). `--strict` is the later promotion to a failure.
      - name: Decisions are referenced from code, or skipped with a reason (warnings only)
        run: ./scripts/decision_refs.sh

  manifests:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_manifests == 'true'
    runs-on: ubuntu-latest
    steps:
      # The whole history: the holds check reads the base branch, deploy_targets.sh the pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # From here on every step that renders (kubectl kustomize in make, check_registry,
      # check_policy_in_force, the script tests) may only use git over file://: a remote base that
      # slipped through fails the build. Not job-wide: the checkout above fetches over https.
      - name: Git over file:// only, after the checkout
        run: echo "GIT_ALLOW_PROTOCOL=file" >> "$GITHUB_ENV"
      # First: the bytes of every tracked file (not only YAML: kustomize also reads `Kustomization`
      # and any extension named in resources/patches). A hidden line break (U+2028, U+2029, U+0085, a
      # lone CR), a bidi control or another invisible character in a comment is a line break to the
      # parsers and invisible to every line-based check after this one. Also refuses the file names
      # Kustomization, kustomization.yml, .gitattributes and .gitmodules.
      - name: Files have no hidden line breaks, controls, invisible characters, symlinks, BOM or banned names
        run: ./scripts/check_bytes.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Node built-ins only (no npm ci): the policy check reads the site's legal pages and
      # this repository's config.env files.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      # actionlint needs a newer Go than go.mod's; the toolchain download is verified by the Go
      # checksum database. Only this step may switch toolchains.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        env:
          GOTOOLCHAIN: auto
      # yq (mikefarah) pinned, not the runner image's: the workflow, kustomization and Argo CD checks
      # parse with it. The release binary checked against a sha256 (scripts/install_yq.sh holds both
      # the version and the checksum; `smoke` installs it the same way for the script tests).
      - run: ./scripts/install_yq.sh
      - run: make k8s-validate
      # The Vault add-on's local charts as Helm renders them (vault-extras' policies, PDB and Role, the ryft-vault
      # issuer), with yq and kubeconform: what tests/addons.tftest.hcl cannot see behind the mocked Helm provider.
      # Helm pinned and checked against a sha256 (scripts/install_helm.sh); the script fails here
      # (GITHUB_JOB=manifests) instead of skipping.
      - run: ./scripts/install_helm.sh
      - run: bash scripts/tests/vault_extras_chart_test.sh
      # The workflows themselves.
      - run: actionlint
      # What actionlint cannot know, read from the parsed YAML (the pinned yq is first on PATH; the
      # script fails without it): no pull_request_target/workflow_run, only deploy.yml's `deploy` (in
      # `deploy`) and `site` (in `site`) name an environment, each its own WIF principal set (D233),
      # nothing names the old deploy App's key, deploy.yml is gated by GCP_DEPLOY, never cancelled,
      # has no status function or continue-on-error, scans before
      # it signs in and changes Cloud Run only from main's tip, builds the site without a token and
      # deploys it only from main's tip, only this file defines ci-ok (deploy.yml reads that job of
      # this workflow's own run), no external reusable workflow, no `secrets: inherit`, no test hooks
      # of the scripts.
      - run: ./scripts/check_workflows.sh
      # deploy/run (Cloud Run, what deploy.yml applies): config.env lints, every template renders with
      # fake values, and the rendered YAML has design §3's limits, the ingress, account, h2c port and
      # probes per service, the env of ticket-b.md, secrets pinned by number (migrate's equal to the
      # services'), only the accessors' secrets, and none of P5's names (scripts/check_cloudrun.py).
      - run: make cloudrun-check
      # The privacy policy version in deploy/run/config.env (its home on Cloud Run) has its page on
      # the site (English only, D230), the k8s copies equal it, and the site has no page the
      # platform does not name (D107): consent is recorded against that version.
      - run: node web/scripts/check-policy-version.mjs --strict
      # deploy/run/config.env's version is a published text (its English page, in the list), the
      # k8s copies (deploy/k8s/base/{api,ingest}/config.env) equal it, and on a pull request a draft
      # text is not put into force there. Also EKS's version in force (the overlay's literals): api and
      # ingest agree and the pinned web commit serves it at /privacy (the newest English page). That pin
      # no longer moves (promote is gone, C1), so a new privacy version needs C2, which drops this half.
      - name: The privacy policy in force has its page
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/check_policy_in_force.sh ${BASE_REF:+"origin/$BASE_REF"}
      # The overlay's holds parse (a typo fails closed), the active ones go to the run summary,
      # and a PR may not move the pin of a group that is held on its base branch.
      - name: Holds in the EKS overlay
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: ./scripts/deploy_targets.sh --check ${BASE_REF:+"origin/$BASE_REF"}
      # Consent was recorded against every version in the list: it only grows.
      - name: The privacy versions list is append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/check_privacy_versions.sh "origin/$BASE_REF"
      # Every image the overlay pins exists on ghcr.io (a hand-made pin with a typo: 101bc7 for
      # 1015bc7 stopped the migrate job on 2026-10-21). Nothing pushes there any more (C1); D3
      # removes the overlay and this check.
      - run: ./scripts/check_registry.sh

  smoke:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make test-scripts renders overlays: git over file:// only from here on (see manifests).
      - name: Git over file:// only, after the checkout
        run: echo "GIT_ALLOW_PROTOCOL=file" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # check_pr_test runs the site's brand check, which needs the Node the site pins (the
      # runner's own Node is older: its regexes use modifier groups).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - run: make up CONTAINER=docker
      - run: make smoke
      # Argo CD's PostSync smoke, the Go one in the migrate image.
      - run: make smoke-hook CONTAINER=docker
      # The script tests parse with yq (check_kustomize_refs, check_workflows): the pinned one, as in `manifests`.
      - run: ./scripts/install_yq.sh
      # trace.sh, promote.sh, deploy_targets.sh, check_pr.sh and friends against fakes.
      - run: make test-scripts
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: make down CONTAINER=docker

  # Every Terraform root, offline: no HCP Terraform token, no cloud credentials. State
  # lives in HCP Terraform and plans/applies run on the operator's machine
  # (docs/OPERATIONS.md -> Terraform state); CI only proves the code is sound.
  terraform:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [infra/aws, infra/aws/dns, infra/aws/kubernetes, infra/vault, infra/gcp]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.7 # pinned exactly, as in the code and the workspaces (D56)
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.61.0
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.root)) }}
      - run: terraform fmt -check -recursive
      # -backend=false: never touch the HCP Terraform workspace from CI (D56).
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      # --init fetches the plugins from GitHub's releases. Anonymous, that API allows 60 requests an hour per
      # address, and a shared runner's address is often over it (a 403, three times by 2026-11-15). The job's
      # token (contents: read, the workflow's default) lifts the limit; only this step gets it, not the lint run.
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format compact
      - run: terraform test
      # The release's lifecycle conditions (a set or a second values document must be refused): edits a copy.
      - if: matrix.root == 'infra/aws/kubernetes'
        run: bash "$GITHUB_WORKSPACE/scripts/tests/argocd_release_guard_test.sh"

  # Argo CD's custom health checks (infra/aws/kubernetes/argocd.tf, D121) in a Lua VM with
  # exactly Argo CD's libraries (no string library), against table-driven objects. Reads
  # argocd.tf only: no provider, no state, no credentials.
  argocd-luatest:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_argocd_luatest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go modules come from the module proxy; nothing may fetch a repository over anything but file://.
      - name: Git over file:// only, after the checkout
        run: echo "GIT_ALLOW_PROTOCOL=file" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infra/aws/kubernetes/argocd-luatest/go.mod
          cache: false
      - run: make argocd-luatest

  # Alert rules as code (promtool check and unit tests, mimirtool check) and the synthetic
  # checks of ryftlab.de (offline validation, RE2, markers against the site's sources).
  monitoring:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_monitoring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: make alerts-check CONTAINER=docker
      - run: ./scripts/synthetics.sh check
      - run: bash scripts/tests/synthetics_test.sh
      - run: bash scripts/tests/admission_intended_test.sh
      - run: bash scripts/tests/check_rule_groups_test.sh

  # ryftlab.de (web/): every check of the site. The platform is this checkout; the app
  # repository is checked out next to it (it is public) for the drift checks (tokens, Swift
  # licences, routes, legal drafts, model version), at the commit web/.app-ref names, never at
  # its main (D234): an app merge can't turn platform main red, and a token update is a PR that
  # moves the pin (docs/OPERATIONS.md -> GCP -> Deploy, roll back, rotate -> The app pin).
  web-checks:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RYFT_APP_DIR: ${{ github.workspace }}/app
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One line, a full commit SHA and nothing else: a branch or tag would move under the pin.
      - name: The app's pinned commit (web/.app-ref)
        id: app-ref
        run: |
          ref=$(tr -d '[:space:]' < .app-ref)
          if ! printf '%s' "$ref" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error file=web/.app-ref::not a 40-character lowercase commit SHA"
            exit 1
          fi
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
          echo "The app at $ref"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timkrebs/ryft-app
          ref: ${{ steps.app-ref.outputs.sha }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx eslint .
      - run: npx prettier --check .
      - name: Brand check (repository, last commit message, PR title)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm run brand
          if [ -n "$PR_TITLE" ]; then printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title" && node scripts/check-brand.mjs --message "$RUNNER_TEMP/title"; fi
      - run: npm run tokens:check
      - run: npm run licenses:check
      - name: Unit tests
        run: npx vitest run --exclude tests/output.test.ts
        env:
          REQUIRE_SIBLINGS: '1'
      - run: npm run build
      - name: Tests on the built site
        run: npx vitest run tests/output.test.ts
        env:
          REQUIRE_OUT: '1'

  # The site as Firebase Hosting serves it (design §8, C1). `npm run build` writes the export
  # (web/out) and web/firebase.json and runs the brand check on the output; `npm run e2e:hosting`
  # starts the Hosting emulator of the pinned firebase-tools (web/.firebase-tools-version) on
  # http://localhost:8080 and runs Playwright (every page, light + dark, routes, headers, axe),
  # scripts/check-hosting.mjs --emulator (deploy.yml's `site` job runs it against ryftlab.de with
  # production's expectations; they differ on the admin redirects and on "//", web D21),
  # the links and Lighthouse (mobile; LCP < 1.5 s, < 80 KB JS) against it; any failure is exit 1.
  # No image and no container: Hosting serves the files themselves.
  web-e2e:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: The Hosting emulator, Playwright, check-hosting, links and Lighthouse
        run: npm run e2e:hosting
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: web/.lighthouseci
          # A dot directory: without this the reports were never uploaded.
          include-hidden-files: true
          retention-days: 14

  # gitleaks over the whole history on every PR and push, with the reviewed allowlist in
  # .gitleaks.toml (picked up from the repository root); HEAD only: gitleaks' default would scan
  # every branch, and any pushed work in progress would turn every PR red. `ci-ok` needs it, and
  # deploy.yml deploys only a commit whose ci-ok is green: a leak is fixed by rotating the secret,
  # a false positive by a reviewed entry in .gitleaks.toml.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A PR is judged by the base branch's allowlist, not by the one it may have edited, and by
      # the base branch's .gitleaksignore (gitleaks always reads <source>/.gitleaksignore, so the
      # PR's own file is replaced by the base's, or removed if the base has none).
      - name: gitleaks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/noignore"
          cp .gitleaks.toml "$RUNNER_TEMP/gitleaks.toml"
          if [ -n "$BASE_REF" ]; then
            git show "origin/$BASE_REF:.gitleaksignore" > .gitleaksignore 2>/dev/null || rm -f .gitleaksignore
            if git show "origin/$BASE_REF:.gitleaks.toml" > "$RUNNER_TEMP/base.toml" 2>/dev/null; then
              mv "$RUNNER_TEMP/base.toml" "$RUNNER_TEMP/gitleaks.toml"
            else
              echo "::notice::$BASE_REF has no .gitleaks.toml yet: using the PR's"
            fi
          fi
          docker run --rm -v "$PWD:/repo" \
            -v "$RUNNER_TEMP/gitleaks.toml:/config/gitleaks.toml:ro" -v "$RUNNER_TEMP/noignore:/noignore:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /config/gitleaks.toml --gitleaks-ignore-path /noignore \
            --log-opts=HEAD --redact --no-banner --exit-code 1

  # A golden user file moves only with a ModelVersion bump, a generator change or new fields
  # (D149). Pull requests only: it compares with the merge base, which a push has no use for.
  # Its own job (not a step of `test`): it needs the whole history, not the Go toolchain or
  # Postgres, and a red guard should name itself.
  golden-guard:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_golden == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The whole history: the guard needs the merge base with the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Golden files changed without a ModelVersion bump, input digest or field digest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/golden_guard.sh "$BASE_SHA"

  # The required check on main (with pr-title), and what deploy.yml waits for on a push to main.
  # Skipped checks are fine, failed or cancelled ones are not; if `changes` itself fails,
  # everything behind it is skipped and this is red. A new check job is one more entry in `needs`.
  ci-ok:
    # always(), not !cancelled(): a cancelled run must still report (red), because a skipped
    # required check counts as passing for branch protection.
    if: always()
    needs: [changes, bytes, test, pooler, lint, vulns, topology, smoke, manifests, terraform, argocd-luatest, monitoring, web-checks, web-e2e, secrets, golden-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
