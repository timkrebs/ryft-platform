# The kind end-to-end of the admission policies (D120, T12-d), by hand: before the first apply of
# T12-f (Argo CD's narrowed RBAC), and on every operator, argo-cd chart or EKS minor upgrade
# (docs/OPERATIONS.md -> Admission policies: the kind run). The `admission` job of ci.yml runs the
# quick part (--mode ci) on every change; this one adds the real stack in kind: cert-manager, Argo CD
# from argocd.tf's values, the RabbitMQ operators and the broker synced by Argo CD from the tree, the
# hooks, terminate-op, the broker restart, the operators' reach. The same script runs locally:
# make admission-e2e REPO=<path>.
#
# "ref" is the branch, tag or commit whose deploy/ tree and argocd.tf are tested (a copy of the
# pull request of the narrowed RBAC, or of the namespace-scoped operators); the chart, the committed
# values, the fixtures and the script come from the ref this workflow runs on. THE TREE IS CODE
# (kustomize renders it, Terraform evaluates its argocd.tf, Argo CD syncs it), so:
#   - with a "ref", dispatch from the branch under test (Use workflow from), never from the default
#     branch: the run then executes that branch's script, and the default branch's copy is never the
#     one fed with another ref's code;
#   - a ref is a branch of this repository, or a tag or commit that is on one; refs/pull/* (a pull
#     request, possibly from a fork) and commits on no branch are refused;
#   - the job has read-only contents and no secret, no cloud credential and no cache (nothing a ref
#     writes can reach a later run).
name: admission-e2e

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of this repository to test (its deploy/ and infra/aws/kubernetes/argocd.tf); it must be on a branch. Empty is this ref.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: admission-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      TF_IN_AUTOMATION: "true"
      TREE: ${{ inputs.ref != '' && 'tree' || '.' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # What may be tested: with a ref, only from the branch under test, only a branch's commits
      # (scripts/check_e2e_ref.sh, tested by scripts/tests/check_e2e_ref_test.sh).
      - name: Which ref may be tested
        id: ref
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
          RUN_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha=$(bash scripts/check_e2e_ref.sh "$REF" "$RUN_REF" "$DEFAULT_BRANCH")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "testing $REF = $sha"
      - if: inputs.ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.sha }}
          path: tree
          persist-credentials: false
      - name: Git over file:// only, after the checkouts
        run: echo "GIT_ALLOW_PROTOCOL=file" >> "$GITHUB_ENV"
      # Go builds the one-file git server the run serves the tree from (scripts/lib/gitsrv.go).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infra/aws/kubernetes/admission-celtest/go.mod
          cache: false
      # yq (mikefarah), kind, kubectl and helm pinned, each checked against a sha256 (the scripts hold both).
      - run: ./scripts/install_yq.sh
      - run: ./scripts/install_kind.sh
      - run: ./scripts/install_kubectl.sh
      - run: ./scripts/install_helm.sh
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      # No actions/cache: the provider plugins are downloaded on every run (a cache entry written by a
      # run on another ref must not be readable by the next one).
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: kind end-to-end
        run: ./scripts/admission_e2e.sh --mode full --repo "$TREE" --summary "$RUNNER_TEMP/admission-e2e-summary.md"
