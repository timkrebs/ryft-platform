# actionlint 1.7.12's metadata for actions/create-github-app-token predates v3, which
# takes client-id (app-id is deprecated there). Actions are pinned by SHA now, and actionlint
# has no metadata for a SHA, so it reports nothing today; these patterns match any ref in
# case a newer actionlint resolves one. Remove once actionlint knows v3.
paths:
  .github/workflows/ci.yml:
    ignore:
      - 'input "client-id" is not defined in action "actions/create-github-app-token@[^"]+"'
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@[^"]+"'
