# promtool unit tests for eks-admission.yaml (make alerts-check), moved out of ryft.test.yaml
# unchanged with the group (ticket B2). They go with the file at the EKS removal (D3).
rule_files: [/rules/eks-admission.rules.yaml]
evaluation_interval: 1m
tests:
  # ---- admission policies (T12-e) --------------------------------------------------------
  # Counters: the first event of a new child (created at 1, nothing to subtract), steady and
  # growing series, the scrape's own start and a recovered scrape, Pod Security without any
  # binding. Bindings: kube-state-metrics' series against the committed actions, which the
  # tests feed as ryft:admission_binding_intended (scripts/admission_intended.sh generates it).
  - name: admission violation, first event of a new series (no increase to see)
    interval: 1m
    input_series:
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.1.5:443"}', values: '1x200' }
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.2.9:443"}', values: '1x200' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-namespaces",policy_binding="ryft-namespaces",enforcement_action="audit",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-namespaces",policy_binding="ryft-namespaces",enforcement_action="warn",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-namespaces",policy_binding="ryft-namespaces",enforcement_action="audit",error_type="no_error",instance="10.0.2.9:443"}', values: '_x30 1x90' }
    alert_rule_test:
      - { eval_time: 25m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
      - eval_time: 31m
        alertname: AdmissionPolicyViolation
        exp_alerts:
          - exp_labels: { severity: info, policy: ryft-namespaces, policy_binding: ryft-namespaces }
            exp_annotations:
              summary: "Admission policy ryft-namespaces (ryft-namespaces) flagged a request that was admitted"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
      # a single event resolves after its 10 minutes
      - { eval_time: 50m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
  - name: admission violation, steady counters stay quiet and an increase fires
    interval: 1m
    input_series:
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.1.5:443"}', values: '1x200' }
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.2.9:443"}', values: '1x200' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-namespaces",policy_binding="ryft-namespaces",enforcement_action="audit",error_type="no_error",instance="10.0.1.5:443"}', values: '3x60 4x60' }
    alert_rule_test:
      # the scrape's first minutes: the series look new, but the scrape was not up 12 minutes ago
      - { eval_time: 5m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
      - { eval_time: 20m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
      - { eval_time: 59m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
      - eval_time: 61m
        alertname: AdmissionPolicyViolation
        exp_alerts:
          - exp_labels: { severity: info, policy: ryft-namespaces, policy_binding: ryft-namespaces }
            exp_annotations:
              summary: "Admission policy ryft-namespaces (ryft-namespaces) flagged a request that was admitted"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
      - { eval_time: 80m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
  - name: admission alerts stay quiet in Phase 0 (no ryft policies, no bindings)
    interval: 1m
    input_series:
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.1.5:443"}', values: '1x200' }
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.2.9:443"}', values: '1x200' }
      - { series: 'up{job="ryft/admission-bindings",instance="10.0.3.3:8080"}', values: '1x200' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="other",policy_binding="other",enforcement_action="deny",error_type="compile_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="other",policy_binding="ryft-workloads-pods",enforcement_action="deny",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-vso",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-operators-cluster",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-broker",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-namespaces",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-workloads-templates",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-netpol",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-auth-env",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-traefik",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-workloads-pods",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-operator-reach",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-argocd",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-argocd-operation",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-vault-trust",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-namespaces-vault",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-workloads-templates-vault",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-workloads-pods-vault",intended_action="deny"}', values: '1x300' }
      - { series: 'ryft:admission_binding_intended{validatingadmissionpolicybinding="ryft-netpol-vault",intended_action="deny"}', values: '1x300' }
    alert_rule_test:
      - { eval_time: 31m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
      - { eval_time: 31m, alertname: AdmissionPolicyDenied, exp_alerts: [] }
      - { eval_time: 31m, alertname: AdmissionPodDenied, exp_alerts: [] }
      - { eval_time: 31m, alertname: AdmissionPolicyError, exp_alerts: [] }
      - { eval_time: 31m, alertname: AdmissionBindingMissing, exp_alerts: [] }
      - { eval_time: 31m, alertname: AdmissionBindingNotDenying, exp_alerts: [] }
      - { eval_time: 31m, alertname: AdmissionBindingDrift, exp_alerts: [] }
      - { eval_time: 31m, alertname: AdmissionBreakGlass, exp_alerts: [] }
      - { eval_time: 31m, alertname: AdmissionSignalsMissing, exp_alerts: [] }
      - { eval_time: 31m, alertname: AdmissionScrapeDown, exp_alerts: [] }
  - name: admission denials, pod-capable bindings are critical, the rest warning, violations that were denied are not
    interval: 1m
    input_series:
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.1.5:443"}', values: '1x200' }
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.2.9:443"}', values: '1x200' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-namespaces",policy_binding="ryft-namespaces",enforcement_action="deny",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-namespaces",policy_binding="ryft-namespaces",enforcement_action="audit",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-workloads",policy_binding="ryft-workloads-pods",enforcement_action="deny",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-operator-reach",policy_binding="ryft-operator-reach",enforcement_action="deny",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-auth-env",policy_binding="ryft-auth-env",enforcement_action="deny",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-workloads",policy_binding="ryft-workloads-templates",enforcement_action="deny",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-workloads",policy_binding="ryft-workloads-pods-vault",enforcement_action="deny",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-netpol",policy_binding="ryft-netpol-vault",enforcement_action="deny",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
    alert_rule_test:
      - eval_time: 31m
        alertname: AdmissionPolicyDenied
        exp_alerts:
          - exp_labels: { severity: warning, policy: ryft-namespaces, policy_binding: ryft-namespaces }
            exp_annotations:
              summary: "Admission policy ryft-namespaces (ryft-namespaces) refused a request"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
          - exp_labels: { severity: warning, policy: ryft-workloads, policy_binding: ryft-workloads-templates }
            exp_annotations:
              summary: "Admission policy ryft-workloads (ryft-workloads-templates) refused a request"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
          - exp_labels: { severity: warning, policy: ryft-netpol, policy_binding: ryft-netpol-vault }
            exp_annotations:
              summary: "Admission policy ryft-netpol (ryft-netpol-vault) refused a request"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
      - eval_time: 31m
        alertname: AdmissionPodDenied
        exp_alerts:
          - exp_labels: { severity: critical, source: ValidatingAdmissionPolicy, policy_binding: ryft-workloads-pods }
            exp_annotations:
              summary: "A Pod was refused by admission (ValidatingAdmissionPolicy); a re-create can be refused too"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
          - exp_labels: { severity: critical, source: ValidatingAdmissionPolicy, policy_binding: ryft-operator-reach }
            exp_annotations:
              summary: "A Pod was refused by admission (ValidatingAdmissionPolicy); a re-create can be refused too"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
          - exp_labels: { severity: critical, source: ValidatingAdmissionPolicy, policy_binding: ryft-auth-env }
            exp_annotations:
              summary: "A Pod was refused by admission (ValidatingAdmissionPolicy); a re-create can be refused too"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
          - exp_labels: { severity: critical, source: ValidatingAdmissionPolicy, policy_binding: ryft-workloads-pods-vault }
            exp_annotations:
              summary: "A Pod was refused by admission (ValidatingAdmissionPolicy); a re-create can be refused too"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
      # the audit counts of a binding that denies are the denial, not a violation
      - { eval_time: 31m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
      - { eval_time: 50m, alertname: AdmissionPolicyDenied, exp_alerts: [] }
      - { eval_time: 50m, alertname: AdmissionPodDenied, exp_alerts: [] }
  - name: admission pod security enforce refusals page without any binding (new child and increase)
    interval: 1m
    input_series:
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.1.5:443"}', values: '1x200' }
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.2.9:443"}', values: '1x200' }
      - { series: 'pod_security_evaluations_total{job="ryft/kube-apiserver-admission",decision="deny",mode="enforce",resource="pod",policy_level="baseline",instance="10.0.1.5:443"}', values: '_x30 1x170' }
      - { series: 'pod_security_evaluations_total{job="ryft/kube-apiserver-admission",decision="deny",mode="enforce",resource="pod",policy_level="restricted",instance="10.0.1.5:443"}', values: '1x100 2x100' }
      - { series: 'pod_security_evaluations_total{job="ryft/kube-apiserver-admission",decision="allow",mode="enforce",resource="pod",policy_level="baseline",instance="10.0.1.5:443"}', values: '50+50x200' }
    alert_rule_test:
      - { eval_time: 29m, alertname: AdmissionPodDenied, exp_alerts: [] }
      - eval_time: 31m
        alertname: AdmissionPodDenied
        exp_alerts:
          - exp_labels: { severity: critical, source: Pod Security, policy_level: baseline }
            exp_annotations:
              summary: "A Pod was refused by admission (Pod Security); a re-create can be refused too"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
      - { eval_time: 50m, alertname: AdmissionPodDenied, exp_alerts: [] }
      # restricted: an existing child that increments at 100m
      - { eval_time: 90m, alertname: AdmissionPodDenied, exp_alerts: [] }
      - eval_time: 102m
        alertname: AdmissionPodDenied
        exp_alerts:
          - exp_labels: { severity: critical, source: Pod Security, policy_level: restricted }
            exp_annotations:
              summary: "A Pod was refused by admission (Pod Security); a re-create can be refused too"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
      - { eval_time: 120m, alertname: AdmissionPodDenied, exp_alerts: [] }
  - name: admission pod security, warn and audit denials are violations, enforce on other resources is neither
    interval: 1m
    input_series:
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.1.5:443"}', values: '1x200' }
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.2.9:443"}', values: '1x200' }
      - { series: 'pod_security_evaluations_total{job="ryft/kube-apiserver-admission",decision="deny",mode="warn",resource="pod",policy_level="restricted",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'pod_security_evaluations_total{job="ryft/kube-apiserver-admission",decision="deny",mode="audit",resource="pod",policy_level="baseline",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'pod_security_evaluations_total{job="ryft/kube-apiserver-admission",decision="deny",mode="enforce",resource="job",policy_level="baseline",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'pod_security_evaluations_total{job="ryft/kube-apiserver-admission",decision="allow",mode="warn",resource="pod",policy_level="restricted",instance="10.0.1.5:443"}', values: '50+50x200' }
    alert_rule_test:
      - eval_time: 31m
        alertname: AdmissionPolicyViolation
        exp_alerts:
          - exp_labels: { severity: info, policy: pod-security, policy_binding: pod-security-warn, mode: warn }
            exp_annotations:
              summary: "Admission policy pod-security (pod-security-warn) flagged a request that was admitted"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
          - exp_labels: { severity: info, policy: pod-security, policy_binding: pod-security-audit, mode: audit }
            exp_annotations:
              summary: "Admission policy pod-security (pod-security-audit) flagged a request that was admitted"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
      - { eval_time: 31m, alertname: AdmissionPodDenied, exp_alerts: [] }
  - name: admission a recovered scrape does not make old children look new
    interval: 1m
    input_series:
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.1.5:443"}', values: '0x90 1x100' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-workloads",policy_binding="ryft-workloads-pods",enforcement_action="deny",error_type="no_error",instance="10.0.1.5:443"}', values: '_x90 1x100' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-namespaces",policy_binding="ryft-namespaces",enforcement_action="audit",error_type="no_error",instance="10.0.1.5:443"}', values: '_x90 1x100' }
      - { series: 'pod_security_evaluations_total{job="ryft/kube-apiserver-admission",decision="deny",mode="enforce",resource="pod",policy_level="baseline",instance="10.0.1.5:443"}', values: '_x90 1x100' }
      - { series: 'pod_security_evaluations_total{job="ryft/kube-apiserver-admission",decision="deny",mode="warn",resource="pod",policy_level="baseline",instance="10.0.1.5:443"}', values: '_x90 1x100' }
      # an endpoint with no up series at all
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-workloads",policy_binding="ryft-workloads-pods",enforcement_action="deny",error_type="no_error",instance="10.0.9.9:443"}', values: '_x30 1x160' }
      - { series: 'pod_security_evaluations_total{job="ryft/kube-apiserver-admission",decision="deny",mode="enforce",resource="pod",policy_level="baseline",instance="10.0.9.9:443"}', values: '_x30 1x160' }
    alert_rule_test:
      - { eval_time: 31m, alertname: AdmissionPodDenied, exp_alerts: [] }
      - { eval_time: 92m, alertname: AdmissionPodDenied, exp_alerts: [] }
      - { eval_time: 95m, alertname: AdmissionPodDenied, exp_alerts: [] }
      - { eval_time: 150m, alertname: AdmissionPodDenied, exp_alerts: [] }
      - { eval_time: 31m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
      - { eval_time: 92m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
      - { eval_time: 95m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
      - { eval_time: 150m, alertname: AdmissionPolicyViolation, exp_alerts: [] }
  - name: admission policy evaluation error, critical when it refuses, warning when admitted
    interval: 1m
    input_series:
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.1.5:443"}', values: '1x200' }
      - { series: 'up{job="ryft/kube-apiserver-admission",instance="10.0.2.9:443"}', values: '1x200' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-operators-cluster",policy_binding="ryft-operators-cluster",enforcement_action="deny",error_type="compile_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-broker",policy_binding="ryft-broker",enforcement_action="deny",error_type="out_of_budget",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-operators-cluster",policy_binding="ryft-operators-cluster",enforcement_action="audit",error_type="compile_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-broker",policy_binding="ryft-broker",enforcement_action="audit",error_type="out_of_budget",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-vso",policy_binding="ryft-vso",enforcement_action="audit",error_type="invalid_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-traefik",policy_binding="ryft-traefik",enforcement_action="warn",error_type="invalid_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
      - { series: 'apiserver_validating_admission_policy_check_total{job="ryft/kube-apiserver-admission",policy="ryft-vso",policy_binding="ryft-vso",enforcement_action="audit",error_type="no_error",instance="10.0.1.5:443"}', values: '_x30 1x90' }
    alert_rule_test:
      - eval_time: 31m
        alertname: AdmissionPolicyError
        exp_alerts:
          - exp_labels: { severity: critical, policy: ryft-operators-cluster, policy_binding: ryft-operators-cluster, error_type: compile_error }
            exp_annotations:
              summary: "Admission policy ryft-operators-cluster (ryft-operators-cluster) fails to evaluate (compile_error) and refuses requests"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
          - exp_labels: { severity: critical, policy: ryft-broker, policy_binding: ryft-broker, error_type: out_of_budget }
            exp_annotations:
              summary: "Admission policy ryft-broker (ryft-broker) fails to evaluate (out_of_budget) and refuses requests"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
          - exp_labels: { severity: warning, policy: ryft-vso, policy_binding: ryft-vso, error_type: invalid_error }
            exp_annotations:
              summary: "Admission policy ryft-vso (ryft-vso) fails to evaluate (invalid_error); requests are admitted"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
          - exp_labels: { severity: warning, policy: ryft-traefik, policy_binding: ryft-traefik, error_type: invalid_error }
            exp_annotations:
              summary: "Admission policy ryft-traefik (ryft-traefik) fails to evaluate (invalid_error); requests are admitted"
              runbook: "docs/OPERATIONS.md → Admission policy signals"
      - { eval_time: 50m, alertname: AdmissionPolicyError, exp_alerts: [] }
  - name: admission bindings, sixteen of seventeen
    interval: 1m
    input_series:
