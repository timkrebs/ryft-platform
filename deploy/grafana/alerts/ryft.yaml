# RYFT alert rules for Grafana Cloud (Prometheus rule format, D85), for RYFT on Cloud Run. Check and load:
#   make alerts-check     # promtool check rules + the unit tests in ryft.test.yaml (containers)
#   make alerts-apply     # mimirtool rules load into the stack's ruler (GRAFANA_PROM_URL, _USER, GRAFANA_RULES_TOKEN)
# Then route them: Alerting → Contact points (email and the Grafana mobile app) and a
# notification policy for severity critical, warning and info. Expressions, thresholds
# and what to do: docs/OBSERVABILITY.md → Alerts.
# The app's metrics (ryft_*) arrive by OTLP push, not by scrape (design §6): each instance pushes
# at the end of each tick (every 15 minutes) and on SIGTERM, with job="ryft/<svc>" (the resource's
# service.namespace/service.name) and instance (service.instance.id, one per Cloud Run instance).
# So a series has a sample every 15 minutes at best, an instance that handles no tick pushes once
# (when it stops), and every instance is a new series. The rules are written for that:
#   - a gauge is read with last_over_time(...[30m]), never as an instant vector (stale after 5 min);
#   - a counter's increase() needs two samples of one series, so windows are 30 minutes or more;
#   - a counter only one push ever saw (a short-lived instance, its count since start) is caught by
#     the "new series" term: last_over_time(x[30m]) unless last_over_time(x[1h] offset 30m), a series
#     with a sample in the last 30 minutes and none in the hour before. Its value is what the instance
#     counted since it started; a sum of such values > 0 means events nobody saw as an increase.
# Cloud Run's own signals (5xx ratio, latency, 429s, Pub/Sub backlog and dead letters) are
# Grafana-managed rules in infra/gcp, read from Cloud Monitoring: HTTP5xxRatio, SyncSlow,
# DeadLetters, PushBacklog, Saturated. The EKS-coupled groups moved to eks-admission.yaml (checked,
# not loaded) or are gone (OBSERVABILITY.md → Alerts → EKS leftovers).
# Grafana Cloud takes at most 20 rules per group (alerts and recording rules; D179); keep a group
# at 18 or fewer and start a new one by theme (scripts/check_rule_groups.sh fails above 20;
# OBSERVABILITY.md → Alerts). A load replaces each named group whole, and a group not in the
# file stays live: rename or drop one only with its live copy in mind (make alerts-retire-eks).
namespace: ryft
groups:
  - name: ryft
    rules:
      # ---- the services -----------------------------------------------------------
      - alert: Panics
        # A panic anywhere (D173, D174): a handler (ryft_http_panics_total, answered 500), an event
        # handler (ryft_event_handler_panics_total, the push is answered 5xx and Pub/Sub redelivers) or a
        # service's own goroutine (ryft_goroutine_panics_total). The terms are joined with `or`, not `+`:
        # a sum would be empty as soon as one counter has no series, and hide the others. Each counter
        # has its increase over an hour (an instance that pushed before and after the panic) and the
        # new-series term (an instance whose first push already carried it). Known hole: a goroutine
        # panic ends the process with exit 2 before any push, so only Cloud Logging's msg="panic" line
        # and the container's exit show it (OBSERVABILITY.md → Alerts).
        expr: |
          sum by (job) (increase(ryft_http_panics_total[1h])) > 0
            or sum by (job) (last_over_time(ryft_http_panics_total[30m])
              unless last_over_time(ryft_http_panics_total[1h] offset 30m)) > 0
            or sum by (job) (increase(ryft_event_handler_panics_total[1h])) > 0
            or sum by (job) (last_over_time(ryft_event_handler_panics_total[30m])
              unless last_over_time(ryft_event_handler_panics_total[1h] offset 30m)) > 0
            or sum by (job) (increase(ryft_goroutine_panics_total[1h])) > 0
            or sum by (job) (last_over_time(ryft_goroutine_panics_total[30m])
              unless last_over_time(ryft_goroutine_panics_total[1h] offset 30m)) > 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }}: a panic in the last hour (the msg=\"panic\" line in Cloud Logging has the stack)"
          runbook: "docs/OPERATIONS.md → A panic (Panics)"
      - alert: TextRefusedByDatabase
        # Postgres refused a request's text (SQLSTATE 22021/22P05) that httpx's checks let
        # through: the client got a 422 and nothing was logged, where it used to be a logged
        # 500. A path the normalisation missed, or a server-side bug writing bad text. The
        # second term sees a route's first refusal in an instance, which increase() misses.
        expr: |
          sum by (job, route) (increase(ryft_http_text_refused_total{at="database"}[1h])) > 0
            or sum by (job, route) (last_over_time(ryft_http_text_refused_total{at="database"}[30m])
              unless last_over_time(ryft_http_text_refused_total{at="database"}[1h] offset 30m)) > 0
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.job }} {{ $labels.route }}: the database refused a request's text (OBSERVABILITY.md → Alerts)" }
      - alert: RateLimited
        # A client stuck in a retry loop, or limits too tight: more than 1800 refusals in 30 minutes
        # (one a second), counted over the instances that pushed twice and those that pushed once.
        expr: |
          (sum(increase(ryft_rate_limited_total[30m])) or vector(0))
            + (sum(last_over_time(ryft_rate_limited_total[30m])
                unless last_over_time(ryft_rate_limited_total[1h] offset 30m)) or vector(0))
            > 1800
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Over 1800 requests refused by the rate limits in 30 minutes" }
      - alert: AuthUnavailable
        # The signing keys or a user/allow-list lookup cannot be reached. jwks_refresh_limited is left out:
        # it is a token with an unknown key id inside the refresh limit (a rotation, or a forged kid that
        # anyone can send), retryable and not an outage.
        expr: |
          sum(increase(ryft_auth_failures_total{reason=~"jwks_unavailable|internal"}[30m])) > 0
            or sum(last_over_time(ryft_auth_failures_total{reason=~"jwks_unavailable|internal"}[30m])
              unless last_over_time(ryft_auth_failures_total{reason=~"jwks_unavailable|internal"}[1h] offset 30m)) > 0
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "Sign-ins fail: the signing keys or a user lookup cannot be reached (reason jwks_unavailable or internal)" }
      - alert: DatabaseDown
        # A service's ticks cannot reach Supabase (each tick sets ryft_db_up): pooler down, role
        # refused, circuit breaker (ECIRCUITBREAKER) after failed logins, a password pin that
        # differs from the role's (scripts/rotate_db_password.sh). max, not min: an instance that
        # stops without having run a tick must not page for the whole service.
        expr: max by (job) (last_over_time(ryft_db_up[30m])) == 0
        for: 20m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.job }} cannot reach the database (its ticks set ryft_db_up to 0)" }
      - alert: TickMissing
        # A service has handled no /internal/tick for 45 minutes, three ticks of the Scheduler job
        # ryft-tick (*/15). Without ticks there is no outbox relay, no rescoring pass, no metrics
        # push and no ryft_db_up, so the rules above go blind. One series per service from the start
        # (absence included): a service is quiet only when its tick counter rose in an instance that
        # pushed twice, or a new instance pushed it (the per-tick instance of a service at zero).
        expr: |
          (
            label_replace(vector(1), "job", "ryft/api", "", "")
              or label_replace(vector(1), "job", "ryft/ingest", "", "")
              or label_replace(vector(1), "job", "ryft/scoring", "", "")
              or label_replace(vector(1), "job", "ryft/notify", "", "")
          )
            unless on (job) (sum by (job) (increase(ryft_ticks_total[45m])) > 0)
            unless on (job) (sum by (job) (last_over_time(ryft_ticks_total[45m])
              unless last_over_time(ryft_ticks_total[1h] offset 45m)) > 0)
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} has handled no tick for 45 minutes (Scheduler job ryft-tick, subscription tick-<svc>)"
          runbook: "docs/OPERATIONS.md → GCP"

  - name: ryft-pipeline
    rules:
      # ---- events (Pub/Sub) -----------------------------------------------------------
      - alert: DeadLetterPublishFailing
        # Not even the dead-letter publish worked.
        expr: |
          sum(increase(ryft_events_dlq_total{result="error"}[1h])) > 0
            or sum(last_over_time(ryft_events_dlq_total{result="error"}[30m])
              unless last_over_time(ryft_events_dlq_total{result="error"}[1h] offset 30m)) > 0
        labels: { severity: critical }
        annotations: { summary: "A dead-letter publish failed (Cloud Logging has the event)" }
      - alert: OutboxBacklog
        # Events written but not published for over 30 minutes: the publish after the request and
        # two tick passes failed (D101). Nothing is lost; scores wait. Only due rows count, so a
        # deliberately deferred notification is no backlog.
        expr: max by (publisher) (last_over_time(ryft_outbox_oldest_seconds[30m])) > 1800
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.publisher }}: outbox events waiting over 30 minutes for Pub/Sub" }
      - alert: OutboxStuck
        # An event failed 50 sends and was set aside: no topic takes its key, or it is
        # malformed. It needs a person (OPERATIONS → The outbox).
        expr: max by (publisher) (last_over_time(ryft_outbox_stuck[30m])) > 0
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.publisher }}: outbox events set aside after 50 failed sends" }
      - alert: PublishFailing
        # Syncs are stored but scoring does not hear of them (the outbox retries on each tick).
        expr: |
          sum(increase(ryft_events_published_total{result="error"}[30m])) > 0
            or sum(last_over_time(ryft_events_published_total{result="error"}[30m])
              unless last_over_time(ryft_events_published_total{result="error"}[1h] offset 30m)) > 0
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Publishing to Pub/Sub fails (the outbox keeps the events and retries)" }
      - alert: SyncToScoreSlow
        # Testers wait over two minutes for their scores after a sync (p95 of the days scored over
        # an hour: a histogram needs two pushes of one instance, so a short-lived one is not seen).
        expr: histogram_quantile(0.95, sum by (le) (rate(ryft_sync_to_score_seconds_bucket[1h]))) > 120
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Scores take over 2 minutes after a sync (p95 over an hour)" }
      - alert: ScoringErrors
        expr: |
          sum(increase(ryft_days_scored_total{result="error"}[30m])) > 0
            or sum(last_over_time(ryft_days_scored_total{result="error"}[30m])
              unless last_over_time(ryft_days_scored_total{result="error"}[1h] offset 30m)) > 0
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Days fail to score" }
      - alert: NoSync
        # No phone has synced for six hours: the newest ryft_last_sync_timestamp_seconds of any
        # ingest instance in six hours, or none pushed at all in that time.
        # Per tester: the panel "Testers by last sync", not a page.
        expr: |
          (time() - max(max_over_time(ryft_last_sync_timestamp_seconds[6h])) > 6 * 3600)
            or absent_over_time(ryft_last_sync_timestamp_seconds[6h])
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "No RYFT sync for over six hours" }

  - name: ryft-ops
    rules:
      # ---- push -------------------------------------------------------------------
      - alert: APNsFailing
        # More than 10 % of APNs requests failed over an hour (at least 5 requests).
        # 410 Unregistered is not a failure: the app was deleted, the token is dropped.
        expr: |
          (sum(increase(ryft_apns_responses_total{status!~"200|410"}[1h]))
            / sum(increase(ryft_apns_responses_total[1h])) > 0.1)
          and sum(increase(ryft_apns_responses_total[1h])) >= 5
        labels: { severity: warning }
        annotations: { summary: "Over 10 % of APNs requests fail (status label: 400 = wrong environment, 403 = the key)" }
      - alert: PushFailing
        # notify reached no device for a notification (APNs unreachable after retries,
        # or every device refused it). "unconfigured" (no APNs key yet) is not a failure.
        expr: |
          sum(increase(ryft_push_notifications_total{result="failed"}[1h])) > 0
            or sum(last_over_time(ryft_push_notifications_total{result="failed"}[30m])
              unless last_over_time(ryft_push_notifications_total{result="failed"}[1h] offset 30m)) > 0
        labels: { severity: warning }
        annotations: { summary: "Push notifications are not reaching devices" }
      - alert: APNsRejectsOurKey
        # 403: InvalidProviderToken and friends — the APNs key was revoked, or key ID / team ID do not match.
        expr: |
          sum(increase(ryft_apns_responses_total{status="403"}[1h])) > 0
            or sum(last_over_time(ryft_apns_responses_total{status="403"}[30m])
              unless last_over_time(ryft_apns_responses_total{status="403"}[1h] offset 30m)) > 0
        labels: { severity: critical }
        annotations: { summary: "APNs refuses notify's provider token (check APNS_KEY_ID, APNS_TEAM_ID, the apns-key-p8 pin)" }

      # ---- accounts and the beta --------------------------------------------------
      - alert: AccountDeletionIncomplete
        expr: |
          sum(increase(ryft_account_deletions_total{step=~"auth|apple",result=~"error|skipped"}[1h])) > 0
            or sum(last_over_time(ryft_account_deletions_total{step=~"auth|apple",result=~"error|skipped"}[30m])
              unless last_over_time(ryft_account_deletions_total{step=~"auth|apple",result=~"error|skipped"}[1h] offset 30m)) > 0
        labels: { severity: warning }
        annotations: { summary: "A deleted account still has its Supabase sign-in or Apple grant" }
      - alert: NewFeedback
        # A tester sent feedback: read it with scripts/beta_report.sh feedback.
        expr: |
          sum(increase(ryft_feedback_received_total[1h])) > 0
            or sum(last_over_time(ryft_feedback_received_total[30m])
              unless last_over_time(ryft_feedback_received_total[1h] offset 30m)) > 0
        labels: { severity: info }
        annotations: { summary: "New beta feedback (scripts/beta_report.sh feedback)" }
      # The admin alerts (D158): no personal data in a label, and they only reach Grafana through
      # `make alerts-apply` (OPERATIONS.md -> Beta -> Admin sign-in).
      - alert: AdminUnauthorized
        # More than 20 /v1/admin requests with a bad bearer in 30 minutes: a scanner, a guessed key, a
        # stale or foreign token. The api never sees a guessed password (that is Supabase Auth: Supabase ->
        # Logs -> Auth). The answer is the same 401 for every reason; the reason is the api's "admin auth
        # rejected" log line and the access line's code. The per-address limit
        # (ryft_rate_limited_total{class="admin_ip"}) caps what one address can send. A real operator
        # refused for want of a fresh second factor (result="mfa_required") is in neither alert, on
        # purpose: it is in the audit and the log (OPERATIONS.md -> Beta -> Admin sign-in).
        expr: |
          (sum(increase(ryft_admin_requests_total{result="unauthorized"}[30m])) or vector(0))
            + (sum(last_over_time(ryft_admin_requests_total{result="unauthorized"}[30m])
                unless last_over_time(ryft_admin_requests_total{result="unauthorized"}[1h] offset 30m)) or vector(0))
            > 20
        labels: { severity: warning }
        annotations:
          summary: "Repeated admin requests with a bad bearer (OPERATIONS.md → Beta → Admin sign-in; password attacks are in Supabase → Logs → Auth)"
          runbook: "docs/OPERATIONS.md → Beta → Admin sign-in"
      - alert: AdminWebUsed
        # The operator's page (an admin Supabase token) was used. Who is in GET /v1/admin/audit, not in a
        # label: a user id in a metric is personal data in Grafana Cloud. A use you did not make is the signal.
        expr: |
          sum(increase(ryft_admin_authorized_total{actor="user"}[1h])) > 0
            or sum(last_over_time(ryft_admin_authorized_total{actor="user"}[30m])
              unless last_over_time(ryft_admin_authorized_total{actor="user"}[1h] offset 30m)) > 0
        labels: { severity: info }
        annotations:
          summary: "The admin page was used (GET /v1/admin/audit shows by whom; OPERATIONS.md → Beta → Admin sign-in)"
          runbook: "docs/OPERATIONS.md → Beta → Admin sign-in (lost phone: delete the admin_accounts row)"
      - alert: InviteEmailPurgeFailing
        # The job that clears the email (and note) of an invite code 30 days after it stopped being
        # redeemable (D161) keeps failing: three failed passes in three hours. The address of someone who
        # only asked for an invite then stays longer than the privacy text says. Nothing user-visible
        # breaks, so a warning. The api logs "invite email purge failed" with the cause.
        expr: sum(increase(ryft_invite_email_purge_total{result="error"}[3h])) >= 3
        labels: { severity: warning }
        annotations:
          summary: "The job that clears bound invite emails keeps failing (OPERATIONS.md → Beta → A code for one person)"
          runbook: "docs/OPERATIONS.md → Beta → A code for one person"

      # ---- from outside (Synthetic Monitoring, deploy/grafana/synthetics) ----------------
      # probe_success per probe (labels job, instance, probe): the site's checks every 5 minutes, the
      # services' every 10. The agent republishes a run's last result about every 2 minutes.
      - alert: ApiDown
        # api.ryftlab.de or ingest.ryftlab.de fails its startup probe (/health/ready, exactly 200) from
        # every probe for 10 minutes: the service, its domain mapping, its certificate, or the database
        # behind /health/ready. SiteDown's shape.
        expr: max by (job, instance) (max_over_time(probe_success{job=~"ryft-(api|ingest)-ready"}[10m])) == 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} fails from every probe (job {{ $labels.job }})"
          runbook: "docs/OPERATIONS.md → GCP"
      # Runbook for the Site* alerts: OPERATIONS.md → Apex site and apple-app-site-association → When a
      # synthetic alert fires.
      - alert: SiteDown
        # The home page, /privacy or the AASA fails from every probe for 10 minutes: the
        # site is down, or healthy but wrong (the checks pin status, content type and a
        # marker in the body); a changed AASA breaks universal links and password AutoFill.
        expr: max by (job, instance) (max_over_time(probe_success{job=~"ryft-site-(home|privacy|aasa)"}[10m])) == 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} fails from every probe (job {{ $labels.job }})"
          runbook: "docs/OPERATIONS.md → Apex site and apple-app-site-association"
      - alert: SiteProbeFlapping
        # One probe sees failures (two or more in 30 minutes) while another still gets through:
        # a probe or route problem, a pod that fails now and then, or the edge's rate limit.
        # Left out for 30 minutes after SiteDown's own condition held (no probe passed in a
        # 10-minute window): the probes' 30-minute averages are still low after recovery.
        # Failures that merely overlap between probes do not suppress it.
        expr: |
          (max by (job, instance, probe) (avg_over_time(probe_success{job=~"ryft-site-.*"}[30m])) < 0.8)
            unless on (job, instance)
          (min_over_time((max by (job, instance) (max_over_time(probe_success{job=~"ryft-site-.*"}[10m])))[30m:1m]) == 0)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} fails now and then from probe {{ $labels.probe }}"
          runbook: "docs/OPERATIONS.md → Apex site and apple-app-site-association"
      - alert: SiteWwwRedirectBroken
        # www.ryftlab.de no longer answers 301 to https://ryftlab.de/ from any probe, 10 minutes.
        expr: max by (job, instance) (max_over_time(probe_success{job="ryft-site-www-redirect"}[10m])) == 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} does not redirect to the apex"
          runbook: "docs/OPERATIONS.md → Apex site and apple-app-site-association"
      - alert: SiteCertificateExpiring
        # The certificate the probes are served (apex and www) expires in under 14 days:
        # cert-manager renews at 30 days, so renewal has failed for two weeks. The > 0 leaves
        # out a probe without a TLS handshake (the metric is 0 then).
        expr: |
          (min by (job, instance) (probe_ssl_earliest_cert_expiry{job=~"ryft-site-.*"} > 0) - time()) < 14 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The certificate of {{ $labels.instance }} expires in under 14 days"
          runbook: "docs/OPERATIONS.md → Apex site and apple-app-site-association"
      - alert: SyntheticsMissing
        # A check reports nothing for 25 minutes (a 10-minute window, then 15): it was deleted or disabled, Synthetic
        # Monitoring is switched off, or its limit is used up. That job is unwatched until fixed.
        # scripts/synthetics.sh holds these lines to the enabled checks of ryftlab.json.
        expr: |
          absent_over_time(probe_success{job="ryft-site-home"}[10m])
            or absent_over_time(probe_success{job="ryft-site-privacy"}[10m])
            or absent_over_time(probe_success{job="ryft-site-aasa"}[10m])
            or absent_over_time(probe_success{job="ryft-site-www-redirect"}[10m])
            or absent_over_time(probe_success{job="ryft-api-ready"}[10m])
            or absent_over_time(probe_success{job="ryft-ingest-ready"}[10m])
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "No Synthetic Monitoring results for {{ $labels.job }} for 25 minutes"
          runbook: "docs/OPERATIONS.md → Monitoring (Grafana Cloud)"
