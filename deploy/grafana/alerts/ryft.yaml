# RYFT alert rules for Grafana Cloud (Prometheus rule format, D85). Check and load:
#   make alerts-check     # promtool check rules + the unit tests in ryft.test.yaml (containers)
#   make alerts-apply     # mimirtool rules load into the stack's ruler (GRAFANA_PROM_URL, _USER, GRAFANA_RULES_TOKEN)
# Then route them: Alerting → Contact points (email and the Grafana mobile app) and a
# notification policy for severity critical, warning and info. Expressions, thresholds
# and what to do: docs/OBSERVABILITY.md → Alerts. Labels namespace and pod come from the
# collector's pod discovery.
namespace: ryft
groups:
  - name: ryft
    rules:
      # ---- the services -----------------------------------------------------------
      - alert: HTTP5xxRatio
        # More than 2 % of api or ingest requests fail with a 5xx for 10 minutes.
        expr: |
          sum by (namespace) (rate(ryft_http_requests_total{namespace=~"ryft-(api|ingest)", code=~"5.."}[5m]))
            / sum by (namespace) (rate(ryft_http_requests_total{namespace=~"ryft-(api|ingest)"}[5m])) > 0.02
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.namespace }}: more than 2 % of requests answer 5xx" }
      - alert: PodRestarting
        # A RYFT pod restarted more than three times in 30 minutes (crash loop, OOM).
        expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~"ryft-.*"}[30m])) > 3
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.pod }} restarted more than 3 times in 30 minutes" }
      - alert: Panics
        expr: sum(increase(ryft_http_panics_total[15m])) > 0
        labels: { severity: critical }
      - alert: TextRefusedByDatabase
        # Postgres refused a request's text (SQLSTATE 22021/22P05) that httpx's checks let
        # through: the client got a 422 and nothing was logged, where it used to be a logged
        # 500. A path the normalisation missed, or a server-side bug writing bad text. The
        # second term sees a route's first refusal, which increase() misses: the series is
        # created at 1. It counts as new only if it had no sample in the hour before the
        # last one, so a scrape gap around the offset does not fire (OBSERVABILITY.md → Alerts).
        expr: |
          sum by (namespace, route) (increase(ryft_http_text_refused_total{at="database"}[1h])) > 0
            or sum by (namespace, route) (ryft_http_text_refused_total{at="database"}
              unless last_over_time(ryft_http_text_refused_total{at="database"}[1h] offset 1h)) > 0
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.namespace }} {{ $labels.route }}: the database refused a request's text (OBSERVABILITY.md → Alerts)" }
      - alert: SyncSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(ryft_http_request_duration_seconds_bucket{route="POST /v1/sync"}[15m]))) > 10
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Syncs take over 10 s (p95)" }
      - alert: RateLimited
        # A client stuck in a retry loop, or limits too tight.
        expr: sum(rate(ryft_rate_limited_total[10m])) > 1
        for: 10m
        labels: { severity: warning }
      - alert: AuthUnavailable
        expr: sum(rate(ryft_auth_failures_total{reason=~"jwks_.*|internal"}[5m])) > 0
        for: 5m
        labels: { severity: critical }
      - alert: DatabaseDown
        # A service cannot reach Supabase (pings every 30 s): pooler down, role
        # refused, circuit breaker (ECIRCUITBREAKER) after failed logins.
        expr: min by (service) (ryft_db_up) == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.service }} cannot reach the database" }
      - alert: DatabaseFlapping
        expr: sum by (service) (increase(ryft_db_ping_failures_total[15m])) > 3
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.service }}: database pings keep failing" }
      - alert: CertificateExpiring
        # cert-manager renews 30 days ahead; under 14 days left, renewal has been failing for two weeks.
        expr: min by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 86400
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 14 days" }

      # ---- events -----------------------------------------------------------------
      - alert: DeadLetters
        # An event could not be handled and was dead-lettered (OPERATIONS.md → RabbitMQ).
        expr: sum by (subject) (increase(ryft_events_dlq_total{result="ok"}[1h])) > 0
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.subject }}: an event was dead-lettered (scripts/dlq.sh list)" }
      - alert: DeadLetterPublishFailing
        # Not even the dead-letter publish worked: the message was rejected, and the
        # broker's delivery limit dead-letters it once it is out of attempts.
        expr: sum(increase(ryft_events_dlq_total{result="error"}[1h])) > 0
        labels: { severity: critical }
      # ---- RabbitMQ (D97; quiet until the broker exists: no series, no alert) --------
      - alert: RabbitMQBacklog
        # scoring or notify is not keeping up with its queue (per queue, from the broker).
        expr: max by (queue) (rabbitmq_queue_messages_ready{vhost="ryft", queue=~"scoring|notify"}) > 100
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "RabbitMQ {{ $labels.queue }}: over 100 events waiting for 15 minutes" }
      - alert: RabbitMQDeadLetters
        # Something waits in a dead-letter queue (scripts/dlq.sh list; OPERATIONS → RabbitMQ).
        expr: max by (queue) (rabbitmq_queue_messages{vhost="ryft", queue=~"dlq\\..*"}) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "RabbitMQ {{ $labels.queue }} holds dead letters (scripts/dlq.sh list)" }
      - alert: RabbitMQAlarm
        # A node's memory or disk alarm: the broker blocks every publisher until it clears.
        expr: max(rabbitmq_alarms_memory_used_watermark) > 0 or max(rabbitmq_alarms_free_disk_space_watermark) > 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "RabbitMQ blocks publishers (memory or disk alarm)" }
      - alert: RabbitMQNodeDown
        # Fewer than three nodes report: quorum queues still work with two, not with one.
        expr: count(rabbitmq_identity_info{rabbitmq_cluster="rabbitmq"}) < 3
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "RabbitMQ: only {{ $value }} of 3 nodes report" }
      - alert: AMQPDisconnected
        # A service cannot reach RabbitMQ (it keeps running, /readyz says why; D47).
        expr: max by (namespace) (ryft_amqp_connected) == 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.namespace }} is not connected to RabbitMQ" }
      - alert: EventsUnroutable
        # An event no queue is bound for: the topology lacks a binding (internal/events/amqpbus/topology.go).
        expr: sum by (reason) (increase(ryft_events_published_total{result="unroutable"}[15m])) > 0
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.reason }} events are unroutable on RabbitMQ" }
      - alert: OutboxBacklog
        # Events written but not confirmed by the broker for over 5 minutes: the relay
        # cannot reach it, or the broker refuses (D101). Nothing is lost; scores wait.
        expr: max by (publisher) (ryft_outbox_oldest_seconds) > 300
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.publisher }}: outbox events waiting over 5 minutes for the broker" }
      - alert: OutboxStuck
        # An event failed 50 sends and was set aside: no queue takes its key, or it is
        # malformed. It needs a person (OPERATIONS → RabbitMQ → The outbox).
        expr: max by (publisher) (ryft_outbox_stuck) > 0
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.publisher }}: outbox events set aside after 50 failed sends" }
      - alert: PublishFailing
        # Syncs are stored but scoring does not hear of them (the 15-minute pass catches up).
        expr: sum(rate(ryft_events_published_total{result="error"}[10m])) > 0
        for: 10m
        labels: { severity: warning }
      - alert: SyncToScoreSlow
        # Testers wait over two minutes for their scores after a sync (p95 of the days scored).
        expr: histogram_quantile(0.95, sum by (le) (rate(ryft_sync_to_score_seconds_bucket[15m]))) > 120
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Scores take over 2 minutes after a sync (p95)" }
      - alert: ScoringErrors
        expr: sum(rate(ryft_days_scored_total{result="error"}[15m])) > 0
        for: 15m
        labels: { severity: warning }
      - alert: NoSync
        # No phone has synced for six hours (the gauge lives in ingest's memory;
        # absent() also fires when nothing reports it, e.g. after a restart).
        # Per tester: the panel "Testers by last sync", not a page.
        expr: (time() - max(ryft_last_sync_timestamp_seconds) > 6 * 3600) or absent(ryft_last_sync_timestamp_seconds)
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "No RYFT sync for over six hours" }

      # ---- push -------------------------------------------------------------------
      - alert: APNsFailing
        # More than 10 % of APNs requests failed over 30 minutes (at least 5 requests).
        # 410 Unregistered is not a failure: the app was deleted, the token is dropped.
        expr: |
          (sum(increase(ryft_apns_responses_total{status!~"200|410"}[30m]))
            / sum(increase(ryft_apns_responses_total[30m])) > 0.1)
          and sum(increase(ryft_apns_responses_total[30m])) >= 5
        labels: { severity: warning }
        annotations: { summary: "Over 10 % of APNs requests fail (status label: 400 = wrong environment, 403 = the key)" }
      - alert: PushFailing
        # notify reached no device for a notification (APNs unreachable after retries,
        # or every device refused it). "unconfigured" (no APNs key yet) is not a failure.
        expr: sum(increase(ryft_push_notifications_total{result="failed"}[1h])) > 0
        labels: { severity: warning }
        annotations: { summary: "Push notifications are not reaching devices" }
      - alert: APNsRejectsOurKey
        # 403: InvalidProviderToken and friends — the APNs key was revoked, or key ID / team ID do not match.
        expr: sum(increase(ryft_apns_responses_total{status="403"}[15m])) > 0
        labels: { severity: critical }
        annotations: { summary: "APNs refuses notify's provider token (check APNS_KEY_ID, APNS_TEAM_ID, APNS_KEY_P8)" }

      # ---- accounts and the beta --------------------------------------------------
      - alert: AccountDeletionIncomplete
        expr: sum(increase(ryft_account_deletions_total{step=~"auth|apple",result=~"error|skipped"}[1h])) > 0
        labels: { severity: warning }
        annotations: { summary: "A deleted account still has its Supabase sign-in or Apple grant" }
      - alert: NewFeedback
        # A tester sent feedback: read it with scripts/beta_report.sh feedback.
        expr: sum(increase(ryft_feedback_received_total[10m])) > 0
        labels: { severity: info }
        annotations: { summary: "New beta feedback (scripts/beta_report.sh feedback)" }

      # ---- deploys (Argo CD, D94) ---------------------------------------------------
      - alert: ArgoAppDegraded
        # An application's workloads are failing: a crash-looping pod, a failed PostSync
        # smoke (the release is in, but something end to end does not work).
        expr: max by (name) (argocd_app_info{health_status="Degraded"}) > 0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Argo CD application {{ $labels.name }} is Degraded (argocd app get, OPERATIONS.md → Deploy)" }
      - alert: ArgoAppOutOfSync
        # git and the cluster differ for 30 minutes although auto-sync is on: a sync that
        # keeps failing, a wave waiting on an unhealthy one, or manifests that do not
        # render (sync status Unknown). Applications with auto-sync paused are left out.
        expr: max by (name) (argocd_app_info{sync_status!="Synced", autosync_enabled="true"}) > 0
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Argo CD application {{ $labels.name }} has not matched git for 30 minutes" }
      - alert: ArgoSyncFailed
        # A sync ended in Failed or Error: a migration (PreSync), an apply the API
        # server refused, or the smoke (PostSync). Nothing after the failing step ran.
        expr: sum by (name) (increase(argocd_app_sync_total{phase=~"Error|Failed"}[15m])) > 0
        labels: { severity: critical }
        annotations: { summary: "Argo CD sync of {{ $labels.name }} failed (its last operation names the step)" }
      - alert: ArgoMetricsMissing
        # The application controller is not scraped: Argo CD is down, or its metrics
        # policy broke; deploys and the three alerts above are blind.
        expr: absent(argocd_app_info)
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "No Argo CD metrics for 15 minutes" }

      # ---- the site from outside (Synthetic Monitoring, deploy/grafana/synthetics) ----
      # probe_success per probe (labels job, instance, probe) every 5 minutes. Runbook for all:
      # OPERATIONS.md → Apex site and apple-app-site-association → When a synthetic alert fires.
      - alert: SiteDown
        # The home page, /privacy or the AASA fails from every probe for 10 minutes: the
        # site is down, or healthy but wrong (the checks pin status, content type and a
        # marker in the body); a changed AASA breaks universal links and password AutoFill.
        expr: max by (job, instance) (max_over_time(probe_success{job=~"ryft-site-(home|privacy|aasa)"}[10m])) == 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} fails from every probe (job {{ $labels.job }})"
          runbook: "docs/OPERATIONS.md → Apex site and apple-app-site-association"
      - alert: SiteProbeFlapping
        # One probe sees failures (two or more in 30 minutes) while another still gets through:
        # a probe or route problem, a pod that fails now and then, or the edge's rate limit.
        # Left out for 30 minutes after SiteDown's own condition held (no probe passed in a
        # 10-minute window): the probes' 30-minute averages are still low after recovery.
        # Failures that merely overlap between probes do not suppress it.
        expr: |
          (max by (job, instance, probe) (avg_over_time(probe_success{job=~"ryft-site-.*"}[30m])) < 0.8)
            unless on (job, instance)
          (min_over_time((max by (job, instance) (max_over_time(probe_success{job=~"ryft-site-.*"}[10m])))[30m:1m]) == 0)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} fails now and then from probe {{ $labels.probe }}"
          runbook: "docs/OPERATIONS.md → Apex site and apple-app-site-association"
      - alert: SiteWwwRedirectBroken
        # www.ryftapp.de no longer answers 301 to https://ryftapp.de/ from any probe, 10 minutes.
        expr: max by (job, instance) (max_over_time(probe_success{job="ryft-site-www-redirect"}[10m])) == 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} does not redirect to the apex"
          runbook: "docs/OPERATIONS.md → Apex site and apple-app-site-association"
      - alert: SiteCertificateExpiring
        # The certificate the probes are served (apex and www) expires in under 14 days:
        # cert-manager renews at 30 days, so renewal has failed for two weeks. The > 0 leaves
        # out a probe without a TLS handshake (the metric is 0 then).
        expr: |
          (min by (job, instance) (probe_ssl_earliest_cert_expiry{job=~"ryft-site-.*"} > 0) - time()) < 14 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The certificate of {{ $labels.instance }} expires in under 14 days"
          runbook: "docs/OPERATIONS.md → Apex site and apple-app-site-association"
      - alert: SyntheticsMissing
        # A check reports nothing for 25 minutes (a 10-minute window, then 15): it was deleted or disabled, Synthetic
        # Monitoring is switched off, or its limit is used up. That job is unwatched until fixed.
        expr: |
          absent_over_time(probe_success{job="ryft-site-home"}[10m])
            or absent_over_time(probe_success{job="ryft-site-privacy"}[10m])
            or absent_over_time(probe_success{job="ryft-site-aasa"}[10m])
            or absent_over_time(probe_success{job="ryft-site-www-redirect"}[10m])
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "No Synthetic Monitoring results for {{ $labels.job }} for 25 minutes"
          runbook: "docs/OPERATIONS.md → Monitoring (Grafana Cloud)"
