  - name: every vault server scrape fails, so no node is active is not known
    interval: 1m
    input_series:
      - { series: 'kube_pod_labels{job="ryft/vault-state",namespace="vault",pod="vault-0",label_vault_initialized="true",label_vault_sealed="false",label_vault_active="true"}', values: '1x40' }
