      - { series: 'up{job="ryft/vault",pod="vault-0"}', values: '0x40' }
      - { series: 'up{job="ryft/vault",pod="vault-1"}', values: '1x40' }
    alert_rule_test:
      # vault-0's scrape fails while vault-1's works: the rule names the failing pod.
