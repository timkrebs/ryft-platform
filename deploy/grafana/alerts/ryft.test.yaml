    alert_rule_test:
      - { eval_time: 15m, alertname: VaultRaftPeersBelow3, exp_alerts: [] }
      - eval_time: 30m
        alertname: VaultRaftPeersBelow3
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Only 2 of 3 Raft peers are healthy: one more loss ends the quorum"
              runbook: "docs/OPERATIONS.md → Vault alerts (VaultRaftPeersBelow3)"
  - name: raft peers all healthy
    interval: 1m
    input_series:
      - { series: 'vault_core_active{job="ryft/vault",pod="vault-1",vault_cluster="vault-integrated-storage"}', values: '1x40' }
      - { series: 'vault_autopilot_node_healthy{job="ryft/vault",pod="vault-1",node_id="vault-0"}', values: '1x40' }
      - { series: 'vault_autopilot_node_healthy{job="ryft/vault",pod="vault-1",node_id="vault-1"}', values: '1x40' }
      - { series: 'vault_autopilot_node_healthy{job="ryft/vault",pod="vault-1",node_id="vault-2"}', values: '1x40' }
    alert_rule_test:
      - { eval_time: 30m, alertname: VaultRaftPeersBelow3, exp_alerts: [] }
  - name: vault snapshots every 6 hours are fresh
    interval: 10m
    input_series:
      - { series: 'kube_statefulset_status_replicas_ready{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '3x120' }
      # Runs at 17 past every sixth hour, each done a minute later.
      - { series: 'kube_cronjob_status_last_schedule_time{job="ryft/vault-state",namespace="vault",cronjob="vault-snapshot"}', values: '1020x35 22620x35 44220x35 65820x14' }
      - { series: 'kube_cronjob_status_last_successful_time{job="ryft/vault-state",namespace="vault",cronjob="vault-snapshot"}', values: '1080x35 22680x35 44280x35 65880x14' }
    alert_rule_test:
      - { eval_time: 19h, alertname: VaultSnapshotStale, exp_alerts: [] }
      - { eval_time: 19h, alertname: VaultSnapshotFailing, exp_alerts: [] }
  - name: a run that succeeded in the second it was scheduled is not failing
    interval: 5m
    input_series:
      - { series: 'kube_statefulset_status_replicas_ready{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '3x30' }
      - { series: 'kube_cronjob_status_last_schedule_time{job="ryft/vault-state",namespace="vault",cronjob="vault-snapshot"}', values: '1020x30' }
      - { series: 'kube_cronjob_status_last_successful_time{job="ryft/vault-state",namespace="vault",cronjob="vault-snapshot"}', values: '1020x30' }
    alert_rule_test:
      - { eval_time: 2h, alertname: VaultSnapshotFailing, exp_alerts: [] }
  - name: vault snapshot stale after 13 hours
    interval: 10m
    input_series:
      - { series: 'kube_statefulset_status_replicas_ready{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '3x120' }
      # The last success at 18 minutes; every run after that fails.
      - { series: 'kube_cronjob_status_last_successful_time{job="ryft/vault-state",namespace="vault",cronjob="vault-snapshot"}', values: '1080x120' }
    alert_rule_test:
      - { eval_time: 790m, alertname: VaultSnapshotStale, exp_alerts: [] }
      - eval_time: 810m
        alertname: VaultSnapshotStale
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "No Vault snapshot has succeeded for over 13 hours (RPO 6 h)"
              runbook: "docs/OPERATIONS.md → Vault → Snapshots"
  - name: a stale snapshot of a vault that is down now pages as VaultUnavailable, not stale
    interval: 10m
    input_series:
      # The last success at 18 minutes; every server down from 13 h 50 m.
      - { series: 'kube_statefulset_status_replicas_ready{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '3x82 0x38' }
      - { series: 'kube_cronjob_status_last_successful_time{job="ryft/vault-state",namespace="vault",cronjob="vault-snapshot"}', values: '1080x120' }
    alert_rule_test:
      - eval_time: 13h30m
        alertname: VaultSnapshotStale
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "No Vault snapshot has succeeded for over 13 hours (RPO 6 h)"
              runbook: "docs/OPERATIONS.md → Vault → Snapshots"
      - { eval_time: 14h, alertname: VaultSnapshotStale, exp_alerts: [] }
  - name: vault snapshot never succeeded in 13 hours of a ready vault
    interval: 10m
    input_series:
      - { series: 'kube_statefulset_status_replicas_ready{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '3x120' }
      - { series: 'kube_cronjob_status_last_schedule_time{job="ryft/vault-state",namespace="vault",cronjob="vault-snapshot"}', values: '1020x120' }
    alert_rule_test:
      - { eval_time: 770m, alertname: VaultSnapshotStale, exp_alerts: [] }
      - eval_time: 800m
        alertname: VaultSnapshotStale
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "No Vault snapshot has succeeded for over 13 hours (RPO 6 h)"
              runbook: "docs/OPERATIONS.md → Vault → Snapshots"
  - name: a vault down in between gets 13 new hours for its first snapshot
    interval: 10m
    input_series:
      # Ready from 0 to 5 h, down until 6 h, ready again; no success ever.
      - { series: 'kube_statefulset_status_replicas_ready{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '3x30 0x6 3x90' }
    alert_rule_test:
      - { eval_time: 14h, alertname: VaultSnapshotStale, exp_alerts: [] }
      - eval_time: 19h40m
        alertname: VaultSnapshotStale
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "No Vault snapshot has succeeded for over 13 hours (RPO 6 h)"
              runbook: "docs/OPERATIONS.md → Vault → Snapshots"
  - name: the success series has been gone for 13 hours, not 12
    interval: 10m
    input_series:
      - { series: 'kube_statefulset_status_replicas_ready{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '3x130' }
      # lastSuccessfulTime reported until 1 h, then gone (the CronJob replaced, its status empty).
      - { series: 'kube_cronjob_status_last_successful_time{job="ryft/vault-state",namespace="vault",cronjob="vault-snapshot"}', values: '1080x6' }
    alert_rule_test:
      - { eval_time: 13h30m, alertname: VaultSnapshotStale, exp_alerts: [] }
      - eval_time: 14h10m
        alertname: VaultSnapshotStale
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "No Vault snapshot has succeeded for over 13 hours (RPO 6 h)"
              runbook: "docs/OPERATIONS.md → Vault → Snapshots"
  - name: a fresh init has 13 hours for its first snapshot
    interval: 10m
    input_series:
      # Ready from 5 hours in (the init); no success yet at 14 hours.
      - { series: 'kube_statefulset_status_replicas_ready{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '0x30 3x90' }
    alert_rule_test:
      - { eval_time: 14h, alertname: VaultSnapshotStale, exp_alerts: [] }
  - name: one vault snapshot run failed
    interval: 5m
    input_series:
      # The 6:17 run (22620 s) fails; the last success is the 0:17 run's.
      - { series: 'kube_cronjob_status_last_schedule_time{job="ryft/vault-state",namespace="vault",cronjob="vault-snapshot"}', values: '1020x75 22620x30' }
      - { series: 'kube_cronjob_status_last_successful_time{job="ryft/vault-state",namespace="vault",cronjob="vault-snapshot"}', values: '1080x105' }
    alert_rule_test:
      - { eval_time: 300m, alertname: VaultSnapshotFailing, exp_alerts: [] }
      - { eval_time: 400m, alertname: VaultSnapshotFailing, exp_alerts: [] }
      - eval_time: 420m
        alertname: VaultSnapshotFailing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "The latest Vault snapshot run did not succeed"
              runbook: "docs/OPERATIONS.md → Vault → Snapshots"
  - name: the first snapshot runs after the init fail
    interval: 5m
    input_series:
      # Ready from 35 minutes (the init); the run scheduled at 40 minutes (2400 s) fails.
      - { series: 'kube_statefulset_status_replicas_ready{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '0x6 3x30' }
      - { series: 'kube_cronjob_status_last_schedule_time{job="ryft/vault-state",namespace="vault",cronjob="vault-snapshot"}', values: '_x8 2400x28' }
    alert_rule_test:
      - { eval_time: 65m, alertname: VaultSnapshotFailing, exp_alerts: [] }
      - eval_time: 75m
        alertname: VaultSnapshotFailing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "The latest Vault snapshot run did not succeed"
              runbook: "docs/OPERATIONS.md → Vault → Snapshots"
  - name: vault audit writes fail
    interval: 1m
    input_series:
      # Vault adds 0 or 1 on every request, so a counter is cumulative and stays while requests
      # come; 2 minutes without one and it expires.
      # vault-0: a live counter that moves from 0 to 1 at 20 minutes.
      - { series: 'vault_audit_log_request_failure{job="ryft/vault",pod="vault-0",vault_cluster="vault-integrated-storage"}', values: '0x20 1x30' }
      # vault-1: no request for a while, then a failing one: the counter appears at 2 and expires.
      - { series: 'vault_audit_log_response_failure{job="ryft/vault",pod="vault-1",vault_cluster="vault-integrated-storage"}', values: '_x20 2 2 _x30' }
      # vault-2: one failure long ago, none since: the counter stays at 3 and must not alert.
      - { series: 'vault_audit_log_request_failure{job="ryft/vault",pod="vault-2",vault_cluster="vault-integrated-storage"}', values: '3x50' }
      - { series: 'vault_audit_log_request_count{job="ryft/vault",pod="vault-2",vault_cluster="vault-integrated-storage"}', values: '1+1x50' }
    alert_rule_test:
      - { eval_time: 15m, alertname: VaultAuditFailing, exp_alerts: [] }
      - eval_time: 25m
        alertname: VaultAuditFailing
        exp_alerts:
          - exp_labels: { severity: critical, pod: vault-0 }
            exp_annotations:
              summary: "vault-0 failed to write audit entries in the last 10 minutes"
              runbook: "docs/OPERATIONS.md → Vault alerts (VaultAuditFailing)"
          - exp_labels: { severity: critical, pod: vault-1 }
            exp_annotations:
              summary: "vault-1 failed to write audit entries in the last 10 minutes"
              runbook: "docs/OPERATIONS.md → Vault alerts (VaultAuditFailing)"
      - { eval_time: 45m, alertname: VaultAuditFailing, exp_alerts: [] }
  - name: a vault response audit write fails on a live counter
    interval: 1m
    input_series:
      - { series: 'vault_audit_log_response_failure{job="ryft/vault",pod="vault-2",vault_cluster="vault-integrated-storage"}', values: '0x20 1x30' }
    alert_rule_test:
      - eval_time: 25m
        alertname: VaultAuditFailing
        exp_alerts:
          - exp_labels: { severity: critical, pod: vault-2 }
            exp_annotations:
              summary: "vault-2 failed to write audit entries in the last 10 minutes"
              runbook: "docs/OPERATIONS.md → Vault alerts (VaultAuditFailing)"
      - { eval_time: 45m, alertname: VaultAuditFailing, exp_alerts: [] }
  - name: a vault volume over 80 %
    interval: 1m
    input_series:
      - { series: 'kubelet_volume_stats_used_bytes{namespace="vault",persistentvolumeclaim="data-vault-0"}', values: '9663676416x40' }
      - { series: 'kubelet_volume_stats_capacity_bytes{namespace="vault",persistentvolumeclaim="data-vault-0"}', values: '10737418240x40' }
      - { series: 'kubelet_volume_stats_used_bytes{namespace="vault",persistentvolumeclaim="audit-vault-0"}', values: '1073741824x40' }
      - { series: 'kubelet_volume_stats_capacity_bytes{namespace="vault",persistentvolumeclaim="audit-vault-0"}', values: '5368709120x40' }
    alert_rule_test:
      - { eval_time: 10m, alertname: VaultVolumeFilling, exp_alerts: [] }
      - eval_time: 20m
        alertname: VaultVolumeFilling
        exp_alerts:
          - exp_labels: { severity: warning, namespace: vault, persistentvolumeclaim: data-vault-0 }
            exp_annotations:
              summary: "data-vault-0 is 90% full"
              runbook: "docs/OPERATIONS.md → Vault alerts (VaultVolumeFilling)"
  - name: a vault template change waits for the pod-by-pod restart
    interval: 4m
    input_series:
      # The change is applied at 1 h; only one pod is restarted.
      - { series: 'kube_statefulset_status_replicas{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '3x420' }
      - { series: 'kube_statefulset_status_replicas_updated{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '3x14 1x405' }
    alert_rule_test:
      - { eval_time: 20h, alertname: VaultUpdatePending, exp_alerts: [] }
      - eval_time: 26h
        alertname: VaultUpdatePending
        exp_alerts:
          - exp_labels: { severity: info }
            exp_annotations:
              summary: "2 Vault pod(s) still run the previous template: restart them one by one"
              runbook: "docs/OPERATIONS.md → Vault alerts (VaultUpdatePending)"
