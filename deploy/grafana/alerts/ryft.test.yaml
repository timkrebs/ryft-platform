      - { series: 'kube_statefulset_status_replicas_ready{job="ryft/vault-state",namespace="vault",statefulset="vault"}', values: '3x40' }
      - { series: 'kubelet_volume_stats_capacity_bytes{namespace="vault",persistentvolumeclaim="data-vault-0"}', values: '10737418240x40' }
