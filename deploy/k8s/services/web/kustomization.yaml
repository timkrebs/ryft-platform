apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The apex site in its own namespace, with the default-deny policies. It holds no
# secrets, so its namespace is not one of infra/vault's: kustomize creates it.
namespace: ryft-web
resources:
  - namespace.yaml
  - ../../base/common
  - ../../base/web
