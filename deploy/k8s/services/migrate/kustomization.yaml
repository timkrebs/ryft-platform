apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# migrate in its own namespace, with the default-deny policies.
namespace: ryft-migrate
resources:
  - ../../base/common
  - ../../base/migrate
# Applied and awaited before the services (make k8s-apply-eks): they must not try
# their database roles before migrate has set the passwords, because the Supabase
# pooler blocks a user for a while after repeated failed logins.
labels:
  - pairs: { ryft.dev/stage: first }
    includeSelectors: false
