# Copy to secrets.yaml (git-ignored), fill in values, then `kubectl apply -k .`
# Next step for your cluster: replace this with a VaultStaticSecret (Vault Secrets
# Operator) or ExternalSecret so nothing sensitive lives in the repo.
apiVersion: v1
kind: Secret
metadata:
  name: ryft-secrets
  namespace: ryft
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgres://ryft:change-me@postgres.ryft.svc.cluster.local:5432/ryft?sslmode=disable
  # Generate with: openssl rand -hex 32   — the same value goes into the iOS app's Settings screen.
  API_KEY: change-me-openssl-rand-hex-32
