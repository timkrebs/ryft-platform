# Copy to secrets.yaml next to the overlay you apply (git-ignored), fill in, then
# `kubectl apply -k <overlay>`. With Vault use deploy/k8s/vault instead.
apiVersion: v1
kind: Secret
metadata:
  name: ryft-secrets
  namespace: ryft
type: Opaque
stringData:
  # Supabase → Connect → Session pooler (port 5432; session mode keeps prepared
  # statements and advisory locks working). Copy the host from the dashboard.
  # sslmode=verify-full with Supabase's CA (sslrootcert=…) is stricter; see docs/SUPABASE.md.
  DATABASE_URL: postgresql://postgres.YOUR-PROJECT-REF:YOUR-DB-PASSWORD@aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require
  # overlays/local-postgres only (in-cluster Postgres, AUTH_MODE=apikey):
  # POSTGRES_PASSWORD: change-me
  # DATABASE_URL: postgres://ryft:change-me@postgres.ryft.svc.cluster.local:5432/ryft?sslmode=disable
  # API_KEY: change-me-openssl-rand-hex-32
---
# Only the api Deployment reads this (account deletion through the Supabase Auth
# admin API). Supabase → Project Settings → API Keys: a secret key (sb_secret_…)
# or the legacy service_role key. Leave it out and DELETE /v1/me still erases the
# platform data but cannot delete the Supabase login.
apiVersion: v1
kind: Secret
metadata:
  name: ryft-supabase-admin
  namespace: ryft
type: Opaque
stringData:
  SUPABASE_SERVICE_ROLE_KEY: sb_secret_change-me
