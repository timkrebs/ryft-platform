# Secret ryft-secrets ← Vault KV v2 secret/ryft (key DATABASE_URL, the Supabase
# session pooler string; the same keys as secrets.example.yaml). Checked every
# hour; on a change the three services are restarted to pick up the new env.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryft-secrets
  namespace: ryft
spec:
  vaultAuthRef: ryft
  type: kv-v2
  mount: secret
  path: ryft
  refreshAfter: 1h
  destination:
    name: ryft-secrets
    create: true
  rolloutRestartTargets:
    - { kind: Deployment, name: api }
    - { kind: Deployment, name: ingest }
    - { kind: Deployment, name: scoring }
---
# Secret ryft-supabase-admin ← secret/ryft-admin (key SUPABASE_SERVICE_ROLE_KEY).
# Separate path and Secret so only the api pods, which delete accounts, get it.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryft-supabase-admin
  namespace: ryft
spec:
  vaultAuthRef: ryft
  type: kv-v2
  mount: secret
  path: ryft-admin
  refreshAfter: 1h
  destination:
    name: ryft-supabase-admin
    create: true
  rolloutRestartTargets:
    - { kind: Deployment, name: api }
