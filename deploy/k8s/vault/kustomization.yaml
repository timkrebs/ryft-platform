# Alternative to deploy/k8s: the base plus a VaultStaticSecret that materialises
# Secret ryft-secrets from Vault KV v2 secret/ryft via the Vault Secrets Operator.
#   kubectl apply -k deploy/k8s/vault
# Vault-side setup (KV data, policy, kubernetes auth role): docs/OPERATIONS.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ryft
resources:
  - ../base
  - vault-auth.yaml
  - vault-static-secret.yaml
