apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ryft
  labels: { app: api, part-of: ryft }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, part-of: ryft }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/timkrebs/ryft/api:latest
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: ryft-config }
            - secretRef: { name: ryft-secrets }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ryft
spec:
  selector: { app: api }
  ports: [{ name: http, port: 80, targetPort: http }]
