# RYFT on the EKS cluster from infra/aws (ryft-prod-euc1), served at
# https://api.ryftapp.de and https://ryftapp.de. One namespace per workload:
# ryft-ingest, ryft-scoring, ryft-api, ryft-notify, ryft-rabbitmq, ryft-migrate and
# ryft-smoke come with their service accounts and Pod Security "restricted" from
# infra/vault, so this overlay
# creates no Namespace objects for them; only ryft-web (the apex site, web/), which holds
# no secrets. Each namespace's Secret ryft-secrets is synced by the Vault Secrets
# Operator from that service's own Vault namespace
# (deploy/k8s/overlays/vault-namespaces/<service>, generated by infra/vault).
# Nothing secret is in this directory.
#
# Needs the add-ons from infra/aws/kubernetes (Traefik with client IPs preserved,
# cert-manager with the letsencrypt-prod ClusterIssuer, ExternalDNS, gp3-encrypted,
# the Vault Secrets Operator). Argo CD applies it (ryft-platform); `make k8s-apply-eks`
# is break-glass (docs/OPERATIONS.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # RabbitMQ is deploy/rabbitmq and its operators, their own Argo CD applications
  # (waves 1 and 2), synced before this one (wave 3).
  - ../../services/migrate
  - ../../services/ingest
  - ../../services/scoring
  - ../../services/api
  - ../../services/notify
  - ../../services/web
  - ../../services/smoke
  - ratelimit.yaml
  - metrics-from-nodes.yaml
  - web.yaml

patches:
  # Traefik + Let's Encrypt for the public host, one Ingress per namespace.
  - path: ingress-api.yaml
  - path: ingress-ingest.yaml
  # The broker settings the RabbitMQ cutover left (D102), in each Deployment's env (it
  # overrides ryft-config, and a change rolls the pods): RabbitMQ only.
  - path: events.yaml

# Pin to the commit CI built (ghcr.io/timkrebs/ryft/<image>:<short-sha>): the short SHA
# of a green run on main, e.g. `gh run list --workflow ci --branch main --status success
# --limit 1 --json headSha --jq ".[0].headSha[:7]"`. The packages are public. Always quote
# the tag: a short SHA like 155e166 or 1234567 is a number to YAML.
#
# Two image groups move independently, each against its own running pin: services (the
# five backend images, from backend/) and web (from web/). To roll a group back, set its
# newTag(s) to the previous value AND hold it in the same commit: one comment line right
# above the group's first image (above ingest for the services, above web for the site),
# standing alone on its line, made of: a hash sign, a space, the word hold with a colon,
# the group (services or web), an ISO date, and a reason. Without the hold the next push
# to main builds the rolled-back code again and pins it (the pin differs from the tree).
# Argo CD and kustomize ignore the line; promote skips a held group and warns on every run;
# CI fails a deploy PR that moves the pin of a group held on main, and any comment that has
# a hash sign followed by "hold" but does not parse stops the promote. Delete the line in a
# PR to release it: that merge deploys main's head for the group (docs/OPERATIONS.md).
images:
  - name: ghcr.io/timkrebs/ryft/ingest
    newTag: "a9685b5"
  - name: ghcr.io/timkrebs/ryft/scoring
    newTag: "a9685b5"
  - name: ghcr.io/timkrebs/ryft/api
    newTag: "a9685b5"
  - name: ghcr.io/timkrebs/ryft/migrate
    newTag: "a9685b5"
  - name: ghcr.io/timkrebs/ryft/notify
    newTag: "a9685b5"
  # web: this repository's SHA, like the others (D107): the site is built from web/ by the
  # same CI and promoted in the same "deploy: images" PR, but only when web/ differs from
  # this pin (scripts/deploy_targets.sh). A rollback may pin an older ryft-web SHA such as
  # f437747 (the last image built in the archived ryft-web repository); it is not a commit here.
  - name: ghcr.io/timkrebs/ryft/web
    newTag: "332c252"
