# RYFT on the EKS cluster from infra/aws (ryft-prod-euc1), served at
# https://api.ryftapp.de and https://ryftapp.de. One namespace per workload:
# ryft-ingest, ryft-scoring, ryft-api, ryft-nats and ryft-migrate come with their
# service accounts and Pod Security "restricted" from infra/vault, so this overlay
# creates no Namespace objects for them; only ryft-web (the apex site), which holds
# no secrets. Each namespace's Secret ryft-secrets is synced by the Vault Secrets
# Operator from that service's own Vault namespace
# (deploy/k8s/overlays/vault-namespaces/<service>, generated by infra/vault).
# Nothing secret is in this directory.
#
# Needs the add-ons from infra/aws/kubernetes (Traefik with client IPs preserved,
# cert-manager with the letsencrypt-prod ClusterIssuer, ExternalDNS, gp3-encrypted,
# the Vault Secrets Operator). Apply with `make k8s-apply-eks` (order and waits in
# docs/OPERATIONS.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../services/nats
  - ../../services/migrate
  - ../../services/ingest
  - ../../services/scoring
  - ../../services/api
  - ../../services/web
  - ratelimit.yaml
  - metrics-from-nodes.yaml
  - web.yaml

patches:
  # Traefik + Let's Encrypt for the public host, one Ingress per namespace.
  - path: ingress-api.yaml
  - path: ingress-ingest.yaml
  # volumeClaimTemplates are immutable, so this must be right before the first apply.
  - target: { kind: StatefulSet, name: nats }
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3-encrypted

# Pin to the commit CI built (ghcr.io/timkrebs/ryft/<image>:<short-sha>): the short SHA
# of a green run on main, e.g. `gh run list --workflow ci --branch main --status success
# --limit 1 --json headSha --jq ".[0].headSha[:7]"`. The packages are public. Always quote
# the tag: a short SHA like 155e166 or 1234567 is a number to YAML.
images:
  - name: ghcr.io/timkrebs/ryft/ingest
    newTag: "42a0d71"
  - name: ghcr.io/timkrebs/ryft/scoring
    newTag: "42a0d71"
  - name: ghcr.io/timkrebs/ryft/api
    newTag: "42a0d71"
  - name: ghcr.io/timkrebs/ryft/migrate
    newTag: "42a0d71"
