# RYFT on the EKS cluster from infra/aws (ryft-prod-euc1), served at
# https://api.ryftapp.de. One namespace per service: ryft-ingest, ryft-scoring,
# ryft-api, ryft-nats and ryft-migrate. infra/vault creates them, with their
# service accounts and Pod Security "restricted", so this overlay creates no
# Namespace objects. Each namespace's Secret ryft-secrets is synced by the Vault
# Secrets Operator from that service's own Vault namespace
# (deploy/k8s/overlays/vault-namespaces/<service>, generated by infra/vault).
# Nothing secret is in this directory.
#
# Needs the add-ons from infra/aws/kubernetes (Traefik, cert-manager with the
# letsencrypt-prod ClusterIssuer, ExternalDNS, gp3-encrypted, the Vault Secrets
# Operator). Apply with `make k8s-apply-eks` (order and waits in docs/OPERATIONS.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../services/nats
  - ../../services/migrate
  - ../../services/ingest
  - ../../services/scoring
  - ../../services/api

patches:
  # Traefik + Let's Encrypt for the public host, one Ingress per namespace.
  - path: ingress-api.yaml
  - path: ingress-ingest.yaml
  # volumeClaimTemplates are immutable, so this must be right before the first apply.
  - target: { kind: StatefulSet, name: nats }
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3-encrypted

# Pin to the commit CI built (ghcr.io/timkrebs/ryft/<image>:<short-sha>).
# The placeholder fails on purpose until the first CI run has pushed images.
images:
  - name: ghcr.io/timkrebs/ryft/ingest
    newTag: replace-with-ci-sha
  - name: ghcr.io/timkrebs/ryft/scoring
    newTag: replace-with-ci-sha
  - name: ghcr.io/timkrebs/ryft/api
    newTag: replace-with-ci-sha
  - name: ghcr.io/timkrebs/ryft/migrate
    newTag: replace-with-ci-sha
