# ryftlab.de and www.ryftlab.de → the apex site in ryft-web (D55). www redirects to the
# apex (Apple's apple-app-site-association lookup does not follow redirects, so the
# app's associated domains name ryftlab.de itself). One certificate for both names
# (DNS-01), DNS by ExternalDNS (an alias A record at the apex).
# Not listed in kustomization.yaml since D215: kept so that deploying the site again is two
# resource lines (docs/REBUILD.md, "Optional: the web pod for the legal pages").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ryft-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: ryft-web-ratelimit@kubernetescrd,ryft-web-www-to-apex@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ryftlab.de, www.ryftlab.de]
      secretName: ryftlab-de-tls
  rules:
    - host: ryftlab.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { name: http } } }
    - host: www.ryftlab.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { name: http } } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
  namespace: ryft-web
spec:
  redirectRegex:
    regex: ^https://www\.ryftlab\.de/(.*)
    replacement: https://ryftlab.de/${1}
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
  namespace: ryft-web
spec:
  rateLimit:
    average: 20
    period: 1s
    burst: 50
    sourceCriterion:
      ipStrategy:
        depth: 0
