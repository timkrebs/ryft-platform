# The broker each service publishes to and consumes from, as the RabbitMQ cutover
# left it (D102): RabbitMQ only. Images from before R4 read these (unset was nats);
# the R4 images have no NATS and refuse anything but amqp here. The file can go
# once no image from before R4 can be deployed (a revert of the R4 pin).
apiVersion: apps/v1
kind: Deployment
metadata: { name: ingest, namespace: ryft-ingest }
spec:
  template:
    spec:
      containers:
        - name: ingest
          env:
            - { name: EVENTS_BACKEND, value: amqp }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: ryft-api }
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - { name: EVENTS_BACKEND, value: amqp }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: scoring, namespace: ryft-scoring }
spec:
  template:
    spec:
      containers:
        - name: scoring
          env:
            - { name: EVENTS_BACKEND, value: amqp }
            - { name: EVENTS_CONSUME, value: amqp }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notify, namespace: ryft-notify }
spec:
  template:
    spec:
      containers:
        - name: notify
          env:
            - { name: EVENTS_BACKEND, value: amqp }
            - { name: EVENTS_CONSUME, value: amqp }
