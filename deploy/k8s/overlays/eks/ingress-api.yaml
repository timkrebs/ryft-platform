# Traefik (infra/aws/kubernetes) terminates TLS on its websecure entrypoint, the only
# one exposed, with a certificate cert-manager obtains via DNS-01. ExternalDNS points
# api.ryftapp.de at the NLB from this Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: ryft-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api.ryftapp.de]
      secretName: api-ryftapp-de-tls
  rules:
    - host: api.ryftapp.de
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
