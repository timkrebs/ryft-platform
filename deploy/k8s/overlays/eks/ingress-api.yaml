# Traefik (infra/aws/kubernetes) terminates TLS on its websecure entrypoint, the only
# one exposed (D24: no port 80), with a certificate cert-manager obtains via DNS-01. ExternalDNS points
# api.ryftlab.de at the NLB from this Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: ryft-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: ryft-api-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api.ryftlab.de]
      secretName: api-ryftlab-de-tls
  rules:
    - host: api.ryftlab.de
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
