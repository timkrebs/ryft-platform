# Generated by infra/vault — do not edit by hand (terraform apply rewrites it).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: ryft-whoop-import
spec:
  address: https://ryft-prod-euc1-vault-public-vault-d9cda245.5ea5b8ce.z1.hashicorp.cloud:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: whoop-import
  namespace: ryft-whoop-import
spec:
  vaultConnectionRef: vault
  # From the root namespace: on HCP Vault Dedicated this starts with admin/.
  namespace: admin/ryft/whoop-import
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: whoop-import
    serviceAccount: whoop-import
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryft-secrets
  namespace: ryft-whoop-import
spec:
  vaultAuthRef: whoop-import
  mount: kv
  type: kv-v2
  path: config
  refreshAfter: 1h
  destination:
    name: ryft-secrets
    create: true
    overwrite: true
    # Only the keys themselves: no `_raw` copy of the whole secret, which envFrom
    # would turn into one more variable holding every credential.
    transformation:
      excludeRaw: true
