apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ryft
  labels: { app: api, part-of: ryft }
spec:
  # replicas: owned by the HorizontalPodAutoscaler (hpa.yaml)
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, part-of: ryft }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: api } }
      containers:
        - name: api
          image: ghcr.io/timkrebs/ryft/api:latest
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: ryft-config }
            - secretRef: { name: ryft-secrets }
          env:
            # Account deletion (DELETE /v1/me) only; ingest and scoring never
            # hold this key. Optional: without it the Supabase auth user stays.
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef: { name: ryft-supabase-admin, key: SUPABASE_SERVICE_ROLE_KEY, optional: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ryft
spec:
  selector: { app: api }
  ports: [{ name: http, port: 80, targetPort: http }]
