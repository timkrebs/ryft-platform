# scoring: ingested → daily scores (role ryft_scoring).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring
  labels: { app: scoring, part-of: ryft }
spec:
  replicas: 1   # runs the 15-minute timer and orders recomputes; never scale
  selector:
    matchLabels: { app: scoring }
  template:
    metadata:
      labels: { app: scoring, part-of: ryft }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # Created by infra/vault on EKS (the identity Vault's Kubernetes auth trusts)
      # and by overlays/local-postgres elsewhere. The service never calls the
      # Kubernetes API, so the pod gets no token.
      serviceAccountName: scoring
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: scoring
          image: ghcr.io/timkrebs/ryft/scoring:latest
          ports:
            - { containerPort: 8080, name: http }      # API and probes
            - { containerPort: 9090, name: metrics }   # /metrics only
          envFrom:
            - configMapRef: { name: ryft-config }
            # Only this service's credentials: on EKS synced by the Vault Secrets
            # Operator from Vault namespace ryft/scoring (infra/vault).
            - secretRef: { name: ryft-secrets }
          volumeMounts:
            - { name: amqp-client, mountPath: /etc/ryft/amqp, readOnly: true }
          # The service waits up to 10 minutes for the migrate job before it listens.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 126
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        # The service's TLS identity towards RabbitMQ (deploy/rabbitmq/clients): its
        # client certificate and the internal CA. The pod waits for it.
        - name: amqp-client
          secret: { secretName: amqp-client }
