apiVersion: v1
kind: ConfigMap
metadata:
  name: ryft-config
  namespace: ryft
data:
  NATS_URL: nats://nats.ryft.svc.cluster.local:4222
  PORT: "8080"
  # Supabase Auth: tokens are verified against
  # https://<SUPABASE_PROJECT_REF>.supabase.co/auth/v1/.well-known/jwks.json.
  # Set the project ref once here (Supabase → Project Settings → General); the
  # services refuse to start while it is the placeholder.
  AUTH_MODE: supabase
  SUPABASE_PROJECT_REF: replace-with-project-ref
  LOG_LEVEL: info
