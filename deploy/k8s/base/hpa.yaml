# CPU-based autoscaling for the stateless HTTP services (needs metrics-server;
# k3s ships it). The Deployments set no replicas field so applying them never
# fights the HPA. scoring stays at one replica: it runs a timer and processes
# recompute ranges in order.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: ryft
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingest
  namespace: ryft
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ingest }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
