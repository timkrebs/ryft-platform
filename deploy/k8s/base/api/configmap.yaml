# Non-secret settings. SUPABASE_PROJECT_REF, DATABASE_URL, the NATS credentials and
# SUPABASE_SERVICE_ROLE_KEY (account deletion) come from Secret ryft-secrets (Vault).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ryft-config
data:
  NATS_URL: nats://nats.ryft-nats.svc.cluster.local:4222
  PORT: "8080"
  AUTH_MODE: supabase
  LOG_LEVEL: info
