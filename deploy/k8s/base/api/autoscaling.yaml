# CPU autoscaling (metrics-server); the Deployment sets no replicas, so applying
# it never fights the HPA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
# One pod stays through node drains and upgrades (docs/OPERATIONS.md). Pods that are
# not ready protect nothing and may always be evicted: otherwise an outage (no pod
# ready, 0 disruptions allowed) blocks every node drain, e.g. a node group update.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: { app: api }
