# NATS for RYFT: one JetStream stream (RYFT, created by scoring; subjects ryft.>) and one user
# per service with only the subjects that service uses. RYFT is a work queue: each
# subject has one consumer (scoring: ryft.ingested, ryft.session.completed; notify:
# ryft.scored, ryft.session.scored). Shared by compose and
# Kubernetes. Passwords come from the environment: bcrypt hashes on Kubernetes
# (VSO → Secret ryft-secrets in ryft-nats, generated by infra/vault), dev
# passwords in compose. Each service's own password lives only in its namespace.
#
# Replies go to a per-service inbox (_INBOX_<service>, events.Connect), so no
# service can read another's publish acks or API answers.

port: 4222
http_port: 8222          # /healthz for the probes; not exposed beyond the pod
max_payload: 1MB

jetstream {
  store_dir: "/data"
  max_file_store: 1G
}

authorization {
  users: [
    # POST /v1/sync → ryft.ingested
    {
      user: ingest
      password: $NATS_PASSWORD_INGEST
      permissions: {
        publish: { allow: ["ryft.ingested"] }
        subscribe: { allow: ["_INBOX_ingest.>"] }
      }
    }
    # POST /v1/recompute, session edits → ryft.ingested; POST /v1/sessions/{id}/complete → ryft.session.completed
    {
      user: api
      password: $NATS_PASSWORD_API
      permissions: {
        publish: { allow: ["ryft.ingested", "ryft.session.completed"] }
        subscribe: { allow: ["_INBOX_api.>"] }
      }
    }
    # Owns the stream and its durable pull consumer; acks what it consumed;
    # announces scored mornings and sessions to notify.
    {
      user: scoring
      password: $NATS_PASSWORD_SCORING
      permissions: {
        publish: {
          allow: [
            "ryft.scored", "ryft.session.scored",
            "$JS.API.INFO",
            "$JS.API.STREAM.CREATE.RYFT", "$JS.API.STREAM.UPDATE.RYFT", "$JS.API.STREAM.INFO.RYFT",
            "$JS.API.CONSUMER.CREATE.RYFT.scoring", "$JS.API.CONSUMER.CREATE.RYFT.scoring.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.RYFT.scoring", "$JS.API.CONSUMER.INFO.RYFT.scoring",
            "$JS.API.CONSUMER.MSG.NEXT.RYFT.scoring",
            "$JS.ACK.RYFT.scoring.>"
          ]
        }
        subscribe: { allow: ["_INBOX_scoring.>"] }
      }
    }
    # Its own durable consumer on scoring's stream (no stream rights); acks what it consumed.
    {
      user: notify
      password: $NATS_PASSWORD_NOTIFY
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO", "$JS.API.STREAM.INFO.RYFT",
            "$JS.API.CONSUMER.CREATE.RYFT.notify", "$JS.API.CONSUMER.CREATE.RYFT.notify.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.RYFT.notify", "$JS.API.CONSUMER.INFO.RYFT.notify",
            "$JS.API.CONSUMER.MSG.NEXT.RYFT.notify",
            "$JS.ACK.RYFT.notify.>"
          ]
        }
        subscribe: { allow: ["_INBOX_notify.>"] }
      }
    }
  ]
}
