apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# POST /v1/sync. Namespace-neutral; services/ingest puts it into ryft-ingest.
resources:
  - deployment.yaml
  - service.yaml
  - autoscaling.yaml
  - ingress.yaml
  - networkpolicy.yaml

# ryft-config-<hash> from config.env: any edit, in this file or in an overlay, renames the
# ConfigMap, so the Deployment's envFrom changes and the pods roll (a plain ConfigMap would
# change no pod; D78, F1). config.env holds bare KEY=value lines and full-line comments:
# kustomize keeps quotes, spaces and inline comments as part of the value.
configMapGenerator:
  - name: ryft-config
    envs: [config.env]
