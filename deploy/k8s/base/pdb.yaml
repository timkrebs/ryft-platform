# Keep one api and one ingest pod through voluntary disruptions (node drains,
# upgrades). With the HPAs' two replicas spread over two or more nodes a drain
# always proceeds. On a single-node cluster the second pod cannot be evicted
# while the first has nowhere to go: drain with --disable-eviction, or delete
# these PDBs for the maintenance window (docs/OPERATIONS.md).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: ryft
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingest
  namespace: ryft
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ingest }
