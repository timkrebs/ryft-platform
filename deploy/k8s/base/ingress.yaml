# K3s ships Traefik; this plain Ingress works with it and with ingress-nginx.
# Longest prefix wins: /v1/sync → ingest, everything else under /v1 → api.
# For your Cloudflare-tunnel setup you can instead point the tunnel at
# http://api.ryft.svc.cluster.local and http://ingest.ryft.svc.cluster.local.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ryft
  namespace: ryft
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt   # uncomment if you run cert-manager
spec:
  rules:
    - host: ryft.example.com
      http:
        paths:
          - path: /v1/sync
            pathType: Prefix
            backend: { service: { name: ingest, port: { name: http } } }
          - path: /v1
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
  # tls:
  #   - hosts: [ryft.example.com]
  #     secretName: ryft-tls
