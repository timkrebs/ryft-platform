# Non-secret settings. DATABASE_URL, the RabbitMQ credentials and the APNs key
# (APNS_KEY_ID, APNS_TEAM_ID, APNS_KEY_P8) come from Secret ryft-secrets (Vault);
# without the key notify runs and sends nothing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ryft-config
data:
  # RabbitMQ (D97): mutual TLS on 5671, the service's certificate and the internal CA
  # from Secret amqp-client; AMQP_USER and AMQP_PASSWORD come from Vault.
  AMQP_URL: amqps://rabbitmq.ryft-rabbitmq.svc.cluster.local:5671/ryft
  AMQP_CA_FILE: /etc/ryft/amqp/ca.crt
  AMQP_CERT_FILE: /etc/ryft/amqp/tls.crt
  AMQP_KEY_FILE: /etc/ryft/amqp/tls.key
  PORT: "8080"
  LOG_LEVEL: info
  APNS_TOPIC: dev.timkrebs.ryft   # the app's bundle id
