# Nightly logical backup of the app schema (public): pg_dump (custom format) of
# DATABASE_URL to the pg-backups PVC, keeping 14 days. Works against Supabase and
# the local-postgres overlay; pg_dump's major version must be >= the server's.
# Deleted accounts stay in these dumps until they age out (14 days).
# Restore and off-cluster copies: docs/OPERATIONS.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backups
  namespace: ryft
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
  # storageClassName: local-path   # K3s default; prefer a class on different disks than Postgres
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: ryft
spec:
  schedule: "30 3 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: { app: pg-backup }
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70        # postgres user in the alpine image
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              env:
                # Supabase pooler or the local-postgres overlay's database.
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: ryft-secrets, key: DATABASE_URL } }
                - { name: KEEP_DAYS, value: "14" }
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  f="/backups/ryft-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump --format=custom --no-owner --schema=public --file="$f.partial" "$DATABASE_URL"
                  mv "$f.partial" "$f"
                  find /backups -name 'ryft-*.dump' -mtime +"$KEEP_DAYS" -delete
                  find /backups -name '*.partial' -mmin +120 -delete
                  ls -lh /backups
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: backups, mountPath: /backups }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: pg-backups }
