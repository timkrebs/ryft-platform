apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The apex site ryftapp.de: one image built from web/ in this repository (the static pages, the legal
# texts, nginx's config and /.well-known/apple-app-site-association). Namespace-neutral;
# services/web puts it into ryft-web.
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
