<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RYFT</title>
  <meta name="description" content="RYFT — your whole health.">
  <style>
    :root { color-scheme: light dark; --fg: #111; --bg: #fafafa; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f2f2f2; --bg: #0b0b0c; --muted: #9a9a9a; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 0 16px; }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 3rem; letter-spacing: 0.2em; margin: 0 0 0.25rem; }
    p { margin: 0.5rem 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>RYFT</h1>
    <p>Your whole health.</p>
    <p>Coming to iPhone.</p>
  </main>
</body>
</html>
