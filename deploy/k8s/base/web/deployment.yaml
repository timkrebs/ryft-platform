apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web, part-of: ryft }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, part-of: ryft }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101           # nginx in the web image
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: web } }
      containers:
        - name: nginx
          # The whole site (pages, nginx config, AASA) is one image, built from web/ and pushed
          # by this repository's CI (ghcr.io/timkrebs/ryft/web:<short sha>). The tag is pinned in overlays/eks.
          image: ghcr.io/timkrebs/ryft/web
          ports: [{ containerPort: 8080, name: http }]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
