# ryftapp.de: a static page, the legal pages (DRAFT until the operator publishes them;
# English at /privacy, German at /de/privacy, …), an "Open in RYFT" page for the app's
# universal-link paths, and the apple-app-site-association file. Apple fetches that
# file without following redirects and expects application/json.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ~ ^/(privacy|terms|support|impressum)/?$ {
        try_files /pages/$1.en.html =404;
    }
    location ~ ^/de/(privacy|terms|support|impressum)/?$ {
        try_files /pages/$1.de.html =404;
    }
    # The app's links (AASA applinks) on a phone without the app.
    location ~ ^/(day|sleep|insights|train|auth)(/|$) {
        try_files /pages/open.html =404;
    }
    location / {
        try_files $uri $uri/index.html =404;
    }
}
