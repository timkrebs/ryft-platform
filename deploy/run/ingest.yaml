# ingest on Cloud Run (D223): POST /v1/sync on its own host, ingest.ryftlab.de (design §1: a domain
# mapping cannot route by path). A template for scripts/cloudrun_render.py; see api.yaml for how it is
# rendered, deployed and checked. Concurrency 4 and 1 GiB: four 32 MiB bodies, decoded (design §3).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ingest
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: ryft-ingest@ryftlab-prod.iam.gserviceaccount.com
      containerConcurrency: 4
      timeoutSeconds: 120
      containers:
        - name: ingest
          image: "${IMAGE}"
          ports:
            - { name: h2c, containerPort: 8080 }
          resources:
            limits: { cpu: "1", memory: 1Gi }
          # Started means listening, with a short budget (api.yaml says why).
          startupProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - { name: DATABASE_URL, value: "${DATABASE_URL}" }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: db-password-ingest, key: "1" } } }
            - { name: AUTH_MODE, value: supabase }
            - { name: SUPABASE_PROJECT_REF, value: "${SUPABASE_PROJECT_REF}" }
            - { name: PRIVACY_POLICY_VERSION, value: "${PRIVACY_POLICY_VERSION}" }
            - { name: PRIVACY_POLICY_URL, value: "https://ryftlab.de/privacy" }
            - { name: GCP_PROJECT, value: ryftlab-prod }
            - { name: PUBSUB_ENDPOINT, value: "https://europe-west1-pubsub.googleapis.com" }
            - { name: PUSH_AUDIENCE, value: "${PUSH_AUDIENCE}" }
            - { name: PUSH_SA_EMAIL, value: ryft-push@ryftlab-prod.iam.gserviceaccount.com }
            - { name: PUSH_SA_ID, value: "${PUSH_SA_ID}" }
            - { name: OTLP_ENDPOINT, value: "${OTLP_ENDPOINT}" }
            - { name: OTLP_USER, value: "${OTLP_USER}" }
            - { name: OTLP_TOKEN, valueFrom: { secretKeyRef: { name: otlp-token, key: "1" } } }
            - { name: LOG_LEVEL, value: "${LOG_LEVEL}" }
  traffic:
    - { percent: 100, latestRevision: true }
