# ingest on Cloud Run (D223): POST /v1/sync on its own host, ingest.ryftlab.de (design §1: a domain
# mapping cannot route by path). A template for scripts/cloudrun_render.py; see api.yaml for how it is
# rendered, deployed and checked. Concurrency 4 and 1 GiB: four 32 MiB bodies, decoded (design §3).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ingest
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: ryft-ingest@ryftlab-prod.iam.gserviceaccount.com
      containerConcurrency: 4
      timeoutSeconds: 120
      containers:
        - name: ingest
          image: "${IMAGE}"
          ports:
            - { name: h2c, containerPort: 8080 }
          resources:
            limits: { cpu: "1", memory: 1Gi }
          # Started means listening, with a short budget (api.yaml says why).
          startupProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - { name: DATABASE_URL, value: "${DATABASE_URL}" }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: db-password-ingest, key: "1" } } }
            - { name: AUTH_MODE, value: supabase }
            - { name: SUPABASE_PROJECT_REF, value: "${SUPABASE_PROJECT_REF}" }
            - { name: PRIVACY_POLICY_VERSION, value: "${PRIVACY_POLICY_VERSION}" }
            - { name: PRIVACY_POLICY_URL, value: "https://ryftlab.de/privacy" }
            - { name: BETA_GATE, value: "${BETA_GATE}" }
            - { name: XFF_TRUSTED_HOPS, value: "${XFF_TRUSTED_HOPS}" }
            # App Attest (D245, D247): as in api.yaml; ingest only verifies tokens. The ring's row comes with the
            # warn flip (api.yaml shows it), here and in api.yaml at the same version.
            - { name: APP_ATTEST, value: "${APP_ATTEST}" }
            - { name: APP_ATTEST_EXEMPT_USERS, value: "${APP_ATTEST_EXEMPT_USERS}" }
            # Direct connections (D257, design §9): the providers whose pushes the hook takes, the same line of
            # config.env as api's (check_cloudrun.py refuses a difference). A push secret comes in phase 2 only
            # if the programme's verification needs one; the fake (CONNECT_FAKE*) is compose only.
            - { name: CONNECT_PROVIDERS, value: "${CONNECT_PROVIDERS}" }
            # The consent cutoff (D259), ingest only: empty means the policy in force; a date not after
            # PRIVACY_POLICY_VERSION keeps older health-processing consents' pushes (config.env says when to move it).
            - { name: CONNECT_MIN_POLICY_VERSION, value: "${CONNECT_MIN_POLICY_VERSION}" }
            - { name: GCP_PROJECT, value: ryftlab-prod }
            - { name: PUBSUB_ENDPOINT, value: "https://europe-west1-pubsub.googleapis.com" }
            - { name: PUSH_AUDIENCE, value: "${PUSH_AUDIENCE}" }
            - { name: PUSH_SA_EMAIL, value: ryft-push@ryftlab-prod.iam.gserviceaccount.com }
            - { name: PUSH_SA_ID, value: "${PUSH_SA_ID}" }
            - { name: LOG_LEVEL, value: "${LOG_LEVEL}" }
  traffic:
    - { percent: 100, latestRevision: true }
