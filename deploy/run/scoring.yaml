# scoring on Cloud Run (D223): Pub/Sub push (/push/ingested, /push/session.completed) and the tick, no
# user HTTP (D17). Ingress internal: only Pub/Sub and Scheduler of this project reach it, on its run.app
# URL, and IAM admits only ryft-push. One instance, four requests (D17 as amended, design §2.2): one
# message in flight per user through the ordering key. A template for scripts/cloudrun_render.py; see
# api.yaml for how it is rendered, deployed and checked.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: scoring
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: ryft-scoring@ryftlab-prod.iam.gserviceaccount.com
      containerConcurrency: 4
      # = the ack deadline of its subscriptions; the tick's budget is 240 s.
      timeoutSeconds: 300
      containers:
        - name: scoring
          image: "${IMAGE}"
          ports:
            - { name: h2c, containerPort: 8080 }
          resources:
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 120
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - { name: DATABASE_URL, value: "${DATABASE_URL}" }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: db-password-scoring, key: "1" } } }
            - { name: GCP_PROJECT, value: ryftlab-prod }
            - { name: PUBSUB_ENDPOINT, value: "https://europe-west1-pubsub.googleapis.com" }
            - { name: PUSH_AUDIENCE, value: "${PUSH_AUDIENCE}" }
            - { name: PUSH_SA_EMAIL, value: ryft-push@ryftlab-prod.iam.gserviceaccount.com }
            - { name: PUSH_SA_ID, value: "${PUSH_SA_ID}" }
            - { name: OTLP_ENDPOINT, value: "${OTLP_ENDPOINT}" }
            - { name: OTLP_USER, value: "${OTLP_USER}" }
            - { name: OTLP_TOKEN, valueFrom: { secretKeyRef: { name: otlp-token, key: "1" } } }
            - { name: LOG_LEVEL, value: "${LOG_LEVEL}" }
  traffic:
    - { percent: 100, latestRevision: true }
