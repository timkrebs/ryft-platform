# api on Cloud Run (D223): the read side, settings, account deletion, the operator's /v1/admin routes.
# A template: scripts/cloudrun_render.py fills its placeholders (a fixed list) from deploy/run/config.env
# and the image digest, and deploy.yml runs `gcloud run services replace` on the result. CI owns the
# revisions, Terraform the IAM (allUsers as invoker comes with infra/gcp's apply 2). Limits: design §3.
# scripts/check_cloudrun.py pins the limits, ingress, account, port, probes, env and secret pins.
# Secrets are pinned by version number, never latest (design §4); a role password moves with
# scripts/rotate_db_password.sh, which moves migrate.yaml's pin in the same commit.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      # The revision carries D285's meal PATCH (it copies each retained item row as stored). A revision without
      # this label deletes and reinserts the items and so erases the meal portion labels (0053): deploy.yml reads
      # it from the serving api before migrate and refuses a commit that writes those labels while an api
      # without it serves (the rollback target). scripts/check_cloudrun.py requires it here.
      labels:
        ryft-meal-patch: d285
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: ryft-api@ryftlab-prod.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - name: api
          image: "${IMAGE}"
          # h2c: HTTP/2 end to end, so a 32 MiB body is not cut by the front end's HTTP/1 limit (design §3).
          # Cloud Run sets PORT to this port; PORT itself is reserved and never set here.
          ports:
            - { name: h2c, containerPort: 8080 }
          resources:
            limits: { cpu: "1", memory: 512Mi }
          # Started means listening (/health/live), not ready: an instance has to start while the
          # database is down, so that its ticks log result error (Tick missing, D236) instead of no
          # instance and no signal at all, and a start that fails is billed 20 s, not 120. /health/ready
          # stays the uptime checks' target (infra/gcp). The same in all four services.
          startupProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - { name: DATABASE_URL, value: "${DATABASE_URL}" }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: db-password-api, key: "1" } } }
            - { name: AUTH_MODE, value: supabase }
            - { name: SUPABASE_PROJECT_REF, value: "${SUPABASE_PROJECT_REF}" }
            - { name: SUPABASE_SERVICE_ROLE_KEY, valueFrom: { secretKeyRef: { name: supabase-secret-key, key: "1" } } }
            - { name: PRIVACY_POLICY_VERSION, value: "${PRIVACY_POLICY_VERSION}" }
            - { name: PRIVACY_POLICY_URL, value: "https://ryftlab.de/privacy" }
            - { name: BETA_GATE, value: "${BETA_GATE}" }
            - { name: XFF_TRUSTED_HOPS, value: "${XFF_TRUSTED_HOPS}" }
            # App Attest (D245, D247): the mode and the exempt accounts from config.env. The ring's row comes
            # with the warn flip, in ingest.yaml too, at the version Secret Manager gave it (by number):
            #   { name: APP_ATTEST_TOKEN_KEYS, valueFrom: { secretKeyRef: { name: app-attest-token-key, key: "<n>" } } }
            # Without it the three routes answer 501, and warn or on refuse to start (check_cloudrun.py refuses them).
            - { name: APP_ATTEST, value: "${APP_ATTEST}" }
            - { name: APP_ATTEST_EXEMPT_USERS, value: "${APP_ATTEST_EXEMPT_USERS}" }
            # Direct connections (D257, design §9): the providers served and Garmin's user cap from config.env
            # (CONNECT_PROVIDERS one line for api and ingest), the redirect URI's base (<base>/v1/connect/
            # <provider>/callback). Phase 2 adds, in the PR that puts garmin into CONNECT_PROVIDERS, the client
            # id and the client secret at the version Secret Manager gave it (by number; no version exists
            # before, and a pin to a missing version keeps the revision from starting):
            #   { name: CONNECT_GARMIN_CLIENT_ID, value: <the programme's id> }
            #   { name: CONNECT_GARMIN_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: connect-garmin-client-secret, key: "<n>" } } }
            # The fake provider (CONNECT_FAKE*) is compose only: check_cloudrun.py refuses it in any template.
            - { name: CONNECT_PROVIDERS, value: "${CONNECT_PROVIDERS}" }
            - { name: CONNECT_GARMIN_USER_CAP, value: "${CONNECT_GARMIN_USER_CAP}" }
            - { name: CONNECT_CALLBACK_BASE, value: "https://api.ryftlab.de" }
            - { name: ADMIN_WEB_ORIGINS, value: "https://ryftlab.de" }
            - { name: ADMIN_API_KEY, valueFrom: { secretKeyRef: { name: admin-api-key, key: "1" } } }
            - { name: APPLE_TEAM_ID, value: M77SKHKG63 }
            - { name: APPLE_KEY_ID, value: "${APPLE_KEY_ID}" }
            - { name: APPLE_CLIENT_ID, value: dev.timkrebs.ryft }
            - { name: APPLE_KEY_P8, valueFrom: { secretKeyRef: { name: apple-key-p8, key: "1" } } }
            - { name: DATA_ENCRYPTION_KEY, valueFrom: { secretKeyRef: { name: data-key, key: "1" } } }
            - { name: GCP_PROJECT, value: ryftlab-prod }
            - { name: PUBSUB_ENDPOINT, value: "https://europe-west1-pubsub.googleapis.com" }
            - { name: PUSH_AUDIENCE, value: "${PUSH_AUDIENCE}" }
            - { name: PUSH_SA_EMAIL, value: ryft-push@ryftlab-prod.iam.gserviceaccount.com }
            - { name: PUSH_SA_ID, value: "${PUSH_SA_ID}" }
            # The production smoke (D286): a Google ID token of ryft-smoke is the smoke account's and nobody else's.
            # All four set, as in ingest.yaml (check_cloudrun.py), or the service refuses to start.
            - { name: SMOKE_OIDC_SA_EMAIL, value: ryft-smoke@ryftlab-prod.iam.gserviceaccount.com }
            - { name: SMOKE_OIDC_SA_ID, value: "${SMOKE_SA_ID}" }
            - { name: SMOKE_OIDC_AUDIENCE, value: ryft-smoke }
            - { name: SMOKE_USER_ID, value: "${SMOKE_USER_ID}" }
            - { name: POSTHOG_PROJECT_KEY, valueFrom: { secretKeyRef: { name: posthog-project-key, key: "1" } } }
            - { name: LOG_LEVEL, value: "${LOG_LEVEL}" }
  # Every deploy sends all traffic to the new revision, which also ends a rollback's pin
  # (gcloud run services update-traffic, docs/OPERATIONS.md → GCP).
  traffic:
    - { percent: 100, latestRevision: true }
