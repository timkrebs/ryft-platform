# Grafana Cloud Kubernetes Monitoring (chart grafana/k8s-monitoring 4.5.3), as the
# Grafana Cloud onboarding generated it, adapted to RYFT (docs/DECISIONS.md D51):
#   - namespace monitoring (created by infra/vault, Pod Security privileged), not ryft;
#   - the Fleet Management token comes from Secret ryft-secrets (keys GC_TOKEN and
#     PROM_USERNAME), which the Vault Secrets Operator syncs from the in-cluster Vault,
#     RYFT's only Vault (https://vault.vault.svc:8200; mount kv-monitoring, path config,
#     Kubernetes auth role monitoring; D207), through the VaultConnection, VaultAuth and
#     VaultStaticSecret that infra/vault generates into
#     deploy/k8s/overlays/vault-namespaces/monitoring. The token is
#     infra/vault's service_secrets.monitoring.GC_TOKEN; it is never on a command line
#     or in this file.
# From an empty cluster this chart comes after the Vault init and infra/vault's apply (the
# Secret cannot exist before), so the Vault pods already run when the collectors start.
# Of the three exclusions of `vault`, only the SDK injector's is in this file
# (telemetryServices.sdkInjector below); the pod-log and Beyla exclusions are Fleet
# Management settings in Grafana Cloud and must be checked there before this install
# (docs/OBSERVABILITY.md → From an empty cluster: prerequisites, the token and its scopes).
# What the collector gathers is configured remotely in Grafana Cloud (Fleet
# Management). RYFT's pod logs must stay out of it (they carry users' daily scores;
# they go to CloudWatch instead): see docs/OBSERVABILITY.md → Grafana Cloud.
#   make monitoring-apply KUBE_CONTEXT=ryft-prod-euc1   (the context is always named, D150)
cluster:
  name: ryft-prod-euc1

# ---- Admission signals (T12-e, D120; docs/OBSERVABILITY.md → Admission) ----------------
# Fleet Management owns the cluster's usual pipelines. This block adds two small scrapes
# the chart owns, each with its own job label (so nothing collides with a Fleet series):
#   1. the API servers' admission metrics (apiServer below, one target per endpoint of
#      default/kubernetes, not the VIP), kept by an allow-list;
#   2. kube-state-metrics' series for the policy bindings (its native collector, enabled
#      under telemetryServices.kube-state-metrics).
# Every other source of clusterMetrics is off, or Fleet's pipelines would be duplicated.
# The data needs a destination of the chart's own: the stack's Prometheus write endpoint
# with the same user and token as OpenCost (ryft-secrets PROM_USERNAME, GC_TOKEN). The
# Fleet's pipelines write with the same token, so it can already write. If the pods log
# 401/403 from remote_write, check the access policy (OPERATIONS → Admission policy signals).
destinations:
  admission-signals:
    type: prometheus
    url: https://prometheus-prod-65-prod-eu-west-2.grafana.net/api/prom/push
    auth:
      type: basic
      usernameKey: PROM_USERNAME
      passwordKey: GC_TOKEN
    # With an existing secret the chart reads every other field from it too (tenant id,
    # client TLS), and ryft-secrets has neither: the tenant id is the same PROM_USERNAME
    # (Grafana Cloud's tenant is the Prometheus user), and the client TLS block goes, as
    # for the remote config above.
    tenantIdKey: PROM_USERNAME
    tls: null
    secret:
      create: false
      name: ryft-secrets
      namespace: monitoring

  # Vault's server log and its stdout audit device (D197, addendum-1 section 1.4): the one log
  # stream this chart ships. Used only by podLogsViaLoki below, which is off: an unused
  # destination renders nothing. The URL is the stack's Logs push URL (Grafana Cloud -> the
  # stack -> Loki -> Details), and LOKI_USERNAME (the Logs user, a number, not a secret) joins
  # ryft-secrets through infra/vault's service_secrets.monitoring before the switch. Same token
  # as the metrics (GC_TOKEN, logs:write). Turning it on: docs/OPERATIONS.md -> Vault logs.
  vault-logs:
    type: loki
    url: ""
    auth:
      type: basic
      usernameKey: LOKI_USERNAME
      passwordKey: GC_TOKEN
    tenantIdKey: LOKI_USERNAME
    tls: null
    # One cluster label, not the chart's second k8s_cluster_name (the label policy below).
    clusterLabels: [cluster]
    secret:
      create: false
      name: ryft-secrets
      namespace: monitoring

clusterMetrics:
  enabled: true
  destinations: [admission-signals]
  # The chart needs to be told which collector runs the scrapes: the clustered
  # cluster-wide one (a single replica; both collectors are Fleet-assigned otherwise).
  collector: alloy-deployment
  kubelet: { enabled: false }
  kubeletResource: { enabled: false }
  kubeletProbes: { enabled: false }
  cadvisor: { enabled: false }
  apiServer:
    enabled: true
    jobLabel: ryft/kube-apiserver-admission
    scrapeInterval: 60s
    metricsTuning:
      # The chart anchors this regex and always keeps up and scrape_samples_scraped.
      # The latency histogram is kept as _sum and _count only (no buckets): nothing
      # alerts on its quantiles, and its buckets would be most of the series.
      includeMetrics:
        - apiserver_validating_admission_policy_check_total
        - apiserver_validating_admission_policy_check_duration_seconds_(sum|count)
        - pod_security_evaluations_total
    # Pod Security counts every Pod it allows too; only its refusals are of interest.
    extraMetricProcessingRules: |-
      rule {
        source_labels = ["__name__", "decision"]
        regex = "pod_security_evaluations_total;(allow|exempt)"
        action = "drop"
      }
  kube-state-metrics:
    enabled: true
    jobLabel: ryft/admission-bindings
    metricsTuning:
      useDefaultAllowList: false
      includeMetrics:
        - kube_validatingadmissionpolicybinding_(info|validation_action)

# The chart's self-report would add its own series to the new destination.
selfReporting:
  enabled: false

# ---- Vault's logs (D197, D198; addendum-1 sections 1.4 and 1.5) -----------------------------
# The reviewed pipeline for namespace vault, and only that namespace: alloy-daemonset reads the
# node's container log files (gather method "volumes", the filesystem-log-reader preset already
# mounts them) and pushes to vault-logs. No connection to Vault, so no NetworkPolicy change.
# Fleet Management's own pod-log pipeline must exclude `ryft-.*|vault` (a Grafana UI setting,
# OPERATIONS -> Monitoring -> Fleet exclusions of vault), or the lines arrive twice and shaped
# by remote config.
# OFF until vault-logs has its URL and ryft-secrets has LOKI_USERNAME: with the key missing,
# the daemonset's whole local config would fail to evaluate. Turning it on is one reviewed PR
# (enabled: true plus the URL above), then `make monitoring-apply`.
# Label policy (1.5): stream labels are cluster, namespace, pod, container, job="ryft/vault" and
# stream = server | audit | other, nothing taken from a line's content, no structured metadata,
# no rewriting of a line. A line with "@level" from container vault is the server log (hclog
# JSON), "type" request/response is an audit entry, anything else other: the start script and
# the snapshot job (its init container `snapshot` writes "@level" lines too, so the server match
# names the container).
podLogsViaLoki:
  enabled: false
  collector: alloy-daemonset
  destinations: [vault-logs]
  namespaces: [vault]
  # The chart's defaults are maps, which an empty map does not replace: null removes each key.
  labels:
    app_kubernetes_io_name: null
  annotations:
    job: null
  structuredMetadata:
    k8s.pod.name: null
    pod: null
    service.instance.id: null
  extraLogProcessingStages: |-
    stage.json {
      expressions = { tmp_vault_level = "\"@level\"", tmp_vault_type = "type" }
    }
    stage.labels {
      values = { tmp_vault_level = "", tmp_vault_type = "" }
    }
    stage.static_labels {
      values = { stream = "other", job = "ryft/vault" }
    }
    stage.match {
      selector = "{tmp_vault_type=~\"request|response\"}"
      stage.static_labels {
        values = { stream = "audit" }
      }
    }
    stage.match {
      selector = "{tmp_vault_level=~\".+\", container=\"vault\"}"
      stage.static_labels {
        values = { stream = "server" }
      }
    }
    stage.label_keep {
      values = ["cluster", "namespace", "pod", "container", "stream", "job"]
    }

collectorCommon:
  alloy:
    remoteConfig:
      enabled: true
      url: https://fleet-management-prod-011.grafana.net
      auth:
        # Explicit: the chart infers basic auth only from an inline password, and with
        # an existing secret it reads every other value from that secret, the username
        # too. usernameFrom is a literal Alloy string, so only the token comes from it.
        # (Without these, the collector started with no credentials, 2026-10-19.)
        type: basic
        usernameFrom: '"1580862"'    # the stack's Fleet Management user (not a secret)
        passwordKey: GC_TOKEN
      secret:
        create: false
        name: ryft-secrets
        namespace: monitoring
      # The chart's default tls block would read ca/cert/key from that secret, which
      # has none; the server's public certificate needs no client TLS settings.
      tls: null

# The collectors as Grafana Cloud's current onboarding names them: Fleet Management
# assigns the Kubernetes pipelines by collector (workloadName alloy-daemonset /
# alloy-deployment). A single collector named "alloy" got only the self-monitoring
# pipelines and sent no cluster metrics (2026-10-19).
collectors:
  alloy-daemonset:
    presets: [large, root, host-network, host-storage, host-cgroup, clustered, service-discovery, filesystem-log-reader, daemonset]
    # Clustering on host network: Alloy looks for eth0/en0 to advertise itself, but
    # Amazon Linux 2023 (Nitro) nodes call it ens5, so every collector fell back to
    # localhost and formed a cluster of one (each would scrape the cluster-wide
    # targets itself). Only args here: extraEnv would replace the list the chart
    # builds (NAMESPACE, POD_NAME, CLUSTER_NAME, GCLOUD_RW_API_KEY).
    alloy:
      extraArgs:
        - --cluster.advertise-interfaces=ens5,eth0,en0

  alloy-deployment:
    presets: [large, clustered, deployment, otel-receiver]
    extraService:
      enabled: true
      name: otel-receiver
    # ---- Vault (D194; docs/OBSERVABILITY.md -> Vault) ------------------------------------------
    # Two scrapes of the chart's own on this collector, written to admission-signals like the
    # admission scrapes, each with its own job label:
    #   1. ryft/vault: /v1/sys/metrics?format=prometheus on every Vault server pod, port 8200,
    #      without a token (unauthenticated_metrics_access on the listener, so each node answers
    #      for itself, standbys and sealed nodes included). This collector is a pod-network peer,
    #      so vault-extras' NetworkPolicy names its pods (peers.collector); the host-network
    #      daemonset is not used for it. TLS with the ryft-vault CA from this namespace's own
    #      vault-ca Secret (infra/vault generates its Certificate), server name vault.vault.svc
    #      (on the certificate). Only the series the alerts and the dashboard row use are kept,
    #      and Vault's own `cluster` label (its Raft cluster name) becomes vault_cluster: it
    #      would otherwise win over the external label cluster="ryft-prod-euc1".
    #   2. ryft/vault-state: kube-state-metrics' series for namespace vault (the snapshot
    #      CronJob, the StatefulSet, the server pods' readiness, and kube_pod_labels with the
    #      service-registration labels vault-initialized/-sealed/-active: the alerts' gate). Fleet's own KSM pipeline is
    #      remote config and its default allow list has no pod readiness; the snapshot alert must
    #      not depend on it (VaultSnapshotStale pages, D192). Restarts stay Fleet's
    #      (PodRestarting), so no series is counted twice.
    # Vault pods get no prometheus.io/* annotations: Fleet's annotation scrape over plain HTTP
    # would only fail.
    extraConfig: |-
      discovery.kubernetes "ryft_vault" {
        role = "pod"
        namespaces {
          names = ["vault"]
        }
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/name=vault,component=server"
        }
      }

      discovery.relabel "ryft_vault" {
        targets = discovery.kubernetes.ryft_vault.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "8200"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      prometheus.scrape "ryft_vault" {
        targets         = discovery.relabel.ryft_vault.output
        job_name        = "ryft/vault"
        scheme          = "https"
        metrics_path    = "/v1/sys/metrics"
        params          = { "format" = ["prometheus"] }
        scrape_interval = "60s"
        scrape_timeout  = "10s"
        tls_config {
          ca_file              = "/etc/ryft/vault-ca/ca.crt"
          server_name          = "vault.vault.svc"
          insecure_skip_verify = false
        }
        clustering {
          enabled = true
        }
        forward_to = [prometheus.relabel.ryft_vault.receiver]
      }

      prometheus.relabel "ryft_vault" {
        rule {
          source_labels = ["__name__"]
          regex         = "up|scrape_samples_scraped|vault_core_(active|unsealed|handle_request_count|handle_login_request_count|in_flight_requests)|vault_autopilot_(healthy|failure_tolerance|node_healthy)|vault_audit_log_(request|response)_(failure|count)|vault_token_count(_by_policy|_by_ttl)?|vault_raft_leader_lastContact_(sum|count)"
          action        = "keep"
        }
        rule {
          source_labels = ["cluster"]
          target_label  = "vault_cluster"
        }
        rule {
          regex  = "cluster"
          action = "labeldrop"
        }
        forward_to = [prometheus.remote_write.admission_signals.receiver]
      }

      discovery.kubernetes "ryft_vault_state" {
        role = "endpoints"
        namespaces {
          names = ["monitoring"]
        }
        selectors {
          role  = "endpoints"
          label = "release=grafana-cloud,app.kubernetes.io/name=kube-state-metrics"
        }
      }

      discovery.relabel "ryft_vault_state" {
        targets = discovery.kubernetes.ryft_vault_state.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http"
          action        = "keep"
        }
      }

      prometheus.scrape "ryft_vault_state" {
        targets         = discovery.relabel.ryft_vault_state.output
        job_name        = "ryft/vault-state"
        scheme          = "http"
        scrape_interval = "60s"
        scrape_timeout  = "10s"
        clustering {
          enabled = true
        }
        forward_to = [prometheus.relabel.ryft_vault_state.receiver]
      }

      prometheus.relabel "ryft_vault_state" {
        rule {
          source_labels = ["__name__", "namespace"]
          regex         = "(up|scrape_samples_scraped);.*|(kube_cronjob_status_last_(successful|schedule)_time|kube_statefulset_replicas|kube_statefulset_status_replicas(_ready|_updated)?|kube_pod_container_status_(ready|running)|kube_pod_labels);vault"
          action        = "keep"
        }
        forward_to = [prometheus.remote_write.admission_signals.receiver]
      }
    includeDestinations: [admission-signals]
    alloy:
      mounts:
        extra:
          - name: vault-ca
            mountPath: /etc/ryft/vault-ca
            readOnly: true
    controller:
      volumes:
        extra:
          # optional: before infra/vault writes the Certificate (or if it is ever missing) the
          # collector still starts; only the Vault scrape fails (VaultScrapeDown).
          - name: vault-ca
            secret:
              secretName: vault-ca
              optional: true
              items:
                - key: ca.crt
                  path: ca.crt

# Everything the onboarding deploys, on t3.large nodes (D64). OpenCost reads Grafana
# Cloud's Prometheus with the same token: user and token from ryft-secrets
# (PROM_USERNAME and GC_TOKEN in infra/vault), never inline.
telemetryServices:
  node-exporter:
    deploy: true
  kube-state-metrics:
    deploy: true
    # kube_pod_labels with Vault's service-registration labels (vault-initialized, vault-sealed,
    # vault-active: the server writes them on its own pod, charts/vault-extras rbac.yaml) for
    # the ryft-vault alerts' durable "this Vault has been initialised" gate (ryft/vault-state
    # keeps the series of namespace vault only). A list replaces the chart's default, so the
    # nodes entry is telemetry-services' default, unchanged.
    metricLabelsAllowlist:
      - nodes=[agentpool,alpha.eksctl.io/cluster-name,alpha.eksctl.io/nodegroup-name,beta.kubernetes.io/instance-type,cloud.google.com/gke-nodepool,cluster-name,ec2.amazonaws.com/Name,ec2.amazonaws.com/aws-autoscaling-groupName,ec2.amazonaws.com/aws-autoscaling-group-name,ec2.amazonaws.com/name,eks.amazonaws.com/nodegroup,k8s.io/cloud-provider-aws,karpenter.sh/nodepool,kubernetes.azure.com/cluster,kubernetes.io/arch,kubernetes.io/hostname,kubernetes.io/os,node.kubernetes.io/instance-type,topology.kubernetes.io/region,topology.kubernetes.io/zone]
      - pods=[vault-initialized,vault-sealed,vault-active]
    # The policy bindings as metrics (design claim m): kube-state-metrics' own collector for
    # them (v2.20+, Kubernetes 1.30+), not custom-resource-state, which resolves kinds from
    # CRDs only and ignores built-in ones. The chart adds list/watch on the bindings to the
    # ClusterRole itself. A list replaces the chart's default, so this is that default plus
    # the last entry. Series: kube_validatingadmissionpolicybinding_info{validatingadmissionpolicybinding,
    # policy_name} and _validation_action{validatingadmissionpolicybinding,action} (1 for each live
    # action only). The committed action is not in them: ryft:admission_binding_intended.
    collectors:
      - certificatesigningrequests
      - configmaps
      - cronjobs
      - daemonsets
      - deployments
      - endpointslices
      - horizontalpodautoscalers
      - ingresses
      - jobs
      - leases
      - limitranges
      - mutatingwebhookconfigurations
      - namespaces
      - networkpolicies
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - poddisruptionbudgets
      - pods
      - replicasets
      - replicationcontrollers
      - resourcequotas
      - secrets
      - services
      - statefulsets
      - storageclasses
      - validatingwebhookconfigurations
      - volumeattachments
      - validatingadmissionpolicybindings  # the native collector, not custom-resource-state (D183)
  beyla:
    deploy: true
    k8sCache:
      replicas: 1
  opencost:
    deploy: true
    metricsSource: custom
    opencost:
      exporter:
        defaultClusterId: ryft-prod-euc1
      prometheus:
        existingSecretName: ryft-secrets
        username_key: PROM_USERNAME
        password_key: GC_TOKEN
        external:
          url: https://prometheus-prod-65-prod-eu-west-2.grafana.net/api/prom
  kepler:
    deploy: true
  k8s-manifest-tail:
    deploy: true
    config:
      objects:
        - { apiVersion: v1, kind: Pod }
        - { apiVersion: apps/v1, kind: Deployment }
        - { apiVersion: apps/v1, kind: StatefulSet }
        - { apiVersion: apps/v1, kind: DaemonSet }
  sdkInjector:
    deploy: true
    allowedConfigMapWriters: system:serviceaccount:monitoring:grafana-cloud-alloy-daemonset,system:serviceaccount:monitoring:grafana-cloud-alloy-deployment
    # The injector is a pod-mutating webhook (chart k8s-injection-controller, failurePolicy
    # Ignore, all namespaces but the excluded ones). RYFT's pods must not be mutated: the
    # admission policies pin their images and commands (an injected init container would
    # be refused), and the services export their own metrics. The chart excludes by exact
    # namespace name (a NotIn on kubernetes.io/metadata.name), not by prefix, so every
    # ryft-* namespace is listed. A list value replaces the chart's default list, so the
    # defaults are repeated first. A new ryft-* namespace is added here too
    # (docs/OBSERVABILITY.md -> Grafana Cloud). Vault (D186) and the operator that reads it
    # are excluded as well: a mutated Vault pod would run an injected container next to the
    # unsealed keyring (and, under vault_seal = "awskms", the pod's Pod Identity credentials
    # for the unseal key), and what the injector injects is steered from Grafana Fleet. The
    # exclusion lives here, in the chart's webhook, not in Fleet: it is in force from this
    # chart's first install, and the webhook acts on pod CREATE only, so Vault pods that
    # started before the install (a rebuild from empty: Vault comes first) were never seen by
    # it. Never install this chart without these entries.
    webhook:
      excludedNamespaces:
        # chart defaults (4.5.3)
        - kube-system
        - kube-public
        - kube-node-lease
        - cert-manager
        - monitoring
        - local-path-storage
        - grafana-alloy
        - gke-connect
        - gke-gmp-system
        - gke-managed-cim
        - gke-managed-filestorecsi
        - gke-managed-metrics-server
        - gke-managed-system
        - gke-system
        - gke-managed-volumepopulator
        - gatekeeper-system
        # RYFT
        - ryft-api
        - ryft-ingest
        - ryft-scoring
        - ryft-notify
        - ryft-migrate
        - ryft-smoke
        - ryft-web
        - ryft-rabbitmq
        - ryft-postgres
        # Vault and the Vault Secrets Operator
        - vault
        - vault-secrets-operator-system
