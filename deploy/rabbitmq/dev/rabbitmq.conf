# compose's RabbitMQ (make up), like the cluster's (deploy/rabbitmq/cluster, D98): AMQP
# only over TLS on 5671 with client certificates; the topology and users from
# definitions.json (generated, D99). The management UI stays plain on 15672 here
# (localhost only), for scripts/dlq.sh and a look.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/rabbitmq/ca.crt
ssl_options.certfile = /certs/rabbitmq/tls.crt
ssl_options.keyfile = /certs/rabbitmq/tls.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true
management.tcp.port = 15672
prometheus.tcp.port = 15692
load_definitions = /etc/rabbitmq/definitions.json
