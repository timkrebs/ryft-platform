# Who reaches the broker (on top of the default deny):
#   5671 (AMQPS)      the four services only
#   15671 (mgmt TLS)  the topology operator (rabbitmq-system), and Traefik for the UI
#                     at rabbitmq.ryftapp.de (management.yaml)
#   15692 (metrics)   the collectors, from node addresses (VPC)
#   4369, 25672, 35672-35682 (Erlang distribution, CLI tools)  the nodes among themselves
# and what the broker reaches: the other nodes, and the Kubernetes API for peer
# discovery (rabbitmq_peer_discovery_k8s), the API server being outside the pod network.
# The API server's private ENIs sit in the VPC (10.0.0.0/16, infra/aws vpc_cidr), so
# 443 is open to the VPC only, not to the internet (T12-k; canary in OPERATIONS → RabbitMQ).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: rabbitmq } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ryft-ingest } }
          podSelector: { matchLabels: { app: ingest } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ryft-api } }
          podSelector: { matchLabels: { app: api } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ryft-scoring } }
          podSelector: { matchLabels: { app: scoring } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ryft-notify } }
          podSelector: { matchLabels: { app: notify } }
      ports:
        - { protocol: TCP, port: 5671 }
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: rabbitmq-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: messaging-topology-operator } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports:
        - { protocol: TCP, port: 15671 }
    - from:
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { protocol: TCP, port: 15692 }
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: rabbitmq } }
      ports:
        - { protocol: TCP, port: 4369 }
        - { protocol: TCP, port: 25672 }
        - { protocol: TCP, port: 35672, endPort: 35682 }
        - { protocol: TCP, port: 5671 }
        - { protocol: TCP, port: 15671 }
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: rabbitmq } }
      ports:
        - { protocol: TCP, port: 4369 }
        - { protocol: TCP, port: 25672 }
        - { protocol: TCP, port: 35672, endPort: 35682 }
        - { protocol: TCP, port: 5671 }
        - { protocol: TCP, port: 15671 }
    - to:
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { protocol: TCP, port: 443 }
