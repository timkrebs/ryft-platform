# Local development stack. `make up` then `make smoke`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ryft
      POSTGRES_PASSWORD: ryft
      POSTGRES_DB: ryft
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryft"]
      interval: 5s
      retries: 10

  # Same config as Kubernetes (users and permissions per service). On Kubernetes
  # the passwords are bcrypt hashes from Vault; here they are dev passwords.
  nats:
    image: nats:2.11-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_PASSWORD_INGEST: dev-ingest-nats-password
      NATS_PASSWORD_SCORING: dev-scoring-nats-password
      NATS_PASSWORD_API: dev-api-nats-password
      NATS_PASSWORD_NOTIFY: dev-notify-nats-password
    ports: ["4222:4222", "8222:8222"]
    volumes:
      - natsdata:/data
      - ./deploy/k8s/base/nats/nats.conf:/etc/nats/nats.conf:ro

  # Applies the migrations as the owner (ryft) and sets the services' role
  # passwords, then exits; the services start after it and connect as their own
  # least-privilege roles, as on Kubernetes (docs/ARCHITECTURE.md).
  migrate:
    build: { context: ./backend, args: { SERVICE: migrate } }
    environment:
      DATABASE_URL: postgres://ryft:ryft@postgres:5432/ryft?sslmode=disable
      DB_PASSWORD_INGEST: dev-ingest-db-password
      DB_PASSWORD_SCORING: dev-scoring-db-password
      DB_PASSWORD_API: dev-api-db-password
      DB_PASSWORD_NOTIFY: dev-notify-db-password
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  ingest:
    build: { context: ./backend, args: { SERVICE: ingest } }
    environment:
      <<: &env
        NATS_URL: nats://nats:4222
        API_KEY: ${API_KEY:-dev-api-key-change-me}
        # Local development: a shared key instead of Supabase tokens. The bearer
        # "<API_KEY>:<uuid>" acts as that user (scripts/check_api.py uses it).
        AUTH_MODE: apikey
        ALLOW_INSECURE_APIKEY_AUTH: "true"
        # The invite gate is off locally (BETA_GATE=on make up to try it); consent to
        # the policy below is always needed before a sync.
        BETA_GATE: ${BETA_GATE:-off}
        PRIVACY_POLICY_VERSION: "2026-10-20"
      DATABASE_URL: postgres://ryft_ingest:dev-ingest-db-password@postgres:5432/ryft?sslmode=disable
      NATS_USER: ingest
      NATS_PASSWORD: dev-ingest-nats-password
    ports: ["8081:8080"]
    depends_on: &deps
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_started }

  scoring:
    build: { context: ./backend, args: { SERVICE: scoring } }
    environment:
      <<: *env
      DATABASE_URL: postgres://ryft_scoring:dev-scoring-db-password@postgres:5432/ryft?sslmode=disable
      NATS_USER: scoring
      NATS_PASSWORD: dev-scoring-nats-password
    depends_on: *deps

  api:
    build: { context: ./backend, args: { SERVICE: api } }
    environment:
      <<: *env
      DATABASE_URL: postgres://ryft_api:dev-api-db-password@postgres:5432/ryft?sslmode=disable
      NATS_USER: api
      NATS_PASSWORD: dev-api-nats-password
      # Bearer of /v1/admin (feature flags); scripts/check_api.py uses it.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me-0123456789abcdef}
    ports: ["8082:8080"]
    depends_on: *deps

  # No APNs key locally: notify consumes and decides, and counts what it would
  # have sent (ryft_push_notifications_total{result="unconfigured"} on :9093,
  # which scripts/check_api.py reads).
  notify:
    build: { context: ./backend, args: { SERVICE: notify } }
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://ryft_notify:dev-notify-db-password@postgres:5432/ryft?sslmode=disable
      NATS_USER: notify
      NATS_PASSWORD: dev-notify-nats-password
    ports: ["9093:9090"]
    depends_on: *deps

volumes:
  pgdata:
  natsdata:
