# Local development stack. `make up` then `make smoke`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ryft
      POSTGRES_PASSWORD: ryft
      POSTGRES_DB: ryft
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryft"]
      interval: 5s
      retries: 10

  # RabbitMQ (D97) as on the cluster: AMQPS with client certificates on 5671 (a dev CA,
  # rabbitmq-certs), the generated topology and dev users (deploy/rabbitmq/dev).
  rabbitmq-certs:
    image: &rabbitmq-image docker.io/library/rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
    entrypoint: ["sh", "/dev-amqp-certs.sh"]
    restart: "no"
    volumes:
      - amqpcerts:/certs
      - ./scripts/dev-amqp-certs.sh:/dev-amqp-certs.sh:ro

  rabbitmq:
    image: *rabbitmq-image
    ports: ["5671:5671", "15672:15672"]
    volumes:
      - amqpcerts:/certs:ro
      - ./deploy/rabbitmq/dev/rabbitmq.conf:/etc/rabbitmq/conf.d/90-ryft.conf:ro
      - ./deploy/rabbitmq/dev/definitions.json:/etc/rabbitmq/definitions.json:ro
    # A port check, not rabbitmq-diagnostics: the CLI run as root before the server is
    # up writes the Erlang cookie as root, and the server (user rabbitmq) cannot read it.
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5671"]
      interval: 5s
      retries: 30
    depends_on:
      rabbitmq-certs: { condition: service_completed_successfully }

  # Applies the migrations as the owner (ryft) and sets the services' role
  # passwords, then exits; the services start after it and connect as their own
  # least-privilege roles, as on Kubernetes (docs/ARCHITECTURE.md).
  migrate:
    build: { context: ./backend, args: { SERVICE: migrate } }
    environment:
      DATABASE_URL: postgres://ryft:ryft@postgres:5432/ryft?sslmode=disable
      DB_PASSWORD_INGEST: dev-ingest-db-password
      DB_PASSWORD_SCORING: dev-scoring-db-password
      DB_PASSWORD_API: dev-api-db-password
      DB_PASSWORD_NOTIFY: dev-notify-db-password
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  ingest:
    build: { context: ./backend, args: { SERVICE: ingest } }
    environment:
      <<: &env
        API_KEY: ${API_KEY:-dev-api-key-change-me}
        # Local development: a shared key instead of Supabase tokens. The bearer
        # "<API_KEY>:<uuid>" acts as that user (scripts/check_api.py uses it).
        AUTH_MODE: apikey
        ALLOW_INSECURE_APIKEY_AUTH: "true"
        # The invite gate is off locally, the consent check on (both off|warn|on:
        # BETA_GATE=warn CONSENT_ENFORCE=warn make up to try warn).
        BETA_GATE: ${BETA_GATE:-off}
        CONSENT_ENFORCE: ${CONSENT_ENFORCE:-on}
        PRIVACY_POLICY_VERSION: "2026-10-26"
        AMQP_URL: amqps://rabbitmq:5671/ryft
      DATABASE_URL: postgres://ryft_ingest:dev-ingest-db-password@postgres:5432/ryft?sslmode=disable
      AMQP_USER: ingest
      AMQP_PASSWORD: dev-ingest-amqp-password
      AMQP_CA_FILE: /certs/ingest/ca.crt
      AMQP_CERT_FILE: /certs/ingest/tls.crt
      AMQP_KEY_FILE: /certs/ingest/tls.key
    volumes: ["amqpcerts:/certs:ro"]
    ports: ["8081:8080"]
    depends_on: &deps
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  scoring:
    build: { context: ./backend, args: { SERVICE: scoring } }
    environment:
      <<: *env
      DATABASE_URL: postgres://ryft_scoring:dev-scoring-db-password@postgres:5432/ryft?sslmode=disable
      AMQP_USER: scoring
      AMQP_PASSWORD: dev-scoring-amqp-password
      AMQP_CA_FILE: /certs/scoring/ca.crt
      AMQP_CERT_FILE: /certs/scoring/tls.crt
      AMQP_KEY_FILE: /certs/scoring/tls.key
    volumes: ["amqpcerts:/certs:ro"]
    depends_on: *deps

  api:
    build: { context: ./backend, args: { SERVICE: api } }
    environment:
      <<: *env
      DATABASE_URL: postgres://ryft_api:dev-api-db-password@postgres:5432/ryft?sslmode=disable
      AMQP_USER: api
      AMQP_PASSWORD: dev-api-amqp-password
      AMQP_CA_FILE: /certs/api/ca.crt
      AMQP_CERT_FILE: /certs/api/tls.crt
      AMQP_KEY_FILE: /certs/api/tls.key
      # Bearer of /v1/admin (feature flags); scripts/check_api.py uses it.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me-0123456789abcdef}
    volumes: ["amqpcerts:/certs:ro"]
    ports: ["8082:8080"]
    depends_on: *deps

  # No APNs key locally: notify consumes and decides, and counts what it would
  # have sent (ryft_push_notifications_total{result="unconfigured"} on :9093,
  # which scripts/check_api.py reads).
  notify:
    build: { context: ./backend, args: { SERVICE: notify } }
    environment:
      DATABASE_URL: postgres://ryft_notify:dev-notify-db-password@postgres:5432/ryft?sslmode=disable
      AMQP_URL: amqps://rabbitmq:5671/ryft
      AMQP_USER: notify
      AMQP_PASSWORD: dev-notify-amqp-password
      AMQP_CA_FILE: /certs/notify/ca.crt
      AMQP_CERT_FILE: /certs/notify/tls.crt
      AMQP_KEY_FILE: /certs/notify/tls.key
    volumes: ["amqpcerts:/certs:ro"]
    ports: ["9093:9090"]
    depends_on: *deps

volumes:
  pgdata:
  amqpcerts:
