# Local development stack. `make up` then `make smoke`.

# The services reach the Pub/Sub emulator as on Cloud Run they reach Pub/Sub (one runtime, not a
# second mode): they publish over REST, take pushes on :8080 (/push/*) and the tick on
# /internal/tick. No push token locally: ALLOW_INSECURE_PUSH, which config refuses on Cloud Run.
x-pubsub-env: &pubsub-env
  PUBSUB_EMULATOR_HOST: pubsub:8085
  GCP_PROJECT: ryft-local
  ALLOW_INSECURE_PUSH: "true"

# Direct connections (D257, design §9) with the fake provider, api and ingest only: CONNECT_FAKE=on is its
# gate (config refuses it on Cloud Run, check_cloudrun.py in any template), CONNECT_PROVIDERS equal in both.
# The fake "authorises" at once by redirecting to <CONNECT_CALLBACK_BASE>/v1/connect/fake/callback, so the
# base is api's host port, where make smoke follows it (http only for localhost). The fake's push secret
# signs the hook's pushes (X-Ryft-Fake-Signature); a local test value, no credential. The two shared values
# are anchored here and aliased in both services, so they cannot drift apart (scoring gets neither).
x-connect-env:
  CONNECT_FAKE: &connect-fake "on"
  CONNECT_PROVIDERS: &connect-providers fake

services:
  postgres:
    # By digest (the index, read off CI's pull on 2026-11-15), as the emulator and curl below.
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_USER: ryft
      POSTGRES_PASSWORD: ryft
      POSTGRES_DB: ryft
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryft"]
      interval: 5s
      retries: 10

  # The Pub/Sub emulator (design 2.3): push, pull, ordering, retry policies and dead letters, no
  # IAM, no OIDC, nothing kept across a restart (make down; make up rebuilds the topology).
  # On 127.0.0.1 only: it checks no credentials. scripts/dlq.sh reads its hold subscriptions with
  # PUBSUB_EMULATOR_HOST=localhost:8085 and --project ryft-local.
  # Pinned by the index digest (2026-11-15), the same as ci.yml's test job; a move changes both.
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators@sha256:3989a42372d3b984bade6db02213d456d94a0ba3765e8b744b95c4188b6fcc89
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=ryft-local"]
    ports: ["127.0.0.1:8085:8085"]
    # A port check: the emulator listens once it serves.
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8085"]
      interval: 5s
      retries: 30

  # The topology on the emulator, then it exits: deploy/pubsub-emulator/init.sh, which
  # cmd/pubsub-topology generates from internal/events/pubsub/topology.go (topics, the push
  # subscriptions to http://<service>:8080<path> with Terraform's retry and dead-letter policy, the
  # DLQ hold subscriptions). Idempotent. The services start once it has run. The curl image is pinned
  # by its index digest (2026-11-15).
  pubsub-init:
    image: &curl-image docker.io/curlimages/curl:8.15.0@sha256:4026b29997dc7c823b51c164b71e2b51e0fd95cce4601f78202c513d97da2922
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      GCP_PROJECT: ryft-local
    volumes:
      - ./deploy/pubsub-emulator/init.sh:/init.sh:ro
    restart: "no"
    depends_on:
      pubsub: { condition: service_healthy }

  # Cloud Scheduler's part: `{}` with ryft-key=tick to ryft-tick every TICK_EVERY seconds (60 by
  # default; production ticks every 15 minutes), which the emulator pushes to every service's
  # /internal/tick (the outbox sweep, scoring's pass, notify's deferrals and stale check).
  ticker:
    image: *curl-image
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      GCP_PROJECT: ryft-local
      TICK_EVERY: ${TICK_EVERY:-60}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while sleep "$$TICK_EVERY"; do
          if curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' \
            --data '{"messages":[{"data":"e30=","attributes":{"ryft-key":"tick"}}]}' \
            "http://$$PUBSUB_EMULATOR_HOST/v1/projects/$$GCP_PROJECT/topics/ryft-tick:publish"; then
            echo tick
          else
            echo "ticker: the publish to ryft-tick failed" >&2
          fi
        done
        echo "ticker: TICK_EVERY=$$TICK_EVERY is not a number of seconds" >&2
        exit 1
    restart: "no"
    depends_on:
      pubsub-init: { condition: service_completed_successfully }

  # Applies the migrations as the owner (ryft) and sets the services' role
  # passwords, then exits; the services start after it and connect as their own
  # least-privilege roles, as on Cloud Run (docs/ARCHITECTURE.md).
  migrate:
    build: { context: ./backend, args: { SERVICE: migrate } }
    environment:
      DATABASE_URL: postgres://ryft:ryft@postgres:5432/ryft?sslmode=disable
      DB_PASSWORD_INGEST: dev-ingest-db-password
      DB_PASSWORD_SCORING: dev-scoring-db-password
      DB_PASSWORD_API: dev-api-db-password
      DB_PASSWORD_NOTIFY: dev-notify-db-password
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  ingest:
    build: { context: ./backend, args: { SERVICE: ingest } }
    environment:
      <<: &env
        <<: *pubsub-env
        API_KEY: ${API_KEY:-dev-api-key-change-me}
        # Local development: a shared key instead of Supabase tokens. The bearer
        # "<API_KEY>:<uuid>" acts as that user (scripts/check_api.py uses it).
        AUTH_MODE: apikey
        ALLOW_INSECURE_APIKEY_AUTH: "true"
        # The invite gate is off locally, the consent check on (both off|warn|on:
        # BETA_GATE=warn CONSENT_ENFORCE=warn make up to try warn).
        BETA_GATE: ${BETA_GATE:-off}
        CONSENT_ENFORCE: ${CONSENT_ENFORCE:-on}
        PRIVACY_POLICY_VERSION: "2026-10-26"
      DATABASE_URL: postgres://ryft_ingest:dev-ingest-db-password@postgres:5432/ryft?sslmode=disable
      CONNECT_FAKE: *connect-fake
      CONNECT_PROVIDERS: *connect-providers
      CONNECT_FAKE_PUSH_SECRET: ${CONNECT_FAKE_PUSH_SECRET:-dev-connect-fake-push-secret}
    ports: ["8081:8080"]
    depends_on: &deps
      migrate: { condition: service_completed_successfully }
      pubsub-init: { condition: service_completed_successfully }

  # Pushes from the emulator arrive on :8080 (/push/ingested, /push/session.completed); no host port.
  scoring:
    build: { context: ./backend, args: { SERVICE: scoring } }
    environment:
      <<: *env
      DATABASE_URL: postgres://ryft_scoring:dev-scoring-db-password@postgres:5432/ryft?sslmode=disable
    depends_on: *deps

  api:
    build: { context: ./backend, args: { SERVICE: api } }
    environment:
      <<: *env
      DATABASE_URL: postgres://ryft_api:dev-api-db-password@postgres:5432/ryft?sslmode=disable
      # Bearer of /v1/admin (feature flags); scripts/check_api.py uses it.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me-0123456789abcdef}
      CONNECT_FAKE: *connect-fake
      CONNECT_PROVIDERS: *connect-providers
      CONNECT_CALLBACK_BASE: http://localhost:8082
      CONNECT_FAKE_USER_CAP: "5"
      # Seals the fake's tokens (config refuses a served provider without it): 32 zero bytes, local only.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    ports: ["8082:8080"]
    depends_on: *deps

  # No APNs key locally: notify takes the pushes on :8080 (/push/scored, /push/session.scored,
  # /push/refresh, /push/wait), decides, and counts what it would have sent
  # (ryft_push_notifications_total{result="unconfigured"} on :9093, which scripts/check_api.py reads).
  notify:
    build: { context: ./backend, args: { SERVICE: notify } }
    environment:
      <<: *pubsub-env
      DATABASE_URL: postgres://ryft_notify:dev-notify-db-password@postgres:5432/ryft?sslmode=disable
    ports: ["9093:9090"]
    depends_on: *deps

volumes:
  pgdata:
