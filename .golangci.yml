# golangci-lint v2 (D18: the standard set plus the extras below).
# Run from backend/: `golangci-lint run` (CI does the same).
version: "2"

run:
  timeout: 5m

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose       # unclosed HTTP response bodies
    - copyloopvar     # pre-Go 1.22 loop variable copies
    - depguard        # internal/logx/logcheck and internal/testsupport are for tests only (D114)
    - errorlint       # wrapped errors compared with == or type-switched
    - gosec           # security smells
    - misspell
    - nilerr          # returning nil after checking err != nil
    - noctx           # HTTP/SQL calls without a context
    - nolintlint      # //nolint directives must name a linter
    - sqlclosecheck   # unclosed rows / statements
    - unconvert       # redundant conversions
    - usestdlibvars   # http.MethodGet over "GET", etc.
    - revive          # exported identifiers and package comments only (rules below)
  settings:
    revive:
      # Listed explicitly: revive's default set adds unrelated findings.
      rules:
        - name: exported
        - name: package-comments
    nolintlint:
      # A bare //nolint silences every linter, revive's exported rule included (the budget is zero).
      require-specific: true
    depguard:
      rules:
        logcheck-tests-only:
          files: ["!$test"]
          deny:
            - pkg: github.com/timkrebs/ryft/internal/logx/logcheck
              desc: test-only (D114)
        goleak-tests-only:
          files: ["!$test"]
          deny:
            - pkg: go.uber.org/goleak
              desc: leak checks run in tests only
        testsupport-tests-only:
          files: ["!$test"]
          deny:
            - pkg: github.com/timkrebs/ryft/internal/testsupport
              desc: test helpers; tests only
    gosec:
      excludes:
        - G115 # int conversions: values here are bounded scores and minutes
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # model.ModelInfo and model.ModelChangeEntry keep their names: they mirror
      # the API and the Swift types. Nothing else may stutter.
      - linters: [revive]
        text: 'type name will be used as model\.Model(Info|ChangeEntry) by other packages'
      - path: _test\.go
        linters: [gosec, errcheck, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/timkrebs/ryft]
