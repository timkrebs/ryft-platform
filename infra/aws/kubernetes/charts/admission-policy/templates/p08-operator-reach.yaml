{{- /*
P8 ryft-operator-reach (C, U, CONNECT; the two operator service accounts). Where the
operators may write: the Cluster Operator in ryft-rabbitmq only, and there Secrets,
StatefulSets, Services, ConfigMaps, PVCs, ServiceAccounts, Roles, RoleBindings, Pod
UPDATEs (never a Pod CREATE) and pods/exec; the Topology Operator Secrets only, in
ryft-rabbitmq only. Their reads are T12-g's (admission cannot see reads).
*/ -}}
{{ include "admission.policyHead" (dict "root" . "name" "ryft-operator-reach" "id" "P8" "summary" "where the RabbitMQ operators may write") }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets", "services", "configmaps", "persistentvolumeclaims", "serviceaccounts", "pods"]
      - apiGroups: ["apps"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["statefulsets"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "rolebindings"]
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CONNECT"]
        resources: ["pods/exec"]
  matchConditions:
    - name: requester-is-an-operator
      expression: request.userInfo.username in {{ include "admission.cel.operatorUsers" . }}
  variables:
    - name: isCluster
      expression: request.userInfo.username == {{ include "admission.user.clusterOperator" . | toJson }}
    - name: res
      expression: |-
        request.resource.resource + (has(request.subResource) && request.subResource != '' ? '/' + request.subResource : '')
  validations:
    - expression: request.namespace == {{ .Values.broker.namespace | toJson }}
      message: "P8: the operators write only in ryft-rabbitmq."
      reason: Forbidden
    - expression: |-
        variables.isCluster ?
          (variables.res in ['secrets', 'statefulsets', 'services', 'configmaps', 'persistentvolumeclaims', 'serviceaccounts', 'roles', 'rolebindings'] ||
           (variables.res == 'pods' && request.operation == 'UPDATE') ||
           (variables.res == 'pods/exec' && request.operation == 'CONNECT')) :
          (variables.res == 'secrets')
      message: "P8: this operator may not write this resource."
      reason: Forbidden
---
{{ include "admission.binding" (dict "root" . "key" "operator-reach" "policy" "ryft-operator-reach" "id" "P8" "step" "C") }}
