{{- /*
P4 ryft-vso (C, U; all namespaces, any writer). The Vault Secrets Operator objects are
held to the shape infra/vault generates: keys are allowlisted per kind (the CRD-defaulted
ones included: skipTLSVerify, kubernetes.tokenExpirationSeconds, destination.create and
overwrite, hmacSecretData). Other secrets.hashicorp.com kinds are refused.

While the namespaces move from HCP Vault to the in-cluster Vault (one cutover PR at a time), P4
admits the union of what infra/vault generates for either target, field by field: an address from
vaultAddresses, caCertSecretRef absent or vault-ca, a VaultAuth namespace absent or under
admin/ryft/, the mount kv or kv-<service> (the service is the namespace without ryft-; the
reserved names in vso.reservedServices are never a service). The pairing is NOT enforced: each
object is judged alone and fields are not tied to each other (HCP's address with vault-ca, the
in-cluster address without a CA, or a mix of the two shapes in one namespace pass admission and
fail closed later, at TLS or at login). The decommission sets vso.kvMount and
vso.vaultNamespacePrefix to "" and leaves one address: then only the in-cluster fields pass.
*/ -}}
{{- $kvMounts := list -}}
{{- if .Values.vso.kvMount -}}{{- $kvMounts = append $kvMounts .Values.vso.kvMount -}}{{- end -}}
{{- $reservedMounts := list -}}
{{- range .Values.vso.reservedServices -}}{{- $reservedMounts = append $reservedMounts (printf "%s%s" $.Values.vso.kvMountPrefix .) -}}{{- end -}}
{{ include "admission.policyHead" (dict "root" . "name" "ryft-vso" "id" "P4" "summary" "Vault Secrets Operator objects keep the shape infra/vault generates") }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["secrets.hashicorp.com"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
  matchConditions:
    {{- include "admission.cond.finalizerRemoval" . | nindent 4 }}
  variables:
    - name: reqKind
      expression: request.kind.kind
    - name: spec
      expression: dyn(object).spec
    # The in-cluster Vault's mount of this namespace's service: kv-api in ryft-api, kv-monitoring in monitoring.
    - name: serviceMount
      expression: |-
        {{ .Values.vso.kvMountPrefix | toJson }} + (request.namespace.startsWith('ryft-') ? request.namespace.substring(5) : request.namespace)
  validations:
    - expression: variables.reqKind in ['VaultConnection', 'VaultAuth', 'VaultStaticSecret']
      message: "P4: only VaultConnection, VaultAuth and VaultStaticSecret are allowed."
      reason: Forbidden
    - expression: |-
        variables.reqKind != 'VaultConnection' ||
        (variables.spec.all(k, k in ['address', 'skipTLSVerify', 'caCertSecretRef']) &&
         has(variables.spec.address) && variables.spec.address in {{ .Values.vaultAddresses | toJson }} &&
         (!has(variables.spec.skipTLSVerify) || variables.spec.skipTLSVerify == false) &&
         (!has(variables.spec.caCertSecretRef) || variables.spec.caCertSecretRef == {{ .Values.vault.caCertificate | toJson }}))
      message: "P4: a VaultConnection must carry a RYFT Vault address, verify TLS, take a CA only from the Secret vault-ca, and set no header or timeout."
      reason: Forbidden
    - expression: |-
        variables.reqKind != 'VaultAuth' ||
        (variables.spec.all(k, k in ['vaultConnectionRef', 'namespace', 'method', 'mount', 'kubernetes']) &&
         has(variables.spec.method) && variables.spec.method == 'kubernetes' &&
         has(variables.spec.mount) && variables.spec.mount == {{ .Values.vso.authMount | toJson }} &&
         has(variables.spec.vaultConnectionRef) && variables.spec.vaultConnectionRef == {{ .Values.vso.connectionName | toJson }} &&
         {{- if .Values.vso.vaultNamespacePrefix }}
         (!has(variables.spec.namespace) || variables.spec.namespace.startsWith({{ .Values.vso.vaultNamespacePrefix | toJson }})) &&
         {{- else }}
         !has(variables.spec.namespace) &&
         {{- end }}
         has(variables.spec.kubernetes) &&
         variables.spec.kubernetes.all(k, k in ['role', 'serviceAccount', 'audiences', 'tokenExpirationSeconds']) &&
         has(variables.spec.kubernetes.audiences) && variables.spec.kubernetes.audiences == [{{ .Values.vso.audience | toJson }}])
      message: {{ if .Values.vso.vaultNamespacePrefix }}"P4: a VaultAuth must use the kubernetes method and mount, audience vault, the local VaultConnection, a Vault namespace under admin/ryft/, and no allowedNamespaces."{{ else }}"P4: a VaultAuth must use the kubernetes method and mount, audience vault, the local VaultConnection, no Vault namespace, and no allowedNamespaces."{{ end }}
      reason: Forbidden
    - expression: |-
        variables.reqKind != 'VaultStaticSecret' ||
        (variables.spec.all(k, k in ['vaultAuthRef', 'mount', 'type', 'path', 'refreshAfter', 'hmacSecretData', 'destination', 'rolloutRestartTargets']) &&
         has(variables.spec.vaultAuthRef) && !variables.spec.vaultAuthRef.contains('/') &&
         has(variables.spec.mount) && (variables.spec.mount in {{ $kvMounts | toJson }} || (variables.spec.mount == variables.serviceMount && !(variables.serviceMount in {{ $reservedMounts | toJson }}))) &&
         has(variables.spec.type) && variables.spec.type == 'kv-v2' &&
         (!has(variables.spec.rolloutRestartTargets) || variables.spec.rolloutRestartTargets.all(t, t.all(k, k in ['kind', 'name']))))
      message: {{ if .Values.vso.kvMount }}"P4: a VaultStaticSecret must use a local VaultAuth, type kv-v2 on the mount kv or kv-<its service> (never a reserved one), and set only the allowed keys."{{ else }}"P4: a VaultStaticSecret must use a local VaultAuth, type kv-v2 on the mount kv-<its service> (never a reserved one), and set only the allowed keys."{{ end }}
      reason: Forbidden
    - expression: |-
        variables.reqKind != 'VaultStaticSecret' ||
        (has(variables.spec.destination) &&
         variables.spec.destination.all(k, k in ['name', 'create', 'overwrite', 'labels', 'transformation']) &&
         has(variables.spec.destination.name) &&
         (variables.spec.destination.name in {{ .Values.vso.secretNames | toJson }} ||
          {{ .Values.vso.secretNamePrefixes | toJson }}.exists(p, variables.spec.destination.name.startsWith(p))) &&
         has(variables.spec.destination.transformation) &&
         variables.spec.destination.transformation.all(k, k == 'excludeRaw') &&
         has(variables.spec.destination.transformation.excludeRaw) && variables.spec.destination.transformation.excludeRaw == true)
      message: "P4: a VaultStaticSecret must write ryft-secrets or amqp-user-<name>, with excludeRaw true and no templates or transformation references."
      reason: Forbidden
---
{{ include "admission.binding" (dict "root" . "key" "vso" "policy" "ryft-vso" "id" "P4" "step" "A") }}
