# A local chart, not kubernetes_manifest: that needs the cert-manager CRDs at plan time (D25). What the upstream
# vault chart cannot render, or renders too wide (D188): the server Certificate, the CA bundle for the operator's CLI,
# the NetworkPolicies, the PodDisruptionBudget, the service-registration Role and the Raft snapshot CronJob (D192).
apiVersion: v2
name: vault-extras
description: The server certificate, the CA bundle, the NetworkPolicies, the disruption budget, the service-registration Role and the snapshot CronJob of Vault in namespace vault, for RYFT
type: application
version: 0.2.1  # bump on every template change, or the Helm provider does not upgrade it
