{{- /*
vault-tls: the server's certificate from the ryft-vault CA (charts/cluster-issuers, D190). One year, renewed 30 days
before (as the broker's, D98); Vault re-reads the files every 5 minutes (tls_reload_interval), so a renewal needs no
restart. The pod names are listed one by one: retry_join reaches each peer by vault-N.vault-internal.

vault-ca: the same shape as every RYFT namespace's (generated by infra/vault): only ca.crt is used, by the operator's
CLI (bootstrap: kubectl get secret vault-ca, never vault-tls, which holds the server's key) and by the snapshot job.
Its leaf is inert: Vault verifies no client certificates, and ryft-vault is no CA the broker trusts.
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: vault-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
  dnsNames:
    {{- required "tls.dnsNames is required" .Values.tls.dnsNames | toYaml | nindent 4 }}
  {{- with .Values.tls.ipAddresses }}
  ipAddresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  issuerRef:
    name: ryft-vault
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca
  namespace: {{ .Release.Namespace }}
spec:
  secretName: vault-ca
  commonName: vso.{{ .Release.Namespace }}
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
  issuerRef:
    name: ryft-vault
    kind: ClusterIssuer
    group: cert-manager.io
