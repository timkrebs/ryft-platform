{{- $servers := dict "letsencrypt-staging" "https://acme-staging-v02.api.letsencrypt.org/directory" "letsencrypt-prod" "https://acme-v02.api.letsencrypt.org/directory" }}
{{- range $name, $server := $servers }}
---
# {{ $name }}: ACME DNS-01 against Route 53 with the cert-manager Pod Identity role
# (ambient credentials, which cert-manager allows for ClusterIssuers).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    email: {{ required "email is required" $.Values.email | quote }}
    server: {{ $server }}
    privateKeySecretRef:
      name: {{ $name }}-account-key
    solvers:
      - selector:
          dnsZones:
            - {{ required "dnsZone is required" $.Values.dnsZone | quote }}
        dns01:
          route53:
            region: {{ required "region is required" $.Values.region | quote }}
            hostedZoneID: {{ required "hostedZoneID is required" $.Values.hostedZoneID | quote }}
{{- end }}
