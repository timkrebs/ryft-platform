# fixture: P3 ingress ipBlock vpc other port
# op: create
# as: system:serviceaccount:argocd:argocd-application-controller
# refused-by: ryft-netpol
# message: P3: an ingress ipBlock may only be the VPC CIDR on ports 9090 and 15692.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-from-nodes
  namespace: ryft-api
spec:
  ingress:
  - from:
    - ipBlock:
        cidr: 10.0.0.0/16
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app: api
  policyTypes:
  - Ingress
