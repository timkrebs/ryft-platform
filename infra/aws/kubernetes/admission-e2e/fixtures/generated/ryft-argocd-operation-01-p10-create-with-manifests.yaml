# fixture: P10 create with manifests
# op: create
# as: system:serviceaccount:argocd:argocd-server
# refused-by: ryft-argocd-operation
# message: P10: a sync operation must not carry local manifests or a source of its own.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "0"
  name: vault-api
  namespace: argocd
operation:
  sync:
    manifests:
    - x
spec:
  destination:
    namespace: ryft-api
    server: https://kubernetes.default.svc
  project: ryft
  source:
    path: deploy/k8s/overlays/vault-namespaces/api
    repoURL: https://github.com/timkrebs/ryft-platform.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 5m
      limit: 2
    syncOptions:
    - ServerSideApply=true
    - PruneLast=true
    - CreateNamespace=false
