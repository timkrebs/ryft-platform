# fixture: P11 additional plugin
# op: create
# as: system:serviceaccount:argocd:argocd-application-controller
# refused-by: ryft-broker
# message: P11: the broker's plugins and configuration are pinned (broker.additionalPlugins and additionalConfigLines in the chart); advancedConfig, envConfig and erlangInetConfig are refused.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: rabbitmq
  namespace: ryft-rabbitmq
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: rabbitmq
        topologyKey: kubernetes.io/hostname
  image: docker.io/library/rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
  override:
    statefulSet:
      spec:
        template:
          metadata:
            annotations:
              prometheus.io/path: /metrics
              prometheus.io/port: "15692"
              prometheus.io/scrape: "true"
  persistence:
    storage: 10Gi
    storageClassName: gp3-encrypted
  rabbitmq:
    additionalConfig: |
      # Metrics stay plain on 15692 for the collectors' scrape (counters, queue names,
      # no messages); per queue, for the backlog alerts.
      prometheus.tcp.port = 15692
      prometheus.return_per_object_metrics = true
      vm_memory_high_watermark.relative = 0.6
      disk_free_limit.absolute = 1GB
      log.console.formatter = json
    additionalPlugins:
    - rabbitmq_shovel
  replicas: 3
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 1Gi
  terminationGracePeriodSeconds: 600
  tls:
    caSecretName: rabbitmq-tls
    disableNonTLSListeners: true
    secretName: rabbitmq-tls
