# fixture: P6 webhook on pods
# op: create
# as: system:serviceaccount:argocd:argocd-application-controller
# refused-by: ryft-operators-cluster
# message: P6: a webhook configuration must be one of the operators', served from rabbitmq-system, on rabbitmq.com only.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: rabbitmq-system/cluster-operator-serving-cert
  name: cluster-operator-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: cluster-operator-webhook-service
      namespace: rabbitmq-system
      path: /validate-rabbitmq-com-v1beta1-rabbitmqcluster
  failurePolicy: Fail
  name: vrabbitmqcluster-v1beta1.kb.io
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - rabbitmqclusters
  sideEffects: None
