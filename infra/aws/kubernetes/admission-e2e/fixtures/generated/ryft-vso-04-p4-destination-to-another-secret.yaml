# fixture: P4 destination to another secret
# op: create
# as: kubernetes-admin
# refused-by: ryft-vso
# message: P4: a VaultStaticSecret must write ryft-secrets or amqp-user-<name>, with excludeRaw true and no templates or transformation references.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryft-secrets
  namespace: ryft-api
spec:
  destination:
    create: true
    name: vault-auth-token
    overwrite: true
    transformation:
      excludeRaw: true
  hmacSecretData: true
  mount: kv
  path: config
  refreshAfter: 1h
  rolloutRestartTargets:
  - kind: Deployment
    name: api
  type: kv-v2
  vaultAuthRef: api
