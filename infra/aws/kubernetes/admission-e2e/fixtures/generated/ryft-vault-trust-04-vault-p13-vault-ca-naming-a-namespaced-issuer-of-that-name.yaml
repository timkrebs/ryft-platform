# fixture: vault: P13 vault-ca naming a namespaced Issuer of that name
# op: create
# as: system:serviceaccount:argocd:argocd-application-controller
# refused-by: ryft-vault-trust
# message: P13: a Certificate for ryft-vault must name the ClusterIssuer ryft-vault of cert-manager.io.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca
  namespace: ryft-api
spec:
  commonName: vso.ryft-api
  duration: 8760h
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: ryft-vault
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  secretName: vault-ca
  usages:
  - digital signature
