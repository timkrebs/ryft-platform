# fixture: vault: P13 another Certificate writing the Secret vault-ca
# op: create
# as: system:serviceaccount:argocd:argocd-application-controller
# refused-by: ryft-vault-trust
# message: P13: the Secrets vault-ca and vault/vault-tls may be written only by a Certificate of the ClusterIssuer ryft-vault.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-ca
  namespace: ryft-api
spec:
  commonName: api-ca
  duration: 8760h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: ryft-internal
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  secretName: vault-ca
  usages:
  - digital signature
