# P12 ryft-argo-scope (docs/work/2026-10-23-admission/p12-argo-scope.md): where Argo CD's service
# accounts may write. Writes that are no CREATE, and the requests that must pass. The CREATE
# negatives of P12 are generated (generated/ryft-argo-scope-*: a Deployment in cert-manager as the
# controller, a lookalike of the controller, the server creating a CRD, the controller creating a
# ClusterIssuer). Format: see argo-cd.yaml; the objects are the stand-ins of ../baseline/objects.yaml
# (argocd-cm, argocd-rbac-cm, argocd-secret without server.secretkey, Deployment argocd-server in argocd,
# Deployment argo-scope-scale-target in ryft-api, Job argo-scope-hook in ryft-migrate); kube-system/coredns is the
# kind cluster's own. The requests that need a real change of state (the first server.secretkey, then a
# change of it) are not here: scripts/lib/admission_lib.sh, adm_argo_scope_secretkey. exec as the
# controller is in adm_claim_c (it needs a running Pod).
#
# The five messages, in the order the API server reports them (the first rule that fails):
#   r1 P12: Argo CD writes no subresource and opens no connection to a pod, service or node.
#   r2 P12: of Argo CD's service accounts only the application controller and the server write ...
#   r3 P12: argocd-server writes only Applications and events in argocd ...
#   r4 P12: Argo CD's controller writes namespaced objects only in the namespaces of its apps ...
#   r5 P12: Argo CD's controller writes cluster-scoped objects only of the kinds and names its apps render ...
