  # From the root namespace: on HCP Vault Dedicated this starts with admin/.
  namespace: admin/ryft/rabbitmq
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: rabbitmq
    serviceAccount: rabbitmq
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: amqp-user-api
  namespace: ryft-rabbitmq
spec:
  vaultAuthRef: rabbitmq
  mount: kv
  type: kv-v2
  path: amqp-user-api
  refreshAfter: 1h
  destination:
    name: amqp-user-api
    create: true
    overwrite: true
    # The Topology Operator imports a user's credentials only from a Secret with this
    # label (it refuses the User object otherwise).
    labels:
      rabbitmq.com/topology-operator: "true"
    transformation:
      excludeRaw: true
