# Generated by infra/vault — do not edit by hand (terraform apply rewrites it).
# The in-cluster Vault's trust (D190): cert-manager writes Secret vault-ca, whose ca.crt the VaultConnection names.
# Only ca.crt is used; the leaf is inert (no SAN, and ryft-vault is no CA the broker trusts).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca
  namespace: ryft-api
spec:
  secretName: vault-ca
  commonName: vso.ryft-api
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
  issuerRef:
    name: ryft-vault
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: ryft-api
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  address: https://vault.vault.svc:8200
  skipTLSVerify: false
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: api
  namespace: ryft-api
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultConnectionRef: vault
  # Vault Community Edition: no namespace (the isolation is the role, the policy and the mount).
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: api
    serviceAccount: api
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryft-secrets
  namespace: ryft-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: api
  mount: kv-api
  type: kv-v2
  path: config
  refreshAfter: 1h
  destination:
    name: ryft-secrets
    create: true
    overwrite: true
    # Only the keys themselves: no `_raw` copy of the whole secret, which envFrom
    # would turn into one more variable holding every credential.
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: api
