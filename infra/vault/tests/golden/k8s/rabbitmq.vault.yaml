  namespace: ryft-rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultConnectionRef: vault
  # Vault Community Edition: no namespace (the isolation is the role, the policy and the mount).
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: rabbitmq
    serviceAccount: rabbitmq
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: amqp-user-api
  namespace: ryft-rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: rabbitmq
  mount: kv-rabbitmq
  type: kv-v2
  path: amqp-user-api
  refreshAfter: 1h
  destination:
    name: amqp-user-api
    create: true
    overwrite: true
    # The Topology Operator imports a user's credentials only from a Secret with this
    # label (it refuses the User object otherwise).
    labels:
