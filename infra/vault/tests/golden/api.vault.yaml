# Generated by infra/vault — do not edit by hand (terraform apply rewrites it).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: ryft-api
spec:
  address: https://vault.example.hashicorp.cloud:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: api
  namespace: ryft-api
spec:
  vaultConnectionRef: vault
  # From the root namespace: on HCP Vault Dedicated this starts with admin/.
  namespace: admin/ryft/api
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: api
    serviceAccount: api
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryft-secrets
  namespace: ryft-api
spec:
  vaultAuthRef: api
  mount: kv
  type: kv-v2
  path: config
  refreshAfter: 1h
  destination:
    name: ryft-secrets
    create: true
    overwrite: true
    # Only the keys themselves: no `_raw` copy of the whole secret, which envFrom
    # would turn into one more variable holding every credential.
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: api
