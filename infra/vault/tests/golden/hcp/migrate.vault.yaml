# Generated by infra/vault — do not edit by hand (terraform apply rewrites it).
# The in-cluster Vault's trust: cert-manager writes Secret vault-ca, whose ca.crt the VaultConnection names once
# this namespace reads that Vault (D190). Only ca.crt is used; the leaf is inert (no SAN, and ryft-vault is no CA
# the broker trusts).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca
  namespace: ryft-migrate
spec:
  secretName: vault-ca
  commonName: vso.ryft-migrate
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
  issuerRef:
    name: ryft-vault
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: ryft-migrate
spec:
  address: https://vault.example.hashicorp.cloud:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: migrate
  namespace: ryft-migrate
spec:
  vaultConnectionRef: vault
  # From the root namespace: on HCP Vault Dedicated this starts with admin/.
  namespace: admin/ryft/migrate
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: migrate
    serviceAccount: migrate
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryft-secrets
  namespace: ryft-migrate
spec:
  vaultAuthRef: migrate
  mount: kv
  type: kv-v2
  path: config
  refreshAfter: 1h
  destination:
    name: ryft-secrets
    create: true
    overwrite: true
    # Only the keys themselves: no `_raw` copy of the whole secret, which envFrom
    # would turn into one more variable holding every credential.
    transformation:
      excludeRaw: true
