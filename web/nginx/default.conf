# ryftapp.de: the static export of web/ (Next.js, out/), ported from the platform's
# base/web/default.conf. English at /…, German at /de/…, the app's universal-link paths
# show /open.html on a device without the app, and Apple fetches
# /.well-known/apple-app-site-association without following redirects and expects
# application/json. Security headers, including the CSP with the hashes of the site's
# inline scripts (scripts/csp.mjs), come from snippets/headers.conf, which every location
# that sets its own header includes again (nginx doesn't merge add_header across levels).

# Not in nginx's mime.types. This file is included in the http block, where types merge.
types {
    application/manifest+json webmanifest;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Behind the TLS-terminating ingress: Location headers stay relative (/privacy).
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/plain application/json application/manifest+json image/svg+xml application/xml;

    # Text files are precompressed at build time (*.gz); gzip on the fly for anything else.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/json application/manifest+json image/svg+xml application/xml;

    error_page 404 /404.html;
    include /etc/nginx/snippets/headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Apple's lookup: exact path, no redirect, application/json, no compression games.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        types { }
        charset off;
        gzip_static off;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/headers.conf;
    }

    # The app's universal links on a device without the app. An auth callback's URL
    # carries tokens and an invite link a code: never cached, never sent on
    # (Referrer-Policy), and no script reads it.
    location ~ ^/(day|sleep|insights|train|auth|invite)(/|$) {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/headers.conf;
        try_files /open.html =404;
    }

    # Content-hashed CSS and fonts: cache for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/headers.conf;
        try_files $uri =404;
    }

    # Stable names in public/ (icons, screenshots, OG images, manifest): a day.
    location ~* \.(png|svg|avif|webp|ico|webmanifest|xml|txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/headers.conf;
        try_files $uri =404;
    }

    # One canonical form: /privacy/ → /privacy, /de/ → /de (the home page keeps its slash).
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Pages: /privacy → privacy.html, /de → de.html, /privacy/2026-10-20 → …/2026-10-20.html.
    location / {
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/headers.conf;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/headers.conf;
    }
}
