# Security headers for every response (included in each location that adds its own): the
# shared headers plus the marketing CSP, generated by scripts/csp.mjs after the build:
# script-src 'none' (the marketing pages ship no script since web D19, and the build fails if
# one appears); styles, fonts and images only from this origin; connect-src 'none'. The admin
# page has its own snippet (headers-admin.conf); never include both in one location.
include /etc/nginx/snippets/headers-common.conf;
include /etc/nginx/snippets/csp.conf;
