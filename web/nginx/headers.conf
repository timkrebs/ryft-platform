# Security headers for every response (included in each location that adds its own).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
# Generated by scripts/csp.mjs after the build: script-src lists the SHA-256 of every
# inline script in out/; styles, fonts and images only from this origin.
include /etc/nginx/snippets/csp.conf;
