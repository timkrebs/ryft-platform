# Security headers for /admin (location = /admin only): the shared headers plus the admin
# page's own CSP (scripts/csp.mjs → csp-admin.conf): one script hash, connect-src exactly the
# api and the Supabase project, trusted-types 'none'. NEVER include this together with
# headers.conf in one location: two Content-Security-Policy headers intersect, and the
# marketing policy's connect-src 'none' would win.
include /etc/nginx/snippets/headers-common.conf;
include /etc/nginx/snippets/csp-admin.conf;
